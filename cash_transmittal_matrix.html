<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Dynamic Matrix Widget</title>
  <script src="//js.jotform.com/JotFormCustomWidget.min.js"></script>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      margin: 0;
      padding: 12px;
      color: #1a1a1a;
    }

    #main {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-width: 1200px;
    }

    .table-wrapper {
      overflow-x: auto;
    }

    .matrix-table {
      width: 100%;
      border-collapse: collapse;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.08);
    }

    .matrix-table th,
    .matrix-table td {
      border: 1px solid #dcdcdc;
      padding: 5px;
      vertical-align: middle;
    }

    .matrix-table th {
      background: #4a5568;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.02em;
      color: #ffffff;
    }

    .matrix-table tbody tr:nth-child(odd) {
      background-color: #ffffff;
    }

    .matrix-table tbody tr:nth-child(even) {
      background-color: #f7fafc;
    }

    .matrix-table input,
    .matrix-table select {
      width: 100%;
      box-sizing: border-box;
      padding: 6px 8px;
      font-size: 13px;
      border-radius: 4px;
      border: 1px solid #d7deea;
      background: #fff;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .matrix-table input:focus,
    .matrix-table select:focus {
      outline: none;
      border-color: #2d6cdf;
      box-shadow: 0 0 0 2px rgba(45, 108, 223, 0.15);
    }

    .matrix-table input.invalid-loan {
      background-color: #fff3cd;
      border-color: #ffc107;
    }

    .matrix-table input.required-missing {
      background-color: #fee2e2;
      border-color: #ef4444;
    }

    .loan-allocations {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .loan-row {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .loan-row input {
      width: auto;
    }

    .loan-row input[name="loanNumber"] {
      width: 90px;
    }

    .loan-row input[name="amount"] {
      width: 80px;
      text-align: right;
    }

    .loan-add-btn {
      background: #2d6cdf;
      color: #fff;
      border: none;
      border-radius: 4px;
      width: 24px;
      height: 24px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .loan-add-btn:hover {
      background: #1e5bc6;
    }

    .loan-remove-btn {
      background: #e55353;
      color: #fff;
      border: none;
      border-radius: 4px;
      width: 24px;
      height: 24px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .loan-remove-btn:hover {
      background: #dc2626;
    }

    .actions-cell {
      display: flex;
      gap: 6px;
      justify-content: center;
      align-items: center;
    }

    .action-btn {
      background: #2d6cdf;
      color: #fff;
      border: none;
      border-radius: 4px;
      width: 32px;
      height: 32px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .action-btn:hover {
      background: #1e5bc6;
    }

    .action-btn.remove-btn {
      background: #e55353;
    }

    .action-btn.remove-btn:hover {
      background: #dc2626;
    }

    .action-btn svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }

    .totals {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
    }

    .total-field {
      font-weight: bold;
      padding: 8px 14px;
      border-radius: 4px;
      font-size: 13px;
    }

    .total-check-cash {
      background: #e0e7ff;
      color: #3730a3;
    }

    .total-allocated {
      background: #d1fae5;
      color: #065f46;
    }

    .total-difference {
      background: #fef3c7;
      color: #92400e;
    }

    .total-difference.balanced {
      background: #d1fae5;
      color: #065f46;
    }

    .total-difference.over {
      background: #fee2e2;
      color: #991b1b;
    }

    .total-difference.under {
      background: #fef3c7;
      color: #92400e;
    }
  </style>
</head>
<body>
  <div id="main">
    <div class="table-wrapper">
      <table class="matrix-table" aria-label="Payment transmittal matrix">
        <thead>
          <tr>
            <th id="col-borrower">Borrower Name</th>
            <th id="col-remitter">Remitter Name</th>
            <th id="col-payment-type">Cash or Check</th>
            <th id="col-check-cash">Check/Cash Amount</th>
            <th id="col-date">Effective Date</th>
            <th id="col-loan">Loan # / Amount</th>
            <th id="col-remarks">Remarks</th>
            <th id="col-actions">Actions</th>
          </tr>
        </thead>
        <tbody id="matrixBody"></tbody>
      </table>
    </div>
    <div class="totals">
      <div class="total-field total-check-cash">Total Check/Cash: <span id="totalCheckCash">$0.00</span></div>
      <div class="total-field total-allocated">Total Allocated: <span id="totalAllocated">$0.00</span></div>
      <div class="total-field total-difference" id="differenceField">Difference: <span id="totalDifference">$0.00</span></div>
    </div>
  </div>

  <script type="text/javascript">
    var matrixBody = document.getElementById('matrixBody');
    var totalCheckCashEl = document.getElementById('totalCheckCash');
    var totalAllocatedEl = document.getElementById('totalAllocated');
    var totalDifferenceEl = document.getElementById('totalDifference');
    var differenceField = document.getElementById('differenceField');
    var initialized = false;

    // Default settings
    var settings = {
      columnHeaders: {
        borrower: 'Borrower Name',
        remitter: 'Remitter Name',
        paymentType: 'Cash or Check',
        checkCashAmount: 'Check/Cash Amount',
        effectiveDate: 'Effective Date',
        loanAmount: 'Loan # / Amount',
        remarks: 'Remarks',
        actions: 'Actions'
      },
      paymentTypes: ['Cash', 'Check', 'Money Order'],
      placeholders: {
        borrower: 'Borrower Name',
        remitter: 'Remitter Name',
        checkCashAmount: '0.00',
        loanNumber: 'Loan #',
        amount: '0.00',
        remarks: 'Remarks'
      }
    };

    function formatCurrency(value) {
      var numberValue = Number(value);
      if (Number.isNaN(numberValue)) {
        return '$0.00';
      }
      return '$' + numberValue.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function parseCurrency(value) {
      return parseFloat(value) || 0;
    }

    function isValidLoanNumber(value) {
      if (!value || value.trim() === '') return true; // Empty is okay, validation handles required
      var cleaned = value.trim();
      return /^\d{6,7}$/.test(cleaned);
    }

    function createCellInput(type, name, placeholder) {
      var input = document.createElement('input');
      input.type = type;
      input.name = name;
      input.autocomplete = 'off';
      input.setAttribute('autocomplete', 'off');
      input.setAttribute('data-lpignore', 'true');
      input.setAttribute('data-form-type', 'other');
      if (placeholder) {
        input.placeholder = placeholder;
      }
      if (type === 'number') {
        input.step = '0.01';
        input.min = '0';
      }
      input.addEventListener('input', handleInputChange);
      input.addEventListener('blur', function() {
        updateData();
      });
      return input;
    }

    function createSelect(name, options) {
      var select = document.createElement('select');
      select.name = name;
      select.autocomplete = 'off';
      options.forEach(function(optionValue) {
        var option = document.createElement('option');
        option.value = optionValue;
        option.textContent = optionValue;
        select.appendChild(option);
      });
      select.addEventListener('change', function() {
        handleInputChange();
        updateData();
      });
      return select;
    }

    function createLoanAllocationRow(container, isFirst) {
      var loanRow = document.createElement('div');
      loanRow.className = 'loan-row';

      var loanInput = createCellInput('text', 'loanNumber', settings.placeholders.loanNumber);
      loanInput.addEventListener('input', function() {
        if (isValidLoanNumber(this.value)) {
          this.classList.remove('invalid-loan');
        } else {
          this.classList.add('invalid-loan');
        }
        updateTotals();
        updateData();
      });

      var amountInput = createCellInput('number', 'amount', settings.placeholders.amount);
      amountInput.addEventListener('input', function() {
        updateTotals();
        updateData();
      });

      loanRow.appendChild(loanInput);
      loanRow.appendChild(amountInput);

      if (isFirst) {
        var addBtn = document.createElement('button');
        addBtn.type = 'button';
        addBtn.className = 'loan-add-btn';
        addBtn.textContent = '+';
        addBtn.title = 'Add another loan allocation';
        addBtn.tabIndex = 0;
        addBtn.addEventListener('click', function() {
          createLoanAllocationRow(container, false);
          updateData();
        });
        loanRow.appendChild(addBtn);
      } else {
        var removeBtn = document.createElement('button');
        removeBtn.type = 'button';
        removeBtn.className = 'loan-remove-btn';
        removeBtn.textContent = '×';
        removeBtn.title = 'Remove this loan allocation';
        removeBtn.tabIndex = 0;
        removeBtn.addEventListener('click', function() {
          loanRow.remove();
          updateTotals();
          updateData();
        });
        loanRow.appendChild(removeBtn);
      }

      container.appendChild(loanRow);
      return loanRow;
    }

    function addRow(defaults) {
      var row = document.createElement('tr');
      row.className = 'transmittal-row';

      // Borrower
      var borrowerCell = document.createElement('td');
      var borrowerInput = createCellInput('text', 'borrower', settings.placeholders.borrower);
      borrowerCell.appendChild(borrowerInput);
      row.appendChild(borrowerCell);

      // Remitter
      var remitterCell = document.createElement('td');
      remitterCell.appendChild(createCellInput('text', 'remitter', settings.placeholders.remitter));
      row.appendChild(remitterCell);

      // Payment Type
      var paymentTypeCell = document.createElement('td');
      paymentTypeCell.appendChild(createSelect('paymentType', settings.paymentTypes));
      row.appendChild(paymentTypeCell);

      // Check/Cash Amount
      var checkCashCell = document.createElement('td');
      var checkCashInput = createCellInput('number', 'checkCashAmount', settings.placeholders.checkCashAmount);
      checkCashInput.addEventListener('input', function() {
        updateTotals();
        updateData();
      });
      checkCashCell.appendChild(checkCashInput);
      row.appendChild(checkCashCell);

      // Effective Date
      var dateCell = document.createElement('td');
      dateCell.appendChild(createCellInput('date', 'effectiveDate'));
      row.appendChild(dateCell);

      // Loan Allocations
      var loanCell = document.createElement('td');
      var loanAllocations = document.createElement('div');
      loanAllocations.className = 'loan-allocations';
      createLoanAllocationRow(loanAllocations, true);
      loanCell.appendChild(loanAllocations);
      row.appendChild(loanCell);

      // Remarks
      var remarksCell = document.createElement('td');
      remarksCell.appendChild(createCellInput('text', 'remarks', settings.placeholders.remarks));
      row.appendChild(remarksCell);

      // Actions
      var actionsCell = document.createElement('td');
      var actionsDiv = document.createElement('div');
      actionsDiv.className = 'actions-cell';

      // Copy Borrower button
      var copyBorrowerBtn = document.createElement('button');
      copyBorrowerBtn.type = 'button';
      copyBorrowerBtn.className = 'action-btn';
      copyBorrowerBtn.title = 'Copy Borrower to next row';
      copyBorrowerBtn.tabIndex = 0;
      copyBorrowerBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>';
      copyBorrowerBtn.addEventListener('click', function() {
        copyBorrower(row);
      });
      actionsDiv.appendChild(copyBorrowerBtn);

      // Remove button
      var removeBtn = document.createElement('button');
      removeBtn.type = 'button';
      removeBtn.className = 'action-btn remove-btn';
      removeBtn.title = 'Remove row';
      removeBtn.tabIndex = -1;
      removeBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12 19 6.41z"/></svg>';
      removeBtn.addEventListener('click', function() {
        var rows = matrixBody.querySelectorAll('tr.transmittal-row');
        if (rows.length > 1) {
          row.remove();
          updateTotals();
          ensureEmptyRow();
          updateData();
          notifyHeight();
        }
      });
      actionsDiv.appendChild(removeBtn);

      actionsCell.appendChild(actionsDiv);
      row.appendChild(actionsCell);

      matrixBody.appendChild(row);

      // Apply defaults if provided
      if (defaults) {
        if (defaults.borrower) {
          row.querySelector('[name="borrower"]').value = defaults.borrower;
        }
        if (defaults.remitter) {
          row.querySelector('[name="remitter"]').value = defaults.remitter;
        }
      }

      updateTotals();
      notifyHeight();
      return row;
    }

    function copyBorrower(sourceRow) {
      var borrower = sourceRow.querySelector('[name="borrower"]').value;
      var remitter = sourceRow.querySelector('[name="remitter"]').value;

      var rows = matrixBody.querySelectorAll('tr.transmittal-row');
      var lastRow = rows[rows.length - 1];

      if (isRowEmpty(lastRow)) {
        lastRow.querySelector('[name="borrower"]').value = borrower;
        lastRow.querySelector('[name="remitter"]').value = remitter;
        lastRow.querySelector('[name="borrower"]').focus();
      } else {
        var newRow = addRow({ borrower: borrower, remitter: remitter });
        newRow.querySelector('[name="paymentType"]').focus();
      }

      ensureEmptyRow();
      updateData();
    }

    function updateTotals() {
      var rows = matrixBody.querySelectorAll('tr.transmittal-row');
      var totalCheckCash = 0;
      var totalAllocated = 0;

      rows.forEach(function(row) {
        var checkCashValue = parseCurrency(row.querySelector('[name="checkCashAmount"]').value);
        totalCheckCash += checkCashValue;

        var loanRows = row.querySelectorAll('.loan-row');
        loanRows.forEach(function(loanRow) {
          var amountInput = loanRow.querySelector('[name="amount"]');
          if (amountInput) {
            totalAllocated += parseCurrency(amountInput.value);
          }
        });
      });

      var difference = totalCheckCash - totalAllocated;

      totalCheckCashEl.textContent = formatCurrency(totalCheckCash);
      totalAllocatedEl.textContent = formatCurrency(totalAllocated);
      totalDifferenceEl.textContent = formatCurrency(Math.abs(difference));

      // Update difference styling
      differenceField.classList.remove('balanced', 'over', 'under');
      if (Math.abs(difference) < 0.01) {
        differenceField.classList.add('balanced');
        totalDifferenceEl.textContent = '$0.00 ✓';
      } else if (difference > 0) {
        differenceField.classList.add('under');
        totalDifferenceEl.textContent = formatCurrency(difference) + ' under';
      } else {
        differenceField.classList.add('over');
        totalDifferenceEl.textContent = formatCurrency(Math.abs(difference)) + ' over';
      }
    }

    function handleInputChange(event) {
      var targetRow = event ? event.target.closest('tr.transmittal-row') : null;

      if (targetRow && isLastRow(targetRow) && !isRowEmpty(targetRow)) {
        var rows = matrixBody.querySelectorAll('tr.transmittal-row');
        var lastRow = rows[rows.length - 1];
        if (!isRowEmpty(lastRow)) {
          addRow();
        }
      }

      updateTotals();
    }

    function isRowEmpty(row) {
      var borrower = row.querySelector('[name="borrower"]').value.trim();
      var checkCash = row.querySelector('[name="checkCashAmount"]').value.trim();
      var loanInputs = row.querySelectorAll('[name="loanNumber"]');
      var hasLoan = false;
      loanInputs.forEach(function(input) {
        if (input.value.trim() !== '') hasLoan = true;
      });

      return borrower === '' && checkCash === '' && !hasLoan;
    }

    function isLastRow(row) {
      var rows = matrixBody.querySelectorAll('tr.transmittal-row');
      return rows.length && rows[rows.length - 1] === row;
    }

    function ensureEmptyRow() {
      var rows = matrixBody.querySelectorAll('tr.transmittal-row');
      if (!rows.length) {
        addRow();
        addRow();
        return;
      }
      var lastRow = rows[rows.length - 1];
      if (!isRowEmpty(lastRow)) {
        addRow();
      }
    }

    function collectRows() {
      var rows = [];
      var transmittalRows = matrixBody.querySelectorAll('tr.transmittal-row');

      transmittalRows.forEach(function(row, index) {
        var borrower = row.querySelector('[name="borrower"]').value.trim();
        var checkCash = row.querySelector('[name="checkCashAmount"]').value;

        // Skip completely empty rows
        if (borrower === '' && checkCash === '') {
          var hasAnyLoan = false;
          row.querySelectorAll('[name="loanNumber"]').forEach(function(input) {
            if (input.value.trim() !== '') hasAnyLoan = true;
          });
          if (!hasAnyLoan) return;
        }

        var loanAllocations = [];
        var loanRows = row.querySelectorAll('.loan-row');
        loanRows.forEach(function(loanRow) {
          var loanNumber = loanRow.querySelector('[name="loanNumber"]').value.trim();
          var amount = loanRow.querySelector('[name="amount"]').value;
          if (loanNumber !== '' || amount !== '') {
            loanAllocations.push({
              loanNumber: loanNumber,
              amount: parseCurrency(amount).toFixed(2)
            });
          }
        });

        rows.push({
          rowNumber: rows.length + 1,
          borrower: borrower,
          remitter: row.querySelector('[name="remitter"]').value.trim(),
          paymentType: row.querySelector('[name="paymentType"]').value,
          checkCashAmount: parseCurrency(checkCash).toFixed(2),
          effectiveDate: row.querySelector('[name="effectiveDate"]').value,
          loanAllocations: loanAllocations,
          remarks: row.querySelector('[name="remarks"]').value.trim()
        });
      });

      return rows;
    }

    function buildFormattedText(rows, totalCheckCash, totalAllocated, difference) {
      var lines = [];
      lines.push('PAYMENT TRANSMITTAL SUMMARY');
      lines.push('='.repeat(50));
      lines.push('');

      rows.forEach(function(row, index) {
        lines.push('--- Entry #' + row.rowNumber + ' ---');
        lines.push('Borrower: ' + (row.borrower || 'N/A'));
        if (row.remitter) {
          lines.push('Remitter: ' + row.remitter);
        }
        lines.push('Payment Type: ' + row.paymentType);
        lines.push('Check/Cash Amount: $' + row.checkCashAmount);
        if (row.effectiveDate) {
          lines.push('Effective Date: ' + row.effectiveDate);
        }

        if (row.loanAllocations.length > 0) {
          lines.push('Loan Allocations:');
          row.loanAllocations.forEach(function(loan) {
            lines.push('  • Loan #' + loan.loanNumber + ': $' + loan.amount);
          });
        }

        if (row.remarks) {
          lines.push('Remarks: ' + row.remarks);
        }
        lines.push('');
      });

      lines.push('='.repeat(50));
      lines.push('TOTALS');
      lines.push('Total Check/Cash Received: $' + totalCheckCash);
      lines.push('Total Allocated to Loans: $' + totalAllocated);
      var diff = parseFloat(totalCheckCash) - parseFloat(totalAllocated);
      if (Math.abs(diff) < 0.01) {
        lines.push('Difference: $0.00 (Balanced)');
      } else if (diff > 0) {
        lines.push('Difference: $' + diff.toFixed(2) + ' (Under-allocated)');
      } else {
        lines.push('Difference: $' + Math.abs(diff).toFixed(2) + ' (Over-allocated)');
      }
      lines.push('Total Entries: ' + rows.length);

      return lines.join('\n');
    }

    function updateData() {
      var rows = collectRows();

      var totalCheckCash = 0;
      var totalAllocated = 0;

      rows.forEach(function(row) {
        totalCheckCash += parseCurrency(row.checkCashAmount);
        row.loanAllocations.forEach(function(loan) {
          totalAllocated += parseCurrency(loan.amount);
        });
      });

      var difference = totalCheckCash - totalAllocated;

      var jsonData = {
        rows: rows,
        totalCheckCash: totalCheckCash.toFixed(2),
        totalAllocated: totalAllocated.toFixed(2),
        difference: difference.toFixed(2),
        rowCount: rows.length
      };

      var formattedText = buildFormattedText(rows, totalCheckCash.toFixed(2), totalAllocated.toFixed(2), difference.toFixed(2));

      var payload = {
        json: jsonData,
        formatted: formattedText
      };

      if (typeof JFCustomWidget !== 'undefined') {
        try {
          JFCustomWidget.sendData(payload);
        } catch (e) {
          console.log('Error sending data:', e);
        }
      }
    }

    function notifyHeight() {
      if (typeof JFCustomWidget !== 'undefined') {
        try {
          JFCustomWidget.requestFrameResize();
        } catch (e) {
          console.log('Height notification error:', e);
        }
      }
    }

    function applySettings() {
      if (settings.columnHeaders) {
        if (settings.columnHeaders.borrower) document.getElementById('col-borrower').textContent = settings.columnHeaders.borrower;
        if (settings.columnHeaders.remitter) document.getElementById('col-remitter').textContent = settings.columnHeaders.remitter;
        if (settings.columnHeaders.paymentType) document.getElementById('col-payment-type').textContent = settings.columnHeaders.paymentType;
        if (settings.columnHeaders.checkCashAmount) document.getElementById('col-check-cash').textContent = settings.columnHeaders.checkCashAmount;
        if (settings.columnHeaders.effectiveDate) document.getElementById('col-date').textContent = settings.columnHeaders.effectiveDate;
        if (settings.columnHeaders.loanAmount) document.getElementById('col-loan').textContent = settings.columnHeaders.loanAmount;
        if (settings.columnHeaders.remarks) document.getElementById('col-remarks').textContent = settings.columnHeaders.remarks;
        if (settings.columnHeaders.actions) document.getElementById('col-actions').textContent = settings.columnHeaders.actions;
      }
    }

    function initializeWidget() {
      if (initialized) return;
      initialized = true;

      applySettings();

      // Add first working row
      addRow();
      // Add second blank/optional row
      addRow();

      updateData();
      notifyHeight();
    }

    // Initialize on DOM ready as fallback
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', function() {
        setTimeout(initializeWidget, 100);
      });
    } else {
      setTimeout(initializeWidget, 100);
    }

    // JotForm widget initialization
    if (typeof JFCustomWidget !== 'undefined') {
      JFCustomWidget.subscribe('ready', function() {
        // Load custom settings from JotForm
        var columnHeaders = JFCustomWidget.getWidgetSetting('columnHeaders');
        if (columnHeaders) {
          try {
            var headers = columnHeaders.split(',');
            if (headers.length >= 7) {
              settings.columnHeaders.borrower = headers[0].trim();
              settings.columnHeaders.remitter = headers[1].trim();
              settings.columnHeaders.paymentType = headers[2].trim();
              settings.columnHeaders.checkCashAmount = headers[3].trim();
              settings.columnHeaders.effectiveDate = headers[4].trim();
              settings.columnHeaders.loanAmount = headers[5].trim();
              settings.columnHeaders.remarks = headers[6].trim();
            }
          } catch (e) {
            console.log('Error parsing column headers:', e);
          }
        }

        var paymentTypes = JFCustomWidget.getWidgetSetting('paymentTypes');
        if (paymentTypes) {
          try {
            settings.paymentTypes = paymentTypes.split(',').map(function(item) {
              return item.trim();
            }).filter(function(item) {
              return item !== '';
            });
          } catch (e) {
            console.log('Error parsing payment types:', e);
          }
        }

        var placeholders = JFCustomWidget.getWidgetSetting('placeholders');
        if (placeholders) {
          try {
            var ph = placeholders.split(',');
            if (ph.length >= 5) {
              settings.placeholders.borrower = ph[0].trim();
              settings.placeholders.remitter = ph[1].trim();
              settings.placeholders.loanNumber = ph[2].trim();
              settings.placeholders.amount = ph[3].trim();
              settings.placeholders.remarks = ph[4].trim();
            }
          } catch (e) {
            console.log('Error parsing placeholders:', e);
          }
        }

        initializeWidget();

        JFCustomWidget.subscribe('submit', function() {
          var rows = collectRows();

          var totalCheckCash = 0;
          var totalAllocated = 0;

          rows.forEach(function(row) {
            totalCheckCash += parseCurrency(row.checkCashAmount);
            row.loanAllocations.forEach(function(loan) {
              totalAllocated += parseCurrency(loan.amount);
            });
          });

          var difference = totalCheckCash - totalAllocated;

          var jsonData = {
            rows: rows,
            totalCheckCash: totalCheckCash.toFixed(2),
            totalAllocated: totalAllocated.toFixed(2),
            difference: difference.toFixed(2),
            rowCount: rows.length
          };

          var formattedText = buildFormattedText(rows, totalCheckCash.toFixed(2), totalAllocated.toFixed(2), difference.toFixed(2));

          var payload = {
            json: jsonData,
            formatted: formattedText
          };

          var msg = {
            valid: true,
            value: JSON.stringify(payload)
          };

          JFCustomWidget.sendSubmit(msg);
        });
      });
    } else {
      // Fallback for testing outside JotForm
      initializeWidget();
    }
  </script>
</body>
</html>
