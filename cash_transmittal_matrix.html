<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Dynamic Matrix Widget</title>
  <script src="//js.jotform.com/JotFormCustomWidget.min.js"></script>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      margin: 0;
      padding: 12px;
      color: #1a1a1a;
    }

    #main {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-width: 1200px;
    }

    .table-wrapper {
      overflow-x: auto;
    }

    .matrix-table {
      width: 100%;
      border-collapse: collapse;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.08);
    }

    .matrix-table th,
    .matrix-table td {
      border: 1px solid #dcdcdc;
      padding: 5px;
      vertical-align: middle;
    }

    .matrix-table th {
      background: #4a5568;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.02em;
      color: #ffffff;
    }

    .matrix-table tbody tr:nth-child(odd) {
      background-color: #ffffff;
    }

    .matrix-table tbody tr:nth-child(even) {
      background-color: #f1f5f9;
    }

    .matrix-table input,
    .matrix-table select {
      width: 100%;
      box-sizing: border-box;
      padding: 5px 8px;
      font-size: 13px;
      border-radius: 4px;
      border: 1px solid #d7deea;
      background: #fff;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
      autocomplete: off;
    }

    .matrix-table input:focus,
    .matrix-table select:focus {
      outline: none;
      border-color: #2d6cdf;
      box-shadow: 0 0 0 2px rgba(45, 108, 223, 0.15);
    }

    .matrix-table input.invalid-loan {
      background-color: #fff3e0;
      border-color: #ff9800;
    }

    .matrix-table input[type="date"] {
      min-width: 130px;
    }

    .totals {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      font-weight: bold;
      flex-wrap: wrap;
    }

    .total-field {
      background: #4a5568;
      color: #fff;
      padding: 8px 14px;
      border-radius: 4px;
      font-size: 13px;
    }

    .action-btn {
      border: none;
      border-radius: 4px;
      padding: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      margin: 2px;
    }

    .action-btn svg {
      width: 14px;
      height: 14px;
    }

    .action-btn.copy-all {
      background: #2d6cdf;
      color: #fff;
    }

    .action-btn.copy-borrower {
      background: #10b981;
      color: #fff;
    }

    .action-btn.remove {
      background: #ef4444;
      color: #fff;
    }

    .action-btn.remove:hover {
      background: #dc2626;
    }

    .actions-cell {
      white-space: nowrap;
      text-align: center;
    }

    /* Loan Allocation Styles */
    .loan-allocations {
      display: flex;
      flex-direction: column;
      gap: 4px;
      align-items: flex-start;
    }

    .loan-row {
      display: flex;
      align-items: center;
      gap: 4px;
      width: 100%;
    }

    .loan-row input[name="loanNumber"] {
      width: 90px;
      min-width: 90px;
    }

    .loan-row input[name="amount"] {
      width: 80px;
      min-width: 80px;
    }

    .loan-btn {
      border: none;
      border-radius: 4px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      font-size: 14px;
      font-weight: bold;
      flex-shrink: 0;
    }

    .loan-btn.add-loan {
      background: #2d6cdf;
      color: #fff;
    }

    .loan-btn.add-loan:hover {
      background: #1d5bc0;
    }

    .loan-btn.remove-loan {
      background: #ef4444;
      color: #fff;
    }

    .loan-btn.remove-loan:hover {
      background: #dc2626;
    }

    .loan-label {
      font-size: 10px;
      color: #666;
      min-width: 45px;
    }
  </style>
</head>
<body>
  <div id="main">
    <div class="table-wrapper">
      <table class="matrix-table" aria-label="Payment matrix">
        <thead>
          <tr>
            <th id="header-borrower">Borrower Name</th>
            <th id="header-remitter">Remitter Name</th>
            <th id="header-paymentType">Cash or Check</th>
            <th id="header-checkCashAmount">Check/Cash Amount</th>
            <th id="header-effectiveDate">Effective Date</th>
            <th id="header-loanAmount">Loan # / Amount</th>
            <th id="header-remarks">Remarks</th>
            <th id="header-actions">Actions</th>
          </tr>
        </thead>
        <tbody id="matrixBody"></tbody>
      </table>
    </div>
    <div class="totals">
      <div class="total-field">Total Check/Cash: <span id="totalCheckCash">$0.00</span></div>
      <div class="total-field">Total Allocated: <span id="totalAmount">$0.00</span></div>
    </div>
  </div>

  <script type="text/javascript">
    var matrixBody = document.getElementById('matrixBody');
    var totalCheckCashEl = document.getElementById('totalCheckCash');
    var totalAmountEl = document.getElementById('totalAmount');
    var initialized = false;

    // Default settings
    var settings = {
      columnHeaders: {
        borrower: 'Borrower Name',
        remitter: 'Remitter Name',
        paymentType: 'Cash or Check',
        checkCashAmount: 'Check/Cash Amount',
        effectiveDate: 'Effective Date',
        loanAmount: 'Loan # / Amount',
        remarks: 'Remarks',
        actions: 'Actions'
      },
      placeholders: {
        borrower: 'Borrower Name',
        remitter: 'Remitter Name',
        checkCashAmount: '0.00',
        loanNumber: 'Loan #',
        amount: '0.00',
        remarks: 'Remarks'
      },
      paymentTypes: ['Cash', 'Check', 'Money Order']
    };

    function formatCurrency(value) {
      var numberValue = parseFloat(value);
      if (isNaN(numberValue)) {
        return '$0.00';
      }
      return '$' + numberValue.toFixed(2);
    }

    function createInput(type, name, placeholder) {
      var input = document.createElement('input');
      input.type = type;
      input.name = name;
      input.setAttribute('autocomplete', 'off');
      input.setAttribute('autocorrect', 'off');
      input.setAttribute('autocapitalize', 'off');
      input.setAttribute('spellcheck', 'false');
      if (placeholder) {
        input.placeholder = placeholder;
      }
      if (type === 'number') {
        input.step = '0.01';
        input.min = '0';
      }
      input.addEventListener('input', handleInputChange);
      input.addEventListener('blur', function() {
        if (name === 'loanNumber') {
          validateLoanNumber(input);
        }
        sendDataToJotForm();
      });
      return input;
    }

    function createSelect(name, options) {
      var select = document.createElement('select');
      select.name = name;
      select.setAttribute('autocomplete', 'off');
      options.forEach(function(optionValue) {
        var option = document.createElement('option');
        option.value = optionValue;
        option.textContent = optionValue;
        select.appendChild(option);
      });
      select.addEventListener('change', function() {
        handleInputChange();
        sendDataToJotForm();
      });
      return select;
    }

    function validateLoanNumber(input) {
      var value = input.value.trim();
      if (value === '') {
        input.classList.remove('invalid-loan');
        return true;
      }
      var isValid = /^\d{6,7}$/.test(value);
      if (isValid) {
        input.classList.remove('invalid-loan');
      } else {
        input.classList.add('invalid-loan');
      }
      return isValid;
    }

    function createLoanAllocationRow(container, isFirst) {
      var loanRow = document.createElement('div');
      loanRow.className = 'loan-row';

      var loanInput = createInput('text', 'loanNumber', settings.placeholders.loanNumber);
      loanInput.setAttribute('maxlength', '7');
      loanRow.appendChild(loanInput);

      var amountInput = createInput('number', 'amount', settings.placeholders.amount);
      loanRow.appendChild(amountInput);

      if (isFirst) {
        // Add button for first row
        var addBtn = document.createElement('button');
        addBtn.type = 'button';
        addBtn.className = 'loan-btn add-loan';
        addBtn.innerHTML = '+';
        addBtn.title = 'Add another loan allocation';
        addBtn.addEventListener('click', function() {
          createLoanAllocationRow(container, false);
          sendDataToJotForm();
          notifyHeight();
        });
        loanRow.appendChild(addBtn);
      } else {
        // Remove button for additional rows
        var removeBtn = document.createElement('button');
        removeBtn.type = 'button';
        removeBtn.className = 'loan-btn remove-loan';
        removeBtn.innerHTML = '×';
        removeBtn.tabIndex = -1;
        removeBtn.title = 'Remove this loan allocation';
        removeBtn.addEventListener('click', function() {
          loanRow.remove();
          updateTotals();
          sendDataToJotForm();
          notifyHeight();
        });
        loanRow.appendChild(removeBtn);
      }

      container.appendChild(loanRow);
      return loanRow;
    }

    function addRow(defaults) {
      var row = document.createElement('tr');
      row.className = 'transmittal-row';

      // Borrower Name
      var borrowerCell = document.createElement('td');
      borrowerCell.appendChild(createInput('text', 'borrower', settings.placeholders.borrower));
      row.appendChild(borrowerCell);

      // Remitter Name
      var remitterCell = document.createElement('td');
      remitterCell.appendChild(createInput('text', 'remitter', settings.placeholders.remitter));
      row.appendChild(remitterCell);

      // Payment Type
      var paymentTypeCell = document.createElement('td');
      paymentTypeCell.appendChild(createSelect('paymentType', settings.paymentTypes));
      row.appendChild(paymentTypeCell);

      // Check/Cash Amount
      var checkCashCell = document.createElement('td');
      checkCashCell.appendChild(createInput('number', 'checkCashAmount', settings.placeholders.checkCashAmount));
      row.appendChild(checkCashCell);

      // Effective Date
      var dateCell = document.createElement('td');
      dateCell.appendChild(createInput('date', 'effectiveDate'));
      row.appendChild(dateCell);

      // Loan Allocations
      var loanCell = document.createElement('td');
      var loanContainer = document.createElement('div');
      loanContainer.className = 'loan-allocations';
      createLoanAllocationRow(loanContainer, true);
      loanCell.appendChild(loanContainer);
      row.appendChild(loanCell);

      // Remarks
      var remarksCell = document.createElement('td');
      remarksCell.appendChild(createInput('text', 'remarks', settings.placeholders.remarks));
      row.appendChild(remarksCell);

      // Actions
      var actionsCell = document.createElement('td');
      actionsCell.className = 'actions-cell';

      // Copy All button
      var copyAllBtn = document.createElement('button');
      copyAllBtn.type = 'button';
      copyAllBtn.className = 'action-btn copy-all';
      copyAllBtn.title = 'Copy all info to next row';
      copyAllBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
      copyAllBtn.addEventListener('click', function() {
        copyRowData(row, true);
      });
      actionsCell.appendChild(copyAllBtn);

      // Copy Borrower button
      var copyBorrowerBtn = document.createElement('button');
      copyBorrowerBtn.type = 'button';
      copyBorrowerBtn.className = 'action-btn copy-borrower';
      copyBorrowerBtn.title = 'Copy borrower info only';
      copyBorrowerBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>';
      copyBorrowerBtn.addEventListener('click', function() {
        copyRowData(row, false);
      });
      actionsCell.appendChild(copyBorrowerBtn);

      // Remove button
      var removeBtn = document.createElement('button');
      removeBtn.type = 'button';
      removeBtn.className = 'action-btn remove';
      removeBtn.title = 'Remove row';
      removeBtn.tabIndex = -1;
      removeBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6h14z"/></svg>';
      removeBtn.addEventListener('click', function() {
        var rows = matrixBody.querySelectorAll('tr.transmittal-row');
        if (rows.length > 1) {
          row.remove();
          updateTotals();
          ensureEmptyRow();
          sendDataToJotForm();
          notifyHeight();
        }
      });
      actionsCell.appendChild(removeBtn);

      row.appendChild(actionsCell);
      matrixBody.appendChild(row);

      // Apply defaults if provided
      if (defaults) {
        if (defaults.borrower) {
          row.querySelector('[name="borrower"]').value = defaults.borrower;
        }
        if (defaults.remitter) {
          row.querySelector('[name="remitter"]').value = defaults.remitter;
        }
        if (defaults.paymentType) {
          row.querySelector('[name="paymentType"]').value = defaults.paymentType;
        }
        if (defaults.checkCashAmount) {
          row.querySelector('[name="checkCashAmount"]').value = defaults.checkCashAmount;
        }
        if (defaults.effectiveDate) {
          row.querySelector('[name="effectiveDate"]').value = defaults.effectiveDate;
        }
        if (defaults.loanNumber) {
          row.querySelector('[name="loanNumber"]').value = defaults.loanNumber;
        }
        if (defaults.amount) {
          row.querySelector('[name="amount"]').value = defaults.amount;
        }
      }

      updateTotals();
      notifyHeight();
      return row;
    }

    function copyRowData(sourceRow, includeLoans) {
      var defaults = {
        borrower: sourceRow.querySelector('[name="borrower"]').value,
        remitter: sourceRow.querySelector('[name="remitter"]').value,
        paymentType: sourceRow.querySelector('[name="paymentType"]').value,
        effectiveDate: sourceRow.querySelector('[name="effectiveDate"]').value
      };

      if (includeLoans) {
        defaults.checkCashAmount = sourceRow.querySelector('[name="checkCashAmount"]').value;
        var firstLoan = sourceRow.querySelector('.loan-allocations .loan-row');
        if (firstLoan) {
          defaults.loanNumber = firstLoan.querySelector('[name="loanNumber"]').value;
          defaults.amount = firstLoan.querySelector('[name="amount"]').value;
        }
      }

      // Find last row and fill if empty, otherwise add new row
      var rows = matrixBody.querySelectorAll('tr.transmittal-row');
      var lastRow = rows[rows.length - 1];

      if (isRowEmpty(lastRow)) {
        applyDefaultsToRow(lastRow, defaults);
      } else {
        addRow(defaults);
      }

      ensureEmptyRow();
      sendDataToJotForm();
    }

    function applyDefaultsToRow(row, defaults) {
      if (defaults.borrower) {
        row.querySelector('[name="borrower"]').value = defaults.borrower;
      }
      if (defaults.remitter) {
        row.querySelector('[name="remitter"]').value = defaults.remitter;
      }
      if (defaults.paymentType) {
        row.querySelector('[name="paymentType"]').value = defaults.paymentType;
      }
      if (defaults.checkCashAmount) {
        row.querySelector('[name="checkCashAmount"]').value = defaults.checkCashAmount;
      }
      if (defaults.effectiveDate) {
        row.querySelector('[name="effectiveDate"]').value = defaults.effectiveDate;
      }
      if (defaults.loanNumber) {
        row.querySelector('[name="loanNumber"]').value = defaults.loanNumber;
      }
      if (defaults.amount) {
        row.querySelector('[name="amount"]').value = defaults.amount;
      }
    }

    function isRowEmpty(row) {
      var borrower = row.querySelector('[name="borrower"]').value.trim();
      var checkCash = row.querySelector('[name="checkCashAmount"]').value;
      var loanNumber = row.querySelector('[name="loanNumber"]').value.trim();
      var amount = row.querySelector('[name="amount"]').value;

      return borrower === '' &&
             (checkCash === '' || checkCash === '0' || checkCash === '0.00') &&
             loanNumber === '' &&
             (amount === '' || amount === '0' || amount === '0.00');
    }

    function isRowFilled(row) {
      var borrower = row.querySelector('[name="borrower"]').value.trim();
      var checkCash = row.querySelector('[name="checkCashAmount"]').value;
      var loanNumber = row.querySelector('[name="loanNumber"]').value.trim();
      var amount = row.querySelector('[name="amount"]').value;

      return borrower !== '' ||
             (checkCash !== '' && checkCash !== '0' && checkCash !== '0.00') ||
             loanNumber !== '' ||
             (amount !== '' && amount !== '0' && amount !== '0.00');
    }

    function isLastRow(row) {
      var rows = matrixBody.querySelectorAll('tr.transmittal-row');
      return rows.length > 0 && rows[rows.length - 1] === row;
    }

    function ensureEmptyRow() {
      var rows = matrixBody.querySelectorAll('tr.transmittal-row');
      if (rows.length === 0) {
        addRow();
        return;
      }
      var lastRow = rows[rows.length - 1];
      if (isRowFilled(lastRow)) {
        addRow();
      }
    }

    function handleInputChange(event) {
      updateTotals();

      if (event && event.target) {
        var targetRow = event.target.closest('tr.transmittal-row');
        // Only add new row if editing last row's main fields (not loan allocations beyond the first)
        if (targetRow && isLastRow(targetRow)) {
          var isMainField = event.target.name === 'borrower' ||
                           event.target.name === 'checkCashAmount' ||
                           event.target.name === 'effectiveDate' ||
                           event.target.name === 'remitter' ||
                           event.target.name === 'remarks';

          var isFirstLoanField = false;
          if (event.target.name === 'loanNumber' || event.target.name === 'amount') {
            var loanRow = event.target.closest('.loan-row');
            var loanContainer = targetRow.querySelector('.loan-allocations');
            if (loanContainer && loanRow === loanContainer.querySelector('.loan-row')) {
              isFirstLoanField = true;
            }
          }

          if ((isMainField || isFirstLoanField) && isRowFilled(targetRow)) {
            ensureEmptyRow();
          }
        }
      }
    }

    function updateTotals() {
      var rows = matrixBody.querySelectorAll('tr.transmittal-row');
      var totalCheckCash = 0;
      var totalAmount = 0;

      rows.forEach(function(row) {
        var checkCashValue = parseFloat(row.querySelector('[name="checkCashAmount"]').value) || 0;
        totalCheckCash += checkCashValue;

        var loanRows = row.querySelectorAll('.loan-row');
        loanRows.forEach(function(loanRow) {
          var amountValue = parseFloat(loanRow.querySelector('[name="amount"]').value) || 0;
          totalAmount += amountValue;
        });
      });

      totalCheckCashEl.textContent = formatCurrency(totalCheckCash);
      totalAmountEl.textContent = formatCurrency(totalAmount);
    }

    function collectData() {
      var rows = [];
      var filledRowCount = 0;

      matrixBody.querySelectorAll('tr.transmittal-row').forEach(function(row) {
        var borrower = row.querySelector('[name="borrower"]').value.trim();
        var checkCash = row.querySelector('[name="checkCashAmount"]').value;

        // Skip completely empty rows
        if (borrower === '' && (checkCash === '' || checkCash === '0' || checkCash === '0.00')) {
          var hasLoanData = false;
          row.querySelectorAll('.loan-row').forEach(function(loanRow) {
            var ln = loanRow.querySelector('[name="loanNumber"]').value.trim();
            var amt = loanRow.querySelector('[name="amount"]').value;
            if (ln !== '' || (amt !== '' && amt !== '0' && amt !== '0.00')) {
              hasLoanData = true;
            }
          });
          if (!hasLoanData) return;
        }

        filledRowCount++;

        var loanAllocations = [];
        row.querySelectorAll('.loan-row').forEach(function(loanRow) {
          var loanNumber = loanRow.querySelector('[name="loanNumber"]').value.trim();
          var amount = loanRow.querySelector('[name="amount"]').value;
          if (loanNumber !== '' || (amount !== '' && amount !== '0' && amount !== '0.00')) {
            loanAllocations.push({
              loanNumber: loanNumber,
              amount: amount || '0'
            });
          }
        });

        rows.push({
          borrower: borrower,
          remitter: row.querySelector('[name="remitter"]').value.trim(),
          paymentType: row.querySelector('[name="paymentType"]').value,
          checkCashAmount: checkCash || '0',
          effectiveDate: row.querySelector('[name="effectiveDate"]').value,
          loanAllocations: loanAllocations,
          remarks: row.querySelector('[name="remarks"]').value.trim()
        });
      });

      return {
        rows: rows,
        totalCheckCash: totalCheckCashEl.textContent.replace('$', ''),
        totalAllocated: totalAmountEl.textContent.replace('$', ''),
        rowCount: filledRowCount
      };
    }

    function formatTextOutput(data) {
      var lines = [];
      lines.push('===== PAYMENT TRANSMITTAL =====');
      lines.push('');

      data.rows.forEach(function(row, index) {
        lines.push('--- Entry ' + (index + 1) + ' ---');
        lines.push('Borrower: ' + (row.borrower || '(empty)'));
        if (row.remitter) {
          lines.push('Remitter: ' + row.remitter);
        }
        lines.push('Payment Type: ' + row.paymentType);
        lines.push('Check/Cash Amount: $' + parseFloat(row.checkCashAmount || 0).toFixed(2));
        lines.push('Effective Date: ' + (row.effectiveDate || '(not set)'));

        if (row.loanAllocations && row.loanAllocations.length > 0) {
          lines.push('Loan Allocations:');
          row.loanAllocations.forEach(function(loan, loanIndex) {
            lines.push('  ' + (loanIndex + 1) + '. Loan #' + (loan.loanNumber || '(empty)') + ': $' + parseFloat(loan.amount || 0).toFixed(2));
          });
        }

        if (row.remarks) {
          lines.push('Remarks: ' + row.remarks);
        }
        lines.push('');
      });

      lines.push('===== TOTALS =====');
      lines.push('Total Check/Cash: $' + data.totalCheckCash);
      lines.push('Total Allocated: $' + data.totalAllocated);
      lines.push('Number of Entries: ' + data.rowCount);

      return lines.join('\n');
    }

    function sendDataToJotForm() {
      if (typeof JFCustomWidget === 'undefined') return;

      var data = collectData();
      var jsonOutput = JSON.stringify(data);
      var textOutput = formatTextOutput(data);

      var combinedOutput = {
        json: jsonOutput,
        text: textOutput,
        data: data
      };

      JFCustomWidget.sendData({
        valid: true,
        value: JSON.stringify(combinedOutput)
      });
    }

    function notifyHeight() {
      if (typeof JFCustomWidget !== 'undefined') {
        JFCustomWidget.requestFrameResize();
      }
    }

    function applySettings() {
      // Apply column headers
      var headers = settings.columnHeaders;
      if (headers.borrower) document.getElementById('header-borrower').textContent = headers.borrower;
      if (headers.remitter) document.getElementById('header-remitter').textContent = headers.remitter;
      if (headers.paymentType) document.getElementById('header-paymentType').textContent = headers.paymentType;
      if (headers.checkCashAmount) document.getElementById('header-checkCashAmount').textContent = headers.checkCashAmount;
      if (headers.effectiveDate) document.getElementById('header-effectiveDate').textContent = headers.effectiveDate;
      if (headers.loanAmount) document.getElementById('header-loanAmount').textContent = headers.loanAmount;
      if (headers.remarks) document.getElementById('header-remarks').textContent = headers.remarks;
      if (headers.actions) document.getElementById('header-actions').textContent = headers.actions;
    }

    function initializeWidget() {
      if (initialized) return;
      initialized = true;

      applySettings();
      addRow();
      addRow();
      notifyHeight();
    }

    // Initialize on DOM ready as fallback
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', function() {
        setTimeout(initializeWidget, 100);
      });
    } else {
      setTimeout(initializeWidget, 100);
    }

    // JotForm widget initialization
    if (typeof JFCustomWidget !== 'undefined') {
      JFCustomWidget.subscribe('ready', function() {
        // Get custom settings
        var columnHeaders = JFCustomWidget.getWidgetSetting('columnHeaders');
        if (columnHeaders) {
          var headerParts = columnHeaders.split(',');
          if (headerParts.length >= 8) {
            settings.columnHeaders = {
              borrower: headerParts[0].trim(),
              remitter: headerParts[1].trim(),
              paymentType: headerParts[2].trim(),
              checkCashAmount: headerParts[3].trim(),
              effectiveDate: headerParts[4].trim(),
              loanAmount: headerParts[5].trim(),
              remarks: headerParts[6].trim(),
              actions: headerParts[7].trim()
            };
          }
        }

        var paymentTypes = JFCustomWidget.getWidgetSetting('paymentTypes');
        if (paymentTypes) {
          settings.paymentTypes = paymentTypes.split(',').map(function(type) {
            return type.trim();
          });
        }

        var placeholders = JFCustomWidget.getWidgetSetting('placeholders');
        if (placeholders) {
          var placeholderParts = placeholders.split(',');
          if (placeholderParts.length >= 5) {
            settings.placeholders = {
              borrower: placeholderParts[0].trim(),
              remitter: placeholderParts[1].trim(),
              checkCashAmount: placeholderParts[2].trim(),
              loanNumber: placeholderParts[3].trim(),
              amount: placeholderParts[4].trim(),
              remarks: placeholderParts[5] ? placeholderParts[5].trim() : 'Remarks'
            };
          }
        }

        initializeWidget();

        JFCustomWidget.subscribe('submit', function() {
          var data = collectData();
          var jsonOutput = JSON.stringify(data);
          var textOutput = formatTextOutput(data);

          var combinedOutput = {
            json: jsonOutput,
            text: textOutput,
            data: data
          };

          JFCustomWidget.sendSubmit({
            valid: true,
            value: JSON.stringify(combinedOutput)
          });
        });
      });
    }
  </script>
</body>
</html>
