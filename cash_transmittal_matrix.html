<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Dynamic Matrix Widget</title>
  <script src="//js.jotform.com/JotFormCustomWidget.min.js"></script>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      margin: 0;
      padding: 12px;
      color: #1a1a1a;
    }

    #main {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-width: 1200px;
    }

    .table-wrapper {
      overflow-x: auto;
    }

    .matrix-table {
      width: 100%;
      border-collapse: collapse;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.08);
    }

    .matrix-table th,
    .matrix-table td {
      border: 1px solid #dcdcdc;
      padding: 5px;
      vertical-align: middle;
    }

    .matrix-table th {
      background: #4a5568;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.02em;
      color: #ffffff;
      white-space: nowrap;
    }

    .matrix-table tbody tr.main-row:nth-child(4n+1),
    .matrix-table tbody tr.main-row:nth-child(4n+2),
    .matrix-table tbody tr.loans-row:nth-child(4n+2),
    .matrix-table tbody tr.loans-row:nth-child(4n+3) {
      background-color: #f8fafc;
    }

    .matrix-table tbody tr.main-row:nth-child(4n+3),
    .matrix-table tbody tr.main-row:nth-child(4n),
    .matrix-table tbody tr.loans-row:nth-child(4n),
    .matrix-table tbody tr.loans-row:nth-child(4n+1) {
      background-color: #ffffff;
    }

    .matrix-table input,
    .matrix-table select {
      width: 100%;
      box-sizing: border-box;
      padding: 6px 8px;
      font-size: 13px;
      border-radius: 4px;
      border: 1px solid #d7deea;
      background: #fff;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .matrix-table input:focus,
    .matrix-table select:focus {
      outline: none;
      border-color: #2d6cdf;
      box-shadow: 0 0 0 2px rgba(45, 108, 223, 0.15);
    }

    .matrix-table input.invalid-loan {
      background-color: #fff3e0;
      border-color: #ff9800;
    }

    .matrix-table input.required-field {
      border-color: #e53935;
      background-color: #ffebee;
    }

    .totals {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      font-weight: bold;
      flex-wrap: wrap;
    }

    .total-field {
      background: #9acd32;
      color: #0d2a00;
      padding: 6px 12px;
      border-radius: 4px;
      min-width: 120px;
      text-align: right;
      font-size: 13px;
    }

    .total-field.mismatch {
      background: #ff9800;
      color: #fff;
    }

    .actions-cell {
      white-space: nowrap;
      text-align: center;
    }

    .action-btn {
      border: none;
      border-radius: 4px;
      padding: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      margin: 2px;
      transition: opacity 0.15s ease;
    }

    .action-btn:hover {
      opacity: 0.8;
    }

    .action-btn svg {
      width: 14px;
      height: 14px;
    }

    .btn-copy-all {
      background: #2d6cdf;
      color: #fff;
    }

    .btn-copy-borrower {
      background: #17a2b8;
      color: #fff;
    }

    .btn-remove {
      background: #e55353;
      color: #fff;
    }

    .btn-add-loan {
      background: #28a745;
      color: #fff;
    }

    .btn-remove-loan {
      background: #dc3545;
      color: #fff;
    }

    .loans-row td {
      padding: 0;
      border-top: none;
    }

    .loans-container {
      padding: 8px 12px;
      background: rgba(45, 108, 223, 0.05);
      border-top: 1px dashed #ccc;
    }

    .loans-header {
      font-size: 11px;
      font-weight: bold;
      color: #4a5568;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .loan-entry {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }

    .loan-entry:last-child {
      margin-bottom: 0;
    }

    .loan-entry input {
      width: auto;
      flex: 1;
      max-width: 140px;
    }

    .loan-entry .loan-label {
      font-size: 11px;
      color: #666;
      min-width: 50px;
    }

    .loan-actions {
      display: flex;
      gap: 4px;
    }

    .loan-total {
      font-size: 12px;
      color: #333;
      margin-top: 8px;
      padding-top: 6px;
      border-top: 1px solid #ddd;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .loan-total.balanced {
      color: #28a745;
    }

    .loan-total.unbalanced {
      color: #dc3545;
    }
  </style>
</head>
<body>
  <div id="main">
    <div class="table-wrapper">
      <table class="matrix-table" aria-label="Payment matrix">
        <thead>
          <tr>
            <th id="th-borrower">Borrower Name</th>
            <th id="th-remitter">Remitter Name</th>
            <th id="th-paymentType">Cash or Check</th>
            <th id="th-checkCashAmount">Check/Cash Amount</th>
            <th id="th-effectiveDate">Effective Date</th>
            <th id="th-remarks">Remarks</th>
            <th id="th-actions">Actions</th>
          </tr>
        </thead>
        <tbody id="matrixBody"></tbody>
      </table>
    </div>
    <div class="totals">
      <div class="total-field" id="totalCheckCashField">Total Check/Cash: <span id="totalCheckCash">$0.00</span></div>
      <div class="total-field" id="totalAmountField">Total Loan Amounts: <span id="totalAmount">$0.00</span></div>
    </div>
  </div>

  <script>
    var matrixBody = document.getElementById('matrixBody');
    var totalCheckCashEl = document.getElementById('totalCheckCash');
    var totalAmountEl = document.getElementById('totalAmount');
    var totalCheckCashField = document.getElementById('totalCheckCashField');
    var totalAmountField = document.getElementById('totalAmountField');
    var initialized = false;
    var widgetReady = false;

    // Default settings
    var settings = {
      columnHeaders: {
        borrower: 'Borrower Name',
        remitter: 'Remitter Name',
        paymentType: 'Cash or Check',
        checkCashAmount: 'Check/Cash Amount',
        effectiveDate: 'Effective Date',
        remarks: 'Remarks',
        actions: 'Actions'
      },
      placeholders: {
        borrower: 'Borrower Name',
        remitter: 'Remitter Name (if different)',
        checkCashAmount: '0.00',
        effectiveDate: '',
        loanNumber: 'Loan #',
        amount: '0.00',
        remarks: 'Remarks/Comments'
      },
      paymentTypes: ['Cash', 'Check', 'Money Order']
    };

    function formatCurrency(value) {
      var numberValue = parseFloat(value);
      if (isNaN(numberValue)) {
        return '$0.00';
      }
      return '$' + numberValue.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function formatDate(dateStr) {
      if (!dateStr) return '';
      var parts = dateStr.split('-');
      if (parts.length === 3) {
        return parts[1] + '/' + parts[2] + '/' + parts[0];
      }
      return dateStr;
    }

    function isValidLoanNumber(value) {
      if (!value || value.trim() === '') return true;
      var cleaned = value.replace(/\D/g, '');
      return cleaned.length >= 6 && cleaned.length <= 7;
    }

    function createCellInput(type, name, placeholder) {
      var input = document.createElement('input');
      input.type = type;
      input.name = name;
      input.placeholder = placeholder || '';
      input.setAttribute('autocomplete', 'off');
      input.setAttribute('autocorrect', 'off');
      input.setAttribute('autocapitalize', 'off');
      input.setAttribute('spellcheck', 'false');
      input.setAttribute('data-form-type', 'other');
      input.setAttribute('data-lpignore', 'true');

      if (type === 'number') {
        input.step = '0.01';
        input.min = '0';
      }

      input.addEventListener('input', handleInputChange);
      input.addEventListener('blur', handleBlur);
      return input;
    }

    function createSelect(name, options) {
      var select = document.createElement('select');
      select.name = name;
      select.setAttribute('autocomplete', 'off');

      options.forEach(function(optionValue) {
        var option = document.createElement('option');
        option.value = optionValue;
        option.textContent = optionValue;
        select.appendChild(option);
      });

      select.addEventListener('change', handleInputChange);
      select.addEventListener('blur', handleBlur);
      return select;
    }

    function createActionButton(className, title, svgPath, tabIndex) {
      var button = document.createElement('button');
      button.type = 'button';
      button.className = 'action-btn ' + className;
      button.setAttribute('aria-label', title);
      button.title = title;
      if (tabIndex === -1) {
        button.setAttribute('tabindex', '-1');
      }
      button.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="' + svgPath + '"></path></svg>';
      return button;
    }

    function createLoanEntry(loansContainer, loanData) {
      var loanEntry = document.createElement('div');
      loanEntry.className = 'loan-entry';

      var loanLabel = document.createElement('span');
      loanLabel.className = 'loan-label';
      loanLabel.textContent = 'Loan:';
      loanEntry.appendChild(loanLabel);

      var loanInput = createCellInput('text', 'loanNumber', settings.placeholders.loanNumber);
      loanInput.style.maxWidth = '100px';
      if (loanData && loanData.loanNumber) {
        loanInput.value = loanData.loanNumber;
        validateLoanInput(loanInput);
      }
      loanInput.addEventListener('input', function() {
        validateLoanInput(this);
        updateLoanTotals(loansContainer);
        handleInputChange();
      });
      loanEntry.appendChild(loanInput);

      var amountLabel = document.createElement('span');
      amountLabel.className = 'loan-label';
      amountLabel.textContent = 'Amount:';
      loanEntry.appendChild(amountLabel);

      var amountInput = createCellInput('number', 'amount', settings.placeholders.amount);
      amountInput.style.maxWidth = '100px';
      if (loanData && loanData.amount) {
        amountInput.value = loanData.amount;
      }
      amountInput.addEventListener('input', function() {
        updateLoanTotals(loansContainer);
        handleInputChange();
      });
      loanEntry.appendChild(amountInput);

      var loanActions = document.createElement('div');
      loanActions.className = 'loan-actions';

      var addLoanBtn = createActionButton('btn-add-loan', 'Add another loan', 'M12 5c.55 0 1 .45 1 1v5h5a1 1 0 0 1 0 2h-5v5a1 1 0 1 1-2 0v-5H6a1 1 0 1 1 0-2h5V6c0-.55.45-1 1-1z');
      addLoanBtn.addEventListener('click', function() {
        var newLoanEntry = createLoanEntry(loansContainer);
        loanEntry.parentNode.insertBefore(newLoanEntry, loansContainer.querySelector('.loan-total'));
        newLoanEntry.querySelector('[name="loanNumber"]').focus();
        updateLoanTotals(loansContainer);
        ensureEmptyRow();
        sendDataToJotForm();
        notifyHeight();
      });
      loanActions.appendChild(addLoanBtn);

      var removeLoanBtn = createActionButton('btn-remove-loan', 'Remove loan', 'M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z', -1);
      removeLoanBtn.addEventListener('click', function() {
        var loanEntries = loansContainer.querySelectorAll('.loan-entry');
        if (loanEntries.length > 1) {
          loanEntry.remove();
          updateLoanTotals(loansContainer);
          sendDataToJotForm();
          notifyHeight();
        }
      });
      loanActions.appendChild(removeLoanBtn);

      loanEntry.appendChild(loanActions);
      return loanEntry;
    }

    function updateLoanTotals(loansContainer) {
      var mainRow = loansContainer.closest('tr').previousElementSibling;
      var checkCashAmount = parseFloat(mainRow.querySelector('[name="checkCashAmount"]').value) || 0;

      var loanEntries = loansContainer.querySelectorAll('.loan-entry');
      var totalLoanAmount = 0;
      loanEntries.forEach(function(entry) {
        var amount = parseFloat(entry.querySelector('[name="amount"]').value) || 0;
        totalLoanAmount += amount;
      });

      var loanTotalEl = loansContainer.querySelector('.loan-total');
      if (loanTotalEl) {
        var isBalanced = Math.abs(checkCashAmount - totalLoanAmount) < 0.01;
        loanTotalEl.className = 'loan-total ' + (isBalanced ? 'balanced' : 'unbalanced');
        loanTotalEl.innerHTML = '<span>Loans Total: ' + formatCurrency(totalLoanAmount) + '</span>' +
          (isBalanced ? '<span>✓ Balanced</span>' : '<span>Difference: ' + formatCurrency(checkCashAmount - totalLoanAmount) + '</span>');
      }

      updateTotals();
    }

    function validateLoanInput(input) {
      var value = input.value.trim();
      if (value === '' || isValidLoanNumber(value)) {
        input.classList.remove('invalid-loan');
      } else {
        input.classList.add('invalid-loan');
      }
    }

    function addRow(defaults) {
      // Main row
      var mainRow = document.createElement('tr');
      mainRow.className = 'main-row';

      var borrowerCell = document.createElement('td');
      borrowerCell.appendChild(createCellInput('text', 'borrower', settings.placeholders.borrower));
      mainRow.appendChild(borrowerCell);

      var remitterCell = document.createElement('td');
      remitterCell.appendChild(createCellInput('text', 'remitter', settings.placeholders.remitter));
      mainRow.appendChild(remitterCell);

      var cashCheckCell = document.createElement('td');
      cashCheckCell.appendChild(createSelect('paymentType', settings.paymentTypes));
      mainRow.appendChild(cashCheckCell);

      var totalCell = document.createElement('td');
      var checkCashInput = createCellInput('number', 'checkCashAmount', settings.placeholders.checkCashAmount);
      checkCashInput.addEventListener('input', function() {
        var loansRow = mainRow.nextElementSibling;
        if (loansRow) {
          var loansContainer = loansRow.querySelector('.loans-container');
          if (loansContainer) {
            updateLoanTotals(loansContainer);
          }
        }
      });
      totalCell.appendChild(checkCashInput);
      mainRow.appendChild(totalCell);

      var dateCell = document.createElement('td');
      dateCell.appendChild(createCellInput('date', 'effectiveDate', settings.placeholders.effectiveDate));
      mainRow.appendChild(dateCell);

      var remarksCell = document.createElement('td');
      remarksCell.appendChild(createCellInput('text', 'remarks', settings.placeholders.remarks));
      mainRow.appendChild(remarksCell);

      var actionsCell = document.createElement('td');
      actionsCell.className = 'actions-cell';

      var copyAllBtn = createActionButton('btn-copy-all', 'Copy all to new row', 'M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z');
      copyAllBtn.addEventListener('click', function() {
        copyRowData(mainRow, true);
      });
      actionsCell.appendChild(copyAllBtn);

      var copyBorrowerBtn = createActionButton('btn-copy-borrower', 'Copy borrower only', 'M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z');
      copyBorrowerBtn.addEventListener('click', function() {
        copyRowData(mainRow, false);
      });
      actionsCell.appendChild(copyBorrowerBtn);

      var removeBtn = createActionButton('btn-remove', 'Remove row', 'M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z', -1);
      removeBtn.addEventListener('click', function() {
        var allMainRows = matrixBody.querySelectorAll('.main-row');
        if (allMainRows.length > 1) {
          var loansRow = mainRow.nextElementSibling;
          mainRow.remove();
          if (loansRow && loansRow.classList.contains('loans-row')) {
            loansRow.remove();
          }
          updateTotals();
          ensureEmptyRow();
          sendDataToJotForm();
          notifyHeight();
        }
      });
      actionsCell.appendChild(removeBtn);

      mainRow.appendChild(actionsCell);
      matrixBody.appendChild(mainRow);

      // Loans row
      var loansRow = document.createElement('tr');
      loansRow.className = 'loans-row';

      var loansCell = document.createElement('td');
      loansCell.setAttribute('colspan', '7');

      var loansContainer = document.createElement('div');
      loansContainer.className = 'loans-container';

      var loansHeader = document.createElement('div');
      loansHeader.className = 'loans-header';
      loansHeader.textContent = 'Loan Allocations';
      loansContainer.appendChild(loansHeader);

      // Add initial loan entry or entries from defaults
      if (defaults && defaults.loans && defaults.loans.length > 0) {
        defaults.loans.forEach(function(loan) {
          loansContainer.appendChild(createLoanEntry(loansContainer, loan));
        });
      } else {
        loansContainer.appendChild(createLoanEntry(loansContainer));
      }

      var loanTotal = document.createElement('div');
      loanTotal.className = 'loan-total';
      loanTotal.innerHTML = '<span>Loans Total: $0.00</span><span></span>';
      loansContainer.appendChild(loanTotal);

      loansCell.appendChild(loansContainer);
      loansRow.appendChild(loansCell);
      matrixBody.appendChild(loansRow);

      // Apply defaults
      if (defaults) {
        Object.keys(defaults).forEach(function(key) {
          if (key === 'loans') return;
          var element = mainRow.querySelector('[name="' + key + '"]');
          if (element) {
            element.value = defaults[key];
          }
        });
        updateLoanTotals(loansContainer);
      }

      updateTotals();
      notifyHeight();
      return mainRow;
    }

    function copyRowData(sourceRow, includeLoans) {
      var loansRow = sourceRow.nextElementSibling;
      var loansContainer = loansRow.querySelector('.loans-container');

      var defaults = {
        borrower: sourceRow.querySelector('[name="borrower"]').value,
        remitter: sourceRow.querySelector('[name="remitter"]').value,
        paymentType: sourceRow.querySelector('[name="paymentType"]').value,
        effectiveDate: sourceRow.querySelector('[name="effectiveDate"]').value
      };

      if (includeLoans) {
        defaults.checkCashAmount = sourceRow.querySelector('[name="checkCashAmount"]').value;
        defaults.remarks = sourceRow.querySelector('[name="remarks"]').value;
        defaults.loans = [];
        loansContainer.querySelectorAll('.loan-entry').forEach(function(entry) {
          defaults.loans.push({
            loanNumber: entry.querySelector('[name="loanNumber"]').value,
            amount: entry.querySelector('[name="amount"]').value
          });
        });
      }

      var newRow = addRow(defaults);
      ensureEmptyRow();
      sendDataToJotForm();
      newRow.querySelector('[name="borrower"]').focus();
    }

    function updateTotals() {
      var mainRows = matrixBody.querySelectorAll('.main-row');
      var totalCheckCash = 0;
      var totalAmount = 0;

      mainRows.forEach(function(row) {
        var checkCashValue = parseFloat(row.querySelector('[name="checkCashAmount"]').value) || 0;
        totalCheckCash += checkCashValue;

        var loansRow = row.nextElementSibling;
        if (loansRow && loansRow.classList.contains('loans-row')) {
          var loanEntries = loansRow.querySelectorAll('.loan-entry');
          loanEntries.forEach(function(entry) {
            var amount = parseFloat(entry.querySelector('[name="amount"]').value) || 0;
            totalAmount += amount;
          });
        }
      });

      totalCheckCashEl.textContent = formatCurrency(totalCheckCash);
      totalAmountEl.textContent = formatCurrency(totalAmount);

      var isBalanced = Math.abs(totalCheckCash - totalAmount) < 0.01;
      if (isBalanced) {
        totalCheckCashField.classList.remove('mismatch');
        totalAmountField.classList.remove('mismatch');
      } else {
        totalCheckCashField.classList.add('mismatch');
        totalAmountField.classList.add('mismatch');
      }
    }

    function handleInputChange(event) {
      updateTotals();
      if (event && event.target) {
        var targetRow = event.target.closest('.main-row');
        if (targetRow && isRowFilled(targetRow) && isLastMainRow(targetRow)) {
          addRow();
        }
      }
      sendDataToJotForm();
    }

    function handleBlur() {
      sendDataToJotForm();
    }

    function isRowFilled(row) {
      var inputs = row.querySelectorAll('input, select');
      return Array.prototype.some.call(inputs, function(input) {
        if (input.type === 'number') {
          return parseFloat(input.value) > 0;
        }
        return input.value && input.value.toString().trim() !== '';
      });
    }

    function isLastMainRow(row) {
      var mainRows = matrixBody.querySelectorAll('.main-row');
      return mainRows.length && mainRows[mainRows.length - 1] === row;
    }

    function ensureEmptyRow() {
      var mainRows = matrixBody.querySelectorAll('.main-row');
      if (!mainRows.length) {
        addRow();
        addRow();
        return;
      }
      var lastRow = mainRows[mainRows.length - 1];
      if (isRowFilled(lastRow)) {
        addRow();
      }
    }

    function collectRows() {
      var rows = [];
      var mainRows = matrixBody.querySelectorAll('.main-row');

      mainRows.forEach(function(row, index) {
        var borrower = row.querySelector('[name="borrower"]').value.trim();
        var loansRow = row.nextElementSibling;
        var hasLoanData = false;

        if (loansRow && loansRow.classList.contains('loans-row')) {
          var loanEntries = loansRow.querySelectorAll('.loan-entry');
          loanEntries.forEach(function(entry) {
            var loanNumber = entry.querySelector('[name="loanNumber"]').value.trim();
            var amount = entry.querySelector('[name="amount"]').value;
            if (loanNumber || parseFloat(amount) > 0) {
              hasLoanData = true;
            }
          });
        }

        if (borrower || hasLoanData) {
          var loans = [];
          if (loansRow && loansRow.classList.contains('loans-row')) {
            var loanEntries = loansRow.querySelectorAll('.loan-entry');
            loanEntries.forEach(function(entry) {
              var loanNumber = entry.querySelector('[name="loanNumber"]').value.trim();
              var amount = entry.querySelector('[name="amount"]').value;
              if (loanNumber || parseFloat(amount) > 0) {
                loans.push({
                  loanNumber: loanNumber,
                  amount: amount || '0'
                });
              }
            });
          }

          rows.push({
            borrower: borrower,
            remitter: row.querySelector('[name="remitter"]').value.trim(),
            paymentType: row.querySelector('[name="paymentType"]').value,
            checkCashAmount: row.querySelector('[name="checkCashAmount"]').value || '0',
            effectiveDate: row.querySelector('[name="effectiveDate"]').value,
            remarks: row.querySelector('[name="remarks"]').value.trim(),
            loans: loans
          });
        }
      });

      return rows;
    }

    function buildTextOutput(rows, totalCheckCash, totalAmount) {
      var lines = [];
      lines.push('='.repeat(50));
      lines.push('PAYMENT RECEIPT SUMMARY');
      lines.push('='.repeat(50));
      lines.push('');

      rows.forEach(function(row, index) {
        lines.push('--- Payment ' + (index + 1) + ' ---');
        lines.push('Borrower: ' + (row.borrower || 'N/A'));
        if (row.remitter) {
          lines.push('Remitter: ' + row.remitter);
        }
        lines.push('Payment Type: ' + row.paymentType);
        lines.push('Check/Cash Amount: ' + formatCurrency(row.checkCashAmount));
        if (row.effectiveDate) {
          lines.push('Effective Date: ' + formatDate(row.effectiveDate));
        }
        if (row.remarks) {
          lines.push('Remarks: ' + row.remarks);
        }

        if (row.loans && row.loans.length > 0) {
          lines.push('');
          lines.push('  Loan Allocations:');
          row.loans.forEach(function(loan, loanIndex) {
            lines.push('    ' + (loanIndex + 1) + '. Loan #' + (loan.loanNumber || 'N/A') + ': ' + formatCurrency(loan.amount));
          });
        }
        lines.push('');
      });

      lines.push('='.repeat(50));
      lines.push('TOTALS');
      lines.push('='.repeat(50));
      lines.push('Total Check/Cash: ' + formatCurrency(totalCheckCash));
      lines.push('Total Loan Amounts: ' + formatCurrency(totalAmount));

      var difference = parseFloat(totalCheckCash) - parseFloat(totalAmount);
      if (Math.abs(difference) >= 0.01) {
        lines.push('Difference: ' + formatCurrency(difference));
      } else {
        lines.push('Status: BALANCED');
      }

      return lines.join('\n');
    }

    function buildSubmissionPayload() {
      var rows = collectRows();
      var totalCheckCash = totalCheckCashEl.textContent.replace(/[$,]/g, '');
      var totalAmount = totalAmountEl.textContent.replace(/[$,]/g, '');

      var jsonData = {
        rows: rows,
        totalCheckCash: totalCheckCash,
        totalAmount: totalAmount,
        rowCount: rows.length
      };

      var textOutput = buildTextOutput(rows, totalCheckCash, totalAmount);

      // Combined output with clear separator
      return {
        text: textOutput,
        json: JSON.stringify(jsonData),
        combined: textOutput + '\n\n[JSON_DATA]\n' + JSON.stringify(jsonData)
      };
    }

    function sendDataToJotForm() {
      if (!widgetReady) return;

      var payload = buildSubmissionPayload();

      if (typeof JFCustomWidget !== 'undefined' && JFCustomWidget.sendData) {
        JFCustomWidget.sendData({
          value: payload.combined
        });
      }
    }

    function notifyHeight() {
      if (typeof JFCustomWidget !== 'undefined' && JFCustomWidget.requestFrameResize) {
        JFCustomWidget.requestFrameResize();
      }
    }

    function applySettings() {
      if (typeof JFCustomWidget !== 'undefined') {
        // Column Headers
        var headersSetting = JFCustomWidget.getWidgetSetting('columnHeaders');
        if (headersSetting) {
          var headers = headersSetting.split(',');
          var keys = ['borrower', 'remitter', 'paymentType', 'checkCashAmount', 'effectiveDate', 'remarks', 'actions'];
          headers.forEach(function(header, index) {
            if (keys[index] && header.trim()) {
              settings.columnHeaders[keys[index]] = header.trim();
              var thEl = document.getElementById('th-' + keys[index]);
              if (thEl) {
                thEl.textContent = header.trim();
              }
            }
          });
        }

        // Payment Types
        var paymentTypesSetting = JFCustomWidget.getWidgetSetting('paymentTypes');
        if (paymentTypesSetting) {
          settings.paymentTypes = paymentTypesSetting.split(',').map(function(pt) {
            return pt.trim();
          }).filter(function(pt) {
            return pt;
          });
        }

        // Placeholders
        var placeholdersSetting = JFCustomWidget.getWidgetSetting('placeholders');
        if (placeholdersSetting) {
          var placeholders = placeholdersSetting.split(',');
          var placeholderKeys = ['borrower', 'remitter', 'checkCashAmount', 'effectiveDate', 'loanNumber', 'amount', 'remarks'];
          placeholders.forEach(function(placeholder, index) {
            if (placeholderKeys[index] && placeholder.trim()) {
              settings.placeholders[placeholderKeys[index]] = placeholder.trim();
            }
          });
        }
      }
    }

    function initializeWidget() {
      if (initialized) return;
      initialized = true;

      applySettings();
      addRow();
      addRow();
      notifyHeight();
    }

    // Initialize on DOM ready as fallback
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', function() {
        setTimeout(initializeWidget, 100);
      });
    } else {
      setTimeout(initializeWidget, 100);
    }

    // JotForm widget initialization
    if (typeof JFCustomWidget !== 'undefined') {
      JFCustomWidget.subscribe('ready', function() {
        widgetReady = true;
        initializeWidget();

        JFCustomWidget.subscribe('submit', function() {
          var payload = buildSubmissionPayload();
          var msg = {
            valid: true,
            value: payload.combined
          };
          JFCustomWidget.sendSubmit(msg);
        });
      });
    } else {
      widgetReady = true;
    }
  </script>
</body>
</html>
