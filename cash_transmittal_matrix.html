<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Cash Transmittal Widget</title>
  <script src="//js.jotform.com/JotFormCustomWidget.min.js"></script>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      margin: 0;
      padding: 12px;
      color: #1a1a1a;
    }

    #main {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-width: 1200px;
    }

    .table-wrapper {
      overflow-x: auto;
    }

    .matrix-table {
      width: 100%;
      border-collapse: collapse;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.08);
    }

    .matrix-table th,
    .matrix-table td {
      border: 1px solid #dcdcdc;
      padding: 5px;
      vertical-align: middle;
    }

    .matrix-table th {
      background: #4a5568;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.02em;
      color: #ffffff;
    }

    .matrix-table tbody tr:nth-child(odd) {
      background-color: #f8fafc;
    }

    .matrix-table tbody tr:nth-child(even) {
      background-color: #eef2f7;
    }

    .matrix-table input,
    .matrix-table select {
      width: 100%;
      box-sizing: border-box;
      padding: 6px 8px;
      font-size: 13px;
      border-radius: 4px;
      border: 1px solid #d7deea;
      background: #fff;
    }

    .matrix-table input:focus,
    .matrix-table select:focus {
      outline: none;
      border-color: #2d6cdf;
      box-shadow: 0 0 0 2px rgba(45, 108, 223, 0.15);
    }

    .matrix-table input.invalid-loan {
      background-color: #fff3e0;
      border-color: #ff9800;
    }

    .matrix-table input.required-missing {
      background-color: #ffebee;
      border-color: #f44336;
    }

    .loan-applied-container {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .loan-applied-row {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .loan-applied-row input {
      width: auto;
    }

    .loan-applied-row input[name="loanNumber"] {
      width: 90px;
    }

    .loan-applied-row input[name="loanAmount"] {
      width: 80px;
      text-align: right;
    }

    .loan-applied-row input[name="loanComments"] {
      width: 120px;
      flex-grow: 1;
    }

    .loan-btn {
      width: 24px;
      height: 24px;
      border-radius: 4px;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 14px;
      flex-shrink: 0;
    }

    .loan-btn-add {
      background: #4caf50;
      color: white;
    }

    .loan-btn-add:hover {
      background: #388e3c;
    }

    .loan-btn-remove {
      background: #f44336;
      color: white;
    }

    .loan-btn-remove:hover {
      background: #d32f2f;
    }

    .action-btn {
      padding: 4px 8px;
      border-radius: 4px;
      border: none;
      cursor: pointer;
      font-size: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      margin: 2px;
    }

    .action-btn-copy {
      background: #2196f3;
      color: white;
    }

    .action-btn-copy:hover {
      background: #1976d2;
    }

    .action-btn-remove {
      background: #f44336;
      color: white;
    }

    .action-btn-remove:hover {
      background: #d32f2f;
    }

    .actions-cell {
      white-space: nowrap;
      text-align: center;
    }

    .totals-bar {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    .total-box {
      padding: 8px 14px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 13px;
    }

    .total-received {
      background: #e3f2fd;
      color: #1565c0;
    }

    .total-allocated {
      background: #e8f5e9;
      color: #2e7d32;
    }

    .total-difference {
      background: #fff3e0;
      color: #ef6c00;
    }

    .total-difference.balanced {
      background: #e8f5e9;
      color: #2e7d32;
    }

    .total-difference.over {
      background: #ffebee;
      color: #c62828;
    }

    .icon-svg {
      width: 14px;
      height: 14px;
      fill: currentColor;
    }
  </style>
</head>
<body>
  <div id="main">
    <div class="table-wrapper">
      <table class="matrix-table" aria-label="Cash Transmittal">
        <thead>
          <tr>
            <th id="col-borrower">Borrower Name</th>
            <th id="col-remitter">Remitter Name</th>
            <th id="col-paymentType">Payment Type</th>
            <th id="col-checkCashAmount">Check/Cash Amount</th>
            <th id="col-effectiveDate">Effective Date</th>
            <th id="col-loanApplied">Loan Applied (Loan # / Amount / Comments)</th>
            <th id="col-actions">Actions</th>
          </tr>
        </thead>
        <tbody id="matrixBody"></tbody>
      </table>
    </div>
    <div class="totals-bar">
      <div class="total-box total-received">Total Received: <span id="totalReceived">$0.00</span></div>
      <div class="total-box total-allocated">Total Allocated: <span id="totalAllocated">$0.00</span></div>
      <div class="total-box total-difference" id="differenceBox">Difference: <span id="totalDifference">$0.00</span></div>
    </div>
  </div>

  <script>
    // ===========================================
    // UUID GENERATOR
    // ===========================================
    function generateUUID() {
      return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
        var r = Math.random() * 16 | 0;
        var v = c === 'x' ? r : (r & 0x3 | 0x8);
        return v.toString(16);
      });
    }

    // ===========================================
    // CONFIGURATION & DEFAULTS
    // ===========================================
    var config = {
      paymentTypes: ['Cash', 'Check', 'Money Order'],
      placeholders: {
        borrower: 'Borrower Name',
        remitter: 'Remitter Name',
        checkCashAmount: '0.00',
        loanNumber: 'Loan #',
        loanAmount: '0.00',
        loanComments: 'Comments'
      },
      sharePointSiteUrl: '',
      transactionsListName: 'Transactions',
      loanAppliedsListName: 'LoanApplieds'
    };

    // Transmittal ID - generated once per form session
    var transmittalId = generateUUID();
    var transmittalTimestamp = new Date().toISOString();

    // ===========================================
    // DOM REFERENCES
    // ===========================================
    var matrixBody = document.getElementById('matrixBody');
    var totalReceivedEl = document.getElementById('totalReceived');
    var totalAllocatedEl = document.getElementById('totalAllocated');
    var totalDifferenceEl = document.getElementById('totalDifference');
    var differenceBox = document.getElementById('differenceBox');

    var initialized = false;

    // ===========================================
    // UTILITY FUNCTIONS
    // ===========================================
    function formatCurrency(value) {
      var num = parseFloat(value);
      if (isNaN(num)) return '$0.00';
      return '$' + num.toFixed(2);
    }

    function parseCurrency(value) {
      var num = parseFloat(value);
      return isNaN(num) ? 0 : num;
    }

    function isValidLoanNumber(value) {
      if (!value || value.trim() === '') return true; // Empty is ok, just not filled yet
      var cleaned = value.replace(/\D/g, '');
      return cleaned.length >= 6 && cleaned.length <= 7;
    }

    function isRowFilled(row) {
      var borrower = row.querySelector('[name="borrower"]');
      if (borrower && borrower.value.trim() !== '') return true;
      var checkAmount = row.querySelector('[name="checkCashAmount"]');
      if (checkAmount && parseCurrency(checkAmount.value) > 0) return true;
      return false;
    }

    function isLastRow(row) {
      var rows = matrixBody.querySelectorAll('tr');
      return rows.length > 0 && rows[rows.length - 1] === row;
    }

    function getRowCount() {
      return matrixBody.querySelectorAll('tr').length;
    }

    // ===========================================
    // LOAN APPLIED MANAGEMENT
    // ===========================================
    function createLoanAppliedRow(container, isFirst, loanAppliedId) {
      var row = document.createElement('div');
      row.className = 'loan-applied-row';
      row.dataset.loanAppliedId = loanAppliedId || generateUUID();

      var loanInput = document.createElement('input');
      loanInput.type = 'text';
      loanInput.name = 'loanNumber';
      loanInput.placeholder = config.placeholders.loanNumber;
      loanInput.autocomplete = 'off';
      loanInput.addEventListener('input', handleLoanNumberInput);
      loanInput.addEventListener('blur', handleInputChange);

      var amountInput = document.createElement('input');
      amountInput.type = 'number';
      amountInput.name = 'loanAmount';
      amountInput.placeholder = config.placeholders.loanAmount;
      amountInput.step = '0.01';
      amountInput.min = '0';
      amountInput.autocomplete = 'off';
      amountInput.addEventListener('input', handleInputChange);
      amountInput.addEventListener('blur', handleInputChange);

      var commentsInput = document.createElement('input');
      commentsInput.type = 'text';
      commentsInput.name = 'loanComments';
      commentsInput.placeholder = config.placeholders.loanComments;
      commentsInput.autocomplete = 'off';
      commentsInput.addEventListener('blur', handleInputChange);

      row.appendChild(loanInput);
      row.appendChild(amountInput);
      row.appendChild(commentsInput);

      if (isFirst) {
        var addBtn = document.createElement('button');
        addBtn.type = 'button';
        addBtn.className = 'loan-btn loan-btn-add';
        addBtn.innerHTML = '+';
        addBtn.title = 'Add another loan allocation';
        addBtn.tabIndex = 0;
        addBtn.addEventListener('click', function() {
          createLoanAppliedRow(container, false);
          updateTotals();
          sendData();
          notifyHeight();
        });
        row.appendChild(addBtn);
      } else {
        var removeBtn = document.createElement('button');
        removeBtn.type = 'button';
        removeBtn.className = 'loan-btn loan-btn-remove';
        removeBtn.innerHTML = '×';
        removeBtn.title = 'Remove this loan allocation';
        removeBtn.tabIndex = -1;
        removeBtn.addEventListener('click', function() {
          row.remove();
          updateTotals();
          sendData();
          notifyHeight();
        });
        row.appendChild(removeBtn);
      }

      container.appendChild(row);
      return row;
    }

    function handleLoanNumberInput(event) {
      var input = event.target;
      var value = input.value;

      input.classList.remove('invalid-loan');

      if (value.trim() !== '' && !isValidLoanNumber(value)) {
        input.classList.add('invalid-loan');
      }

      handleInputChange();
    }

    // ===========================================
    // ROW MANAGEMENT
    // ===========================================
    function createRow(defaults, transactionId) {
      var row = document.createElement('tr');
      row.dataset.transactionId = transactionId || generateUUID();

      // Borrower
      var borrowerCell = document.createElement('td');
      var borrowerInput = document.createElement('input');
      borrowerInput.type = 'text';
      borrowerInput.name = 'borrower';
      borrowerInput.placeholder = config.placeholders.borrower;
      borrowerInput.autocomplete = 'off';
      borrowerInput.addEventListener('input', handleInputChange);
      borrowerInput.addEventListener('blur', handleInputChange);
      borrowerCell.appendChild(borrowerInput);
      row.appendChild(borrowerCell);

      // Remitter
      var remitterCell = document.createElement('td');
      var remitterInput = document.createElement('input');
      remitterInput.type = 'text';
      remitterInput.name = 'remitter';
      remitterInput.placeholder = config.placeholders.remitter;
      remitterInput.autocomplete = 'off';
      remitterInput.addEventListener('blur', handleInputChange);
      remitterCell.appendChild(remitterInput);
      row.appendChild(remitterCell);

      // Payment Type
      var paymentCell = document.createElement('td');
      var paymentSelect = document.createElement('select');
      paymentSelect.name = 'paymentType';
      config.paymentTypes.forEach(function(opt) {
        var option = document.createElement('option');
        option.value = opt;
        option.textContent = opt;
        paymentSelect.appendChild(option);
      });
      paymentSelect.addEventListener('change', handleInputChange);
      paymentCell.appendChild(paymentSelect);
      row.appendChild(paymentCell);

      // Check/Cash Amount
      var amountCell = document.createElement('td');
      var amountInput = document.createElement('input');
      amountInput.type = 'number';
      amountInput.name = 'checkCashAmount';
      amountInput.placeholder = config.placeholders.checkCashAmount;
      amountInput.step = '0.01';
      amountInput.min = '0';
      amountInput.autocomplete = 'off';
      amountInput.addEventListener('input', handleInputChange);
      amountInput.addEventListener('blur', handleInputChange);
      amountCell.appendChild(amountInput);
      row.appendChild(amountCell);

      // Effective Date
      var dateCell = document.createElement('td');
      var dateInput = document.createElement('input');
      dateInput.type = 'date';
      dateInput.name = 'effectiveDate';
      dateInput.autocomplete = 'off';
      dateInput.addEventListener('change', handleInputChange);
      dateCell.appendChild(dateInput);
      row.appendChild(dateCell);

      // Loan Applied Container
      var loanCell = document.createElement('td');
      var loanContainer = document.createElement('div');
      loanContainer.className = 'loan-applied-container';
      createLoanAppliedRow(loanContainer, true);
      loanCell.appendChild(loanContainer);
      row.appendChild(loanCell);

      // Actions
      var actionsCell = document.createElement('td');
      actionsCell.className = 'actions-cell';

      var copyBorrowerBtn = document.createElement('button');
      copyBorrowerBtn.type = 'button';
      copyBorrowerBtn.className = 'action-btn action-btn-copy';
      copyBorrowerBtn.innerHTML = '<svg class="icon-svg" viewBox="0 0 24 24"><path d="M16 1H4C3 1 2 2 2 3v14h2V3h12V1zm3 4H8C7 5 6 6 6 7v14c0 1 1 2 2 2h11c1 0 2-1 2-2V7c0-1-1-2-2-2zm0 16H8V7h11v14z"/></svg>';
      copyBorrowerBtn.title = 'Copy Borrower to new row';
      copyBorrowerBtn.tabIndex = 0;
      copyBorrowerBtn.addEventListener('click', function() {
        copyBorrower(row);
      });

      var removeBtn = document.createElement('button');
      removeBtn.type = 'button';
      removeBtn.className = 'action-btn action-btn-remove';
      removeBtn.innerHTML = '<svg class="icon-svg" viewBox="0 0 24 24"><path d="M19 6.4L17.6 5 12 10.6 6.4 5 5 6.4 10.6 12 5 17.6 6.4 19 12 13.4 17.6 19 19 17.6 13.4 12z"/></svg>';
      removeBtn.title = 'Remove row';
      removeBtn.tabIndex = -1;
      removeBtn.addEventListener('click', function() {
        removeRow(row);
      });

      actionsCell.appendChild(copyBorrowerBtn);
      actionsCell.appendChild(removeBtn);
      row.appendChild(actionsCell);

      matrixBody.appendChild(row);

      // Apply defaults
      if (defaults) {
        if (defaults.borrower) borrowerInput.value = defaults.borrower;
        if (defaults.remitter) remitterInput.value = defaults.remitter;
        if (defaults.paymentType) paymentSelect.value = defaults.paymentType;
        if (defaults.checkCashAmount) amountInput.value = defaults.checkCashAmount;
        if (defaults.effectiveDate) dateInput.value = defaults.effectiveDate;
      }

      updateTotals();
      sendData();
      notifyHeight();

      return row;
    }

    function removeRow(row) {
      var rows = matrixBody.querySelectorAll('tr');
      if (rows.length <= 2) {
        // Clear the row instead of removing if we're at minimum
        row.querySelector('[name="borrower"]').value = '';
        row.querySelector('[name="remitter"]').value = '';
        row.querySelector('[name="paymentType"]').selectedIndex = 0;
        row.querySelector('[name="checkCashAmount"]').value = '';
        row.querySelector('[name="effectiveDate"]').value = '';

        var loanContainer = row.querySelector('.loan-applied-container');
        loanContainer.innerHTML = '';
        createLoanAppliedRow(loanContainer, true);
      } else {
        row.remove();
      }

      ensureBlankRow();
      updateTotals();
      sendData();
      notifyHeight();
    }

    function copyBorrower(sourceRow) {
      var borrower = sourceRow.querySelector('[name="borrower"]').value;
      var remitter = sourceRow.querySelector('[name="remitter"]').value;

      var rows = matrixBody.querySelectorAll('tr');
      var lastRow = rows[rows.length - 1];

      if (!isRowFilled(lastRow)) {
        lastRow.querySelector('[name="borrower"]').value = borrower;
        lastRow.querySelector('[name="remitter"]').value = remitter;
        ensureBlankRow();
      } else {
        createRow({ borrower: borrower, remitter: remitter });
        ensureBlankRow();
      }

      updateTotals();
      sendData();
    }

    function ensureBlankRow() {
      var rows = matrixBody.querySelectorAll('tr');
      if (rows.length === 0) {
        createRow();
        createRow();
        return;
      }

      var lastRow = rows[rows.length - 1];
      if (isRowFilled(lastRow)) {
        createRow();
      }
    }

    function handleInputChange() {
      var rows = matrixBody.querySelectorAll('tr');
      var lastRow = rows[rows.length - 1];

      if (lastRow && isRowFilled(lastRow) && isLastRow(lastRow)) {
        createRow();
      }

      updateTotals();
      sendData();
    }

    // ===========================================
    // TOTALS CALCULATION
    // ===========================================
    function updateTotals() {
      var rows = matrixBody.querySelectorAll('tr');
      var totalReceived = 0;
      var totalAllocated = 0;

      rows.forEach(function(row) {
        var checkCashAmount = parseCurrency(row.querySelector('[name="checkCashAmount"]').value);
        totalReceived += checkCashAmount;

        var loanAmounts = row.querySelectorAll('[name="loanAmount"]');
        loanAmounts.forEach(function(input) {
          totalAllocated += parseCurrency(input.value);
        });
      });

      var difference = totalReceived - totalAllocated;

      totalReceivedEl.textContent = formatCurrency(totalReceived);
      totalAllocatedEl.textContent = formatCurrency(totalAllocated);
      totalDifferenceEl.textContent = formatCurrency(Math.abs(difference));

      differenceBox.classList.remove('balanced', 'over');
      if (Math.abs(difference) < 0.01) {
        differenceBox.classList.add('balanced');
        totalDifferenceEl.textContent = '$0.00 ✓';
      } else if (difference < 0) {
        differenceBox.classList.add('over');
        totalDifferenceEl.textContent = '-' + formatCurrency(Math.abs(difference)) + ' (Over)';
      } else {
        totalDifferenceEl.textContent = formatCurrency(difference) + ' (Unallocated)';
      }
    }

    // ===========================================
    // DATA COLLECTION & SUBMISSION
    // ===========================================
    function collectData() {
      var transactions = [];
      var loanApplieds = [];

      var rows = matrixBody.querySelectorAll('tr');

      rows.forEach(function(row, index) {
        var borrower = row.querySelector('[name="borrower"]').value.trim();
        var checkCashAmount = parseCurrency(row.querySelector('[name="checkCashAmount"]').value);

        // Skip empty rows
        if (!borrower && checkCashAmount === 0) return;

        var transactionId = row.dataset.transactionId;
        var loanAppliedRows = row.querySelectorAll('.loan-applied-row');

        var transactionLoanApplieds = [];
        var transactionAllocatedTotal = 0;
        var commentsRollup = [];

        loanAppliedRows.forEach(function(loanRow) {
          var loanNumber = loanRow.querySelector('[name="loanNumber"]').value.trim();
          var loanAmount = parseCurrency(loanRow.querySelector('[name="loanAmount"]').value);
          var loanComments = loanRow.querySelector('[name="loanComments"]').value.trim();

          // Skip empty loan applieds
          if (!loanNumber && loanAmount === 0 && !loanComments) return;

          var loanAppliedId = loanRow.dataset.loanAppliedId;
          transactionAllocatedTotal += loanAmount;

          if (loanComments) {
            commentsRollup.push(loanComments);
          }

          var loanAppliedRecord = {
            LoanApplied_ID: loanAppliedId,
            Transaction_ID: transactionId,
            Transmittal_ID: transmittalId,
            LoanNumber: loanNumber,
            Amount: loanAmount,
            Comments: loanComments
          };

          transactionLoanApplieds.push(loanAppliedRecord);
          loanApplieds.push(loanAppliedRecord);
        });

        var transactionRecord = {
          Transaction_ID: transactionId,
          Transmittal_ID: transmittalId,
          RowIndex: index + 1,
          BorrowerName: borrower,
          RemitterName: row.querySelector('[name="remitter"]').value.trim(),
          PaymentType: row.querySelector('[name="paymentType"]').value,
          CheckCashAmount: checkCashAmount,
          EffectiveDate: row.querySelector('[name="effectiveDate"]').value,
          AllocatedTotal: transactionAllocatedTotal,
          LoanAppliedCount: transactionLoanApplieds.length,
          CommentsRollup: commentsRollup.join(', '),
          LoanApplieds: transactionLoanApplieds
        };

        transactions.push(transactionRecord);
      });

      // Calculate totals
      var totalReceived = transactions.reduce(function(sum, t) { return sum + t.CheckCashAmount; }, 0);
      var totalAllocated = loanApplieds.reduce(function(sum, l) { return sum + l.Amount; }, 0);

      var transmittal = {
        Transmittal_ID: transmittalId,
        Timestamp: transmittalTimestamp,
        TotalReceived: totalReceived,
        TotalAllocated: totalAllocated,
        Difference: totalReceived - totalAllocated,
        TransactionCount: transactions.length,
        LoanAppliedCount: loanApplieds.length,
        IsBalanced: Math.abs(totalReceived - totalAllocated) < 0.01
      };

      // Build SharePoint drill-down URLs (templates)
      var sharePointUrls = {};
      if (config.sharePointSiteUrl) {
        sharePointUrls.transactionsForTransmittal = config.sharePointSiteUrl + '/Lists/' + config.transactionsListName + '/AllItems.aspx?FilterField1=Transmittal_ID&FilterValue1=' + transmittalId;
        sharePointUrls.loanAppliedsForTransmittal = config.sharePointSiteUrl + '/Lists/' + config.loanAppliedsListName + '/AllItems.aspx?FilterField1=Transmittal_ID&FilterValue1=' + transmittalId;
      }

      return {
        transmittal: transmittal,
        transactions: transactions,
        loanApplieds: loanApplieds,
        sharePointUrls: sharePointUrls
      };
    }

    function buildFormattedText(data) {
      var lines = [];

      lines.push('═══════════════════════════════════════');
      lines.push('CASH TRANSMITTAL SUMMARY');
      lines.push('═══════════════════════════════════════');
      lines.push('Transmittal ID: ' + data.transmittal.Transmittal_ID);
      lines.push('Submitted: ' + new Date(data.transmittal.Timestamp).toLocaleString());
      lines.push('');
      lines.push('Total Received:  ' + formatCurrency(data.transmittal.TotalReceived));
      lines.push('Total Allocated: ' + formatCurrency(data.transmittal.TotalAllocated));
      lines.push('Difference:      ' + formatCurrency(data.transmittal.Difference) + (data.transmittal.IsBalanced ? ' ✓ Balanced' : ''));
      lines.push('');
      lines.push('Transactions: ' + data.transmittal.TransactionCount);
      lines.push('Loan Applications: ' + data.transmittal.LoanAppliedCount);
      lines.push('');

      data.transactions.forEach(function(t, i) {
        lines.push('───────────────────────────────────────');
        lines.push('TRANSACTION #' + (i + 1) + ' [ID: ' + t.Transaction_ID.substring(0, 8) + '...]');
        lines.push('───────────────────────────────────────');
        lines.push('Borrower:     ' + t.BorrowerName);
        if (t.RemitterName) lines.push('Remitter:     ' + t.RemitterName);
        lines.push('Payment Type: ' + t.PaymentType);
        lines.push('Amount:       ' + formatCurrency(t.CheckCashAmount));
        if (t.EffectiveDate) lines.push('Eff. Date:    ' + t.EffectiveDate);
        lines.push('');

        if (t.LoanApplieds && t.LoanApplieds.length > 0) {
          lines.push('  LOAN APPLICATIONS:');
          t.LoanApplieds.forEach(function(l, j) {
            var loanLine = '    ' + (j + 1) + '. Loan #' + l.LoanNumber + ': ' + formatCurrency(l.Amount);
            if (l.Comments) loanLine += ' — ' + l.Comments;
            lines.push(loanLine);
          });
          lines.push('  Allocated Total: ' + formatCurrency(t.AllocatedTotal));
        }
        lines.push('');
      });

      lines.push('═══════════════════════════════════════');

      return lines.join('\n');
    }

    function sendData() {
      if (typeof JFCustomWidget === 'undefined') return;

      var data = collectData();
      var formattedText = buildFormattedText(data);

      var payload = {
        json: data,
        text: formattedText,
        transmittalId: transmittalId
      };

      JFCustomWidget.sendData({
        value: JSON.stringify(payload),
        valid: true
      });
    }

    // ===========================================
    // JOTFORM WIDGET INTEGRATION
    // ===========================================
    function notifyHeight() {
      if (typeof JFCustomWidget !== 'undefined') {
        try {
          JFCustomWidget.requestFrameResize();
        } catch (e) {
          console.log('Height notification error:', e);
        }
      }
    }

    function initializeWidget() {
      if (initialized) return;
      initialized = true;

      // Create first working row and blank row
      createRow();
      createRow();

      updateTotals();
      sendData();
      notifyHeight();
    }

    // Initialize on DOM ready
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', function() {
        setTimeout(initializeWidget, 100);
      });
    } else {
      setTimeout(initializeWidget, 100);
    }

    // JotForm Widget Integration
    if (typeof JFCustomWidget !== 'undefined') {
      JFCustomWidget.subscribe('ready', function() {
        // Load configuration from widget settings
        var paymentTypesParam = JFCustomWidget.getWidgetSetting('paymentTypes');
        if (paymentTypesParam) {
          config.paymentTypes = paymentTypesParam.split(',').map(function(s) { return s.trim(); });
        }

        var sharePointUrl = JFCustomWidget.getWidgetSetting('sharePointSiteUrl');
        if (sharePointUrl) {
          config.sharePointSiteUrl = sharePointUrl;
        }

        var transactionsListName = JFCustomWidget.getWidgetSetting('transactionsListName');
        if (transactionsListName) {
          config.transactionsListName = transactionsListName;
        }

        var loanAppliedsListName = JFCustomWidget.getWidgetSetting('loanAppliedsListName');
        if (loanAppliedsListName) {
          config.loanAppliedsListName = loanAppliedsListName;
        }

        // Placeholder configuration
        var placeholderBorrower = JFCustomWidget.getWidgetSetting('placeholderBorrower');
        if (placeholderBorrower) config.placeholders.borrower = placeholderBorrower;

        var placeholderRemitter = JFCustomWidget.getWidgetSetting('placeholderRemitter');
        if (placeholderRemitter) config.placeholders.remitter = placeholderRemitter;

        var placeholderLoanNumber = JFCustomWidget.getWidgetSetting('placeholderLoanNumber');
        if (placeholderLoanNumber) config.placeholders.loanNumber = placeholderLoanNumber;

        var placeholderLoanComments = JFCustomWidget.getWidgetSetting('placeholderLoanComments');
        if (placeholderLoanComments) config.placeholders.loanComments = placeholderLoanComments;

        initializeWidget();

        JFCustomWidget.subscribe('submit', function() {
          var data = collectData();
          var formattedText = buildFormattedText(data);

          var payload = {
            json: data,
            text: formattedText,
            transmittalId: transmittalId
          };

          var isValid = data.transactions.length > 0;

          JFCustomWidget.sendSubmit({
            valid: isValid,
            value: JSON.stringify(payload)
          });
        });
      });
    }
  </script>
</body>
</html>
