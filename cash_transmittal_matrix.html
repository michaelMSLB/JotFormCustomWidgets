<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Cash Transmittal Widget</title>
  <script src="//js.jotform.com/JotFormCustomWidget.min.js"></script>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      margin: 0;
      padding: 12px;
      color: #1a1a1a;
    }

    #main {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-width: 1200px;
    }

    .table-wrapper {
      overflow-x: auto;
    }

    .matrix-table {
      width: 100%;
      border-collapse: collapse;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.08);
    }

    .matrix-table th,
    .matrix-table td {
      border: 1px solid #dcdcdc;
      padding: 5px;
      vertical-align: middle;
    }

    .matrix-table th {
      background: #4a5568;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.02em;
      color: #ffffff;
    }

    .matrix-table input,
    .matrix-table select {
      width: 100%;
      box-sizing: border-box;
      padding: 6px 8px;
      font-size: 13px;
      border-radius: 4px;
      border: 1px solid #d7deea;
      background: #fff;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .matrix-table input:focus,
    .matrix-table select:focus {
      outline: none;
      border-color: #2d6cdf;
      box-shadow: 0 0 0 2px rgba(45, 108, 223, 0.15);
    }

    .matrix-table input[autocomplete="off"] {
      background-image: none;
    }

    .matrix-table tr:nth-child(odd) {
      background-color: #ffffff;
    }

    .matrix-table tr:nth-child(even) {
      background-color: #f8fafc;
    }

    .matrix-table tr.is-empty {
      opacity: 0.6;
    }

    .loan-invalid {
      background-color: #fff3cd !important;
    }

    .loan-cell {
      min-width: 280px;
    }

    .loan-allocations {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .loan-row {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .loan-row input {
      width: auto;
    }

    .loan-row input[name="loanNumber"] {
      width: 90px;
    }

    .loan-row input[name="loanAmount"] {
      width: 80px;
    }

    .loan-row input[name="loanComments"] {
      width: 120px;
      flex-grow: 1;
    }

    .loan-btn {
      width: 24px;
      height: 24px;
      border-radius: 4px;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: bold;
      flex-shrink: 0;
    }

    .loan-btn-add {
      background: #2d6cdf;
      color: #fff;
    }

    .loan-btn-add:hover {
      background: #1e5bc6;
    }

    .loan-btn-remove {
      background: #e55353;
      color: #fff;
    }

    .loan-btn-remove:hover {
      background: #d43d3d;
    }

    .action-cell {
      white-space: nowrap;
      text-align: center;
    }

    .action-btn {
      width: 32px;
      height: 32px;
      border-radius: 4px;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin: 2px;
    }

    .action-btn svg {
      width: 16px;
      height: 16px;
    }

    .action-btn-copy {
      background: #3b82f6;
      color: #fff;
    }

    .action-btn-copy:hover {
      background: #2563eb;
    }

    .action-btn-remove {
      background: #e55353;
      color: #fff;
      tabindex: -1;
    }

    .action-btn-remove:hover {
      background: #d43d3d;
    }

    .totals {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
    }

    .total-field {
      padding: 8px 14px;
      border-radius: 4px;
      font-weight: bold;
      font-size: 14px;
    }

    .total-received {
      background: #e0e7ff;
      color: #3730a3;
    }

    .total-allocated {
      background: #d1fae5;
      color: #065f46;
    }

    .total-difference {
      background: #fef3c7;
      color: #92400e;
    }

    .total-difference.balanced {
      background: #d1fae5;
      color: #065f46;
    }

    .total-difference.over {
      background: #fee2e2;
      color: #991b1b;
    }
  </style>
</head>
<body>
  <div id="main">
    <div class="table-wrapper">
      <table class="matrix-table" aria-label="Cash Transmittal">
        <thead>
          <tr>
            <th id="col-borrower">Borrower Name</th>
            <th id="col-remitter">Remitter Name</th>
            <th id="col-paymentType">Payment Type</th>
            <th id="col-amount">Amount Received</th>
            <th id="col-effectiveDate">Effective Date</th>
            <th id="col-loanApplied" class="loan-cell">Loan Applied (Loan # / Amount / Comments)</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="matrixBody"></tbody>
      </table>
    </div>
    <div class="totals">
      <div class="total-field total-received">Total Received: <span id="totalReceived">$0.00</span></div>
      <div class="total-field total-allocated">Total Allocated: <span id="totalAllocated">$0.00</span></div>
      <div class="total-field total-difference" id="differenceField">Difference: <span id="totalDifference">$0.00</span></div>
    </div>
  </div>

  <script type="text/javascript">
    var matrixBody = document.getElementById('matrixBody');
    var totalReceivedEl = document.getElementById('totalReceived');
    var totalAllocatedEl = document.getElementById('totalAllocated');
    var totalDifferenceEl = document.getElementById('totalDifference');
    var differenceField = document.getElementById('differenceField');

    var initialized = false;
    var transmittalId = generateUUID();

    var defaultColumnHeaders = {
      borrower: 'Borrower Name',
      remitter: 'Remitter Name',
      paymentType: 'Payment Type',
      amount: 'Amount Received',
      effectiveDate: 'Effective Date',
      loanApplied: 'Loan Applied (Loan # / Amount / Comments)'
    };

    var defaultPaymentTypes = ['Cash', 'Check', 'Money Order'];

    var defaultPlaceholders = {
      borrower: 'Borrower Name',
      remitter: 'Remitter Name (if different)',
      amount: '0.00',
      loanNumber: 'Loan #',
      loanAmount: '0.00',
      loanComments: 'Comments'
    };

    var columnHeaders = Object.assign({}, defaultColumnHeaders);
    var paymentTypes = defaultPaymentTypes.slice();
    var placeholders = Object.assign({}, defaultPlaceholders);

    function generateUUID() {
      return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
        var r = Math.random() * 16 | 0;
        var v = c === 'x' ? r : (r & 0x3 | 0x8);
        return v.toString(16);
      });
    }

    function getTodayDate() {
      var today = new Date();
      var year = today.getFullYear();
      var month = String(today.getMonth() + 1).padStart(2, '0');
      var day = String(today.getDate()).padStart(2, '0');
      return year + '-' + month + '-' + day;
    }

    function isToday(dateString) {
      return dateString === getTodayDate();
    }

    function formatCurrency(value) {
      var num = parseFloat(value);
      if (isNaN(num)) return '$0.00';
      return '$' + num.toFixed(2);
    }

    function createCellInput(type, name, placeholder) {
      var input = document.createElement('input');
      input.type = type;
      input.name = name;
      input.autocomplete = 'off';
      input.setAttribute('autocomplete', 'off');
      input.setAttribute('autocorrect', 'off');
      input.setAttribute('autocapitalize', 'off');
      input.setAttribute('spellcheck', 'false');
      if (placeholder) input.placeholder = placeholder;
      if (type === 'number') {
        input.step = '0.01';
        input.min = '0';
      }
      input.addEventListener('input', handleInputChange);
      input.addEventListener('blur', sendDataToJotForm);
      return input;
    }

    function createSelect(name, options) {
      var select = document.createElement('select');
      select.name = name;
      select.autocomplete = 'off';
      options.forEach(function(opt) {
        var option = document.createElement('option');
        option.value = opt;
        option.textContent = opt;
        select.appendChild(option);
      });
      select.addEventListener('change', handleInputChange);
      select.addEventListener('blur', sendDataToJotForm);
      return select;
    }

    function createLoanRow(container, isFirst, loanAppliedId) {
      var loanRow = document.createElement('div');
      loanRow.className = 'loan-row';
      loanRow.setAttribute('data-loan-applied-id', loanAppliedId || generateUUID());

      var loanNumInput = createCellInput('text', 'loanNumber', placeholders.loanNumber);
      loanNumInput.addEventListener('input', function() {
        validateLoanNumber(loanNumInput);
      });
      loanNumInput.addEventListener('blur', function() {
        validateLoanNumber(loanNumInput);
        sendDataToJotForm();
      });

      var loanAmountInput = createCellInput('number', 'loanAmount', placeholders.loanAmount);

      var loanCommentsInput = createCellInput('text', 'loanComments', placeholders.loanComments);

      loanRow.appendChild(loanNumInput);
      loanRow.appendChild(loanAmountInput);
      loanRow.appendChild(loanCommentsInput);

      if (isFirst) {
        var addBtn = document.createElement('button');
        addBtn.type = 'button';
        addBtn.className = 'loan-btn loan-btn-add';
        addBtn.textContent = '+';
        addBtn.title = 'Add another loan allocation';
        addBtn.addEventListener('click', function() {
          createLoanRow(container, false, generateUUID());
          updateTotals();
          sendDataToJotForm();
          notifyHeight();
        });
        loanRow.appendChild(addBtn);
      } else {
        var removeBtn = document.createElement('button');
        removeBtn.type = 'button';
        removeBtn.className = 'loan-btn loan-btn-remove';
        removeBtn.textContent = '×';
        removeBtn.title = 'Remove this loan allocation';
        removeBtn.addEventListener('click', function() {
          loanRow.remove();
          updateTotals();
          sendDataToJotForm();
          notifyHeight();
        });
        loanRow.appendChild(removeBtn);
      }

      container.appendChild(loanRow);
      return loanRow;
    }

    function validateLoanNumber(input) {
      var value = input.value.trim();
      if (value === '') {
        input.classList.remove('loan-invalid');
        return true;
      }
      var isValid = /^\d{6,7}$/.test(value);
      if (isValid) {
        input.classList.remove('loan-invalid');
      } else {
        input.classList.add('loan-invalid');
      }
      return isValid;
    }

    function addRow(defaults) {
      var row = document.createElement('tr');
      var transactionId = generateUUID();
      row.setAttribute('data-transaction-id', transactionId);

      // Borrower
      var borrowerCell = document.createElement('td');
      borrowerCell.appendChild(createCellInput('text', 'borrower', placeholders.borrower));
      row.appendChild(borrowerCell);

      // Remitter
      var remitterCell = document.createElement('td');
      remitterCell.appendChild(createCellInput('text', 'remitter', placeholders.remitter));
      row.appendChild(remitterCell);

      // Payment Type
      var paymentTypeCell = document.createElement('td');
      paymentTypeCell.appendChild(createSelect('paymentType', paymentTypes));
      row.appendChild(paymentTypeCell);

      // Amount Received
      var amountCell = document.createElement('td');
      amountCell.appendChild(createCellInput('number', 'amountReceived', placeholders.amount));
      row.appendChild(amountCell);

      // Effective Date
      var dateCell = document.createElement('td');
      var dateInput = createCellInput('date', 'effectiveDate');
      dateInput.value = getTodayDate();
      dateCell.appendChild(dateInput);
      row.appendChild(dateCell);

      // Loan Applied
      var loanCell = document.createElement('td');
      loanCell.className = 'loan-cell';
      var loanContainer = document.createElement('div');
      loanContainer.className = 'loan-allocations';
      createLoanRow(loanContainer, true, generateUUID());
      loanCell.appendChild(loanContainer);
      row.appendChild(loanCell);

      // Actions
      var actionCell = document.createElement('td');
      actionCell.className = 'action-cell';

      var copyBorrowerBtn = document.createElement('button');
      copyBorrowerBtn.type = 'button';
      copyBorrowerBtn.className = 'action-btn action-btn-copy';
      copyBorrowerBtn.title = 'Copy Borrower to new row';
      copyBorrowerBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path><rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect></svg>';
      copyBorrowerBtn.addEventListener('click', function() {
        var borrowerValue = row.querySelector('[name="borrower"]').value;
        var newRow = addRow({ borrower: borrowerValue });
        newRow.querySelector('[name="borrower"]').focus();
        sendDataToJotForm();
      });
      actionCell.appendChild(copyBorrowerBtn);

      var removeBtn = document.createElement('button');
      removeBtn.type = 'button';
      removeBtn.className = 'action-btn action-btn-remove';
      removeBtn.title = 'Remove row';
      removeBtn.tabIndex = -1;
      removeBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"></path><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>';
      removeBtn.addEventListener('click', function() {
        var rows = matrixBody.querySelectorAll('tr');
        if (rows.length > 1) {
          row.remove();
          updateTotals();
          sendDataToJotForm();
          notifyHeight();
          ensureEmptyRow();
        }
      });
      actionCell.appendChild(removeBtn);

      row.appendChild(actionCell);

      matrixBody.appendChild(row);

      if (defaults) {
        Object.keys(defaults).forEach(function(key) {
          var el = row.querySelector('[name="' + key + '"]');
          if (el) el.value = defaults[key];
        });
      }

      updateRowState(row);
      updateTotals();
      notifyHeight();

      return row;
    }

    function updateRowState(row) {
      var inputs = row.querySelectorAll('input, select');
      var hasContent = Array.prototype.some.call(inputs, function(input) {
        if (input.name === 'effectiveDate') return false;
        return input.value && input.value.trim() !== '' && input.value !== '0.00';
      });
      if (hasContent) {
        row.classList.remove('is-empty');
      } else {
        row.classList.add('is-empty');
      }
    }

    function isRowEmpty(row) {
      var inputs = row.querySelectorAll('input, select');
      return !Array.prototype.some.call(inputs, function(input) {
        if (input.name === 'effectiveDate') return false;
        if (input.tagName === 'SELECT') return false;
        return input.value && input.value.trim() !== '' && input.value !== '0.00';
      });
    }

    function isLastRow(row) {
      var rows = matrixBody.querySelectorAll('tr');
      return rows.length && rows[rows.length - 1] === row;
    }

    function ensureEmptyRow() {
      var rows = matrixBody.querySelectorAll('tr');
      if (rows.length === 0) {
        addRow();
        return;
      }
      var lastRow = rows[rows.length - 1];
      if (!isRowEmpty(lastRow)) {
        addRow();
      }
    }

    function handleInputChange(event) {
      var row = event.target.closest('tr');
      if (row) {
        updateRowState(row);
        if (!isRowEmpty(row) && isLastRow(row)) {
          addRow();
        }
      }
      updateTotals();
    }

    function updateTotals() {
      var rows = matrixBody.querySelectorAll('tr');
      var totalReceived = 0;
      var totalAllocated = 0;

      rows.forEach(function(row) {
        var received = parseFloat(row.querySelector('[name="amountReceived"]').value) || 0;
        totalReceived += received;

        var loanAmounts = row.querySelectorAll('[name="loanAmount"]');
        loanAmounts.forEach(function(input) {
          totalAllocated += parseFloat(input.value) || 0;
        });
      });

      var difference = totalReceived - totalAllocated;

      totalReceivedEl.textContent = formatCurrency(totalReceived);
      totalAllocatedEl.textContent = formatCurrency(totalAllocated);
      totalDifferenceEl.textContent = formatCurrency(Math.abs(difference));

      differenceField.classList.remove('balanced', 'over');
      if (difference === 0) {
        differenceField.classList.add('balanced');
        totalDifferenceEl.textContent = '$0.00 ✓';
      } else if (difference < 0) {
        differenceField.classList.add('over');
        totalDifferenceEl.textContent = formatCurrency(Math.abs(difference)) + ' over';
      } else {
        totalDifferenceEl.textContent = formatCurrency(difference) + ' remaining';
      }
    }

    function collectData() {
      var transactions = [];
      var loanApplieds = [];
      var todayDate = getTodayDate();

      var rows = matrixBody.querySelectorAll('tr');
      rows.forEach(function(row, index) {
        if (isRowEmpty(row)) return;

        var transactionId = row.getAttribute('data-transaction-id');
        var effectiveDate = row.querySelector('[name="effectiveDate"]').value;
        var effectiveToday = isToday(effectiveDate) ? 'Yes' : 'No';

        var transactionComments = [];
        var loanRows = row.querySelectorAll('.loan-row');

        loanRows.forEach(function(loanRow) {
          var loanAppliedId = loanRow.getAttribute('data-loan-applied-id');
          var loanNumber = loanRow.querySelector('[name="loanNumber"]').value.trim();
          var loanAmount = loanRow.querySelector('[name="loanAmount"]').value;
          var loanComments = loanRow.querySelector('[name="loanComments"]').value.trim();

          if (loanNumber || loanAmount) {
            loanApplieds.push({
              LoanApplied_ID: loanAppliedId,
              Transaction_ID: transactionId,
              Transmittal_ID: transmittalId,
              LoanNumber: loanNumber,
              AmountApplied: parseFloat(loanAmount) || 0,
              Comments: loanComments,
              EffectiveDate: effectiveDate,
              EffectiveToday: effectiveToday
            });

            if (loanComments) {
              transactionComments.push(loanComments);
            }
          }
        });

        transactions.push({
          Transaction_ID: transactionId,
          Transmittal_ID: transmittalId,
          RowIndex: index + 1,
          BorrowerName: row.querySelector('[name="borrower"]').value.trim(),
          RemitterName: row.querySelector('[name="remitter"]').value.trim(),
          PaymentType: row.querySelector('[name="paymentType"]').value,
          AmountReceived: parseFloat(row.querySelector('[name="amountReceived"]').value) || 0,
          EffectiveDate: effectiveDate,
          EffectiveToday: effectiveToday,
          Comments: transactionComments.join(', ')
        });
      });

      var totalReceived = transactions.reduce(function(sum, t) { return sum + t.AmountReceived; }, 0);
      var totalAllocated = loanApplieds.reduce(function(sum, l) { return sum + l.AmountApplied; }, 0);

      return {
        Transmittal: {
          Transmittal_ID: transmittalId,
          SubmittedAt: new Date().toISOString(),
          TotalReceived: totalReceived,
          TotalAllocated: totalAllocated,
          Difference: totalReceived - totalAllocated,
          TransactionCount: transactions.length,
          LoanAppliedCount: loanApplieds.length
        },
        Transactions: transactions,
        LoanApplieds: loanApplieds
      };
    }

    function generateTextSummary(data) {
      var lines = [];
      lines.push('=== CASH TRANSMITTAL ===');
      lines.push('Transmittal ID: ' + data.Transmittal.Transmittal_ID);
      lines.push('Submitted: ' + data.Transmittal.SubmittedAt);
      lines.push('Total Received: ' + formatCurrency(data.Transmittal.TotalReceived));
      lines.push('Total Allocated: ' + formatCurrency(data.Transmittal.TotalAllocated));
      lines.push('Difference: ' + formatCurrency(data.Transmittal.Difference));
      lines.push('');

      data.Transactions.forEach(function(t, i) {
        lines.push('--- Transaction ' + (i + 1) + ' ---');
        lines.push('Transaction ID: ' + t.Transaction_ID);
        lines.push('Borrower: ' + t.BorrowerName);
        if (t.RemitterName) lines.push('Remitter: ' + t.RemitterName);
        lines.push('Payment Type: ' + t.PaymentType);
        lines.push('Amount Received: ' + formatCurrency(t.AmountReceived));
        lines.push('Effective Date: ' + t.EffectiveDate + ' (' + (t.EffectiveToday === 'Yes' ? 'Today' : 'Backdated') + ')');
        if (t.Comments) lines.push('Comments: ' + t.Comments);

        var relatedLoans = data.LoanApplieds.filter(function(l) {
          return l.Transaction_ID === t.Transaction_ID;
        });

        if (relatedLoans.length > 0) {
          lines.push('Loan Allocations:');
          relatedLoans.forEach(function(l) {
            var loanLine = '  • Loan ' + l.LoanNumber + ': ' + formatCurrency(l.AmountApplied);
            if (l.Comments) loanLine += ' (' + l.Comments + ')';
            lines.push(loanLine);
          });
        }
        lines.push('');
      });

      return lines.join('\n');
    }

    function sendDataToJotForm() {
      if (typeof JFCustomWidget === 'undefined') return;

      var data = collectData();
      var textSummary = generateTextSummary(data);

      var payload = {
        json: data,
        text: textSummary
      };

      JFCustomWidget.sendData({
        value: JSON.stringify(payload)
      });
    }

    function notifyHeight() {
      if (typeof JFCustomWidget !== 'undefined') {
        JFCustomWidget.requestFrameResize();
      }
    }

    function initializeWidget() {
      if (initialized) return;
      initialized = true;

      addRow();
      addRow();
      notifyHeight();
    }

    // Initialize on DOM ready
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', function() {
        setTimeout(initializeWidget, 100);
      });
    } else {
      setTimeout(initializeWidget, 100);
    }

    // JotForm widget initialization
    if (typeof JFCustomWidget !== 'undefined') {
      JFCustomWidget.subscribe('ready', function() {
        // Load custom column headers
        var customHeaders = JFCustomWidget.getWidgetSetting('columnHeaders');
        if (customHeaders) {
          var headerArray = customHeaders.split(',');
          if (headerArray.length >= 6) {
            columnHeaders.borrower = headerArray[0].trim();
            columnHeaders.remitter = headerArray[1].trim();
            columnHeaders.paymentType = headerArray[2].trim();
            columnHeaders.amount = headerArray[3].trim();
            columnHeaders.effectiveDate = headerArray[4].trim();
            columnHeaders.loanApplied = headerArray[5].trim();
          }
        }

        // Load custom payment types
        var customPaymentTypes = JFCustomWidget.getWidgetSetting('paymentTypes');
        if (customPaymentTypes) {
          paymentTypes = customPaymentTypes.split(',').map(function(s) { return s.trim(); });
        }

        // Load custom placeholders
        var customPlaceholders = JFCustomWidget.getWidgetSetting('placeholders');
        if (customPlaceholders) {
          try {
            var parsed = JSON.parse(customPlaceholders);
            placeholders = Object.assign({}, defaultPlaceholders, parsed);
          } catch (e) {}
        }

        // Apply column headers
        document.getElementById('col-borrower').textContent = columnHeaders.borrower;
        document.getElementById('col-remitter').textContent = columnHeaders.remitter;
        document.getElementById('col-paymentType').textContent = columnHeaders.paymentType;
        document.getElementById('col-amount').textContent = columnHeaders.amount;
        document.getElementById('col-effectiveDate').textContent = columnHeaders.effectiveDate;
        document.getElementById('col-loanApplied').textContent = columnHeaders.loanApplied;

        initializeWidget();

        JFCustomWidget.subscribe('submit', function() {
          var data = collectData();
          var textSummary = generateTextSummary(data);

          var payload = {
            json: data,
            text: textSummary
          };

          var hasValidData = data.Transactions.length > 0;

          JFCustomWidget.sendSubmit({
            valid: hasValidData,
            value: JSON.stringify(payload)
          });
        });
      });
    }
  </script>
</body>
</html>
