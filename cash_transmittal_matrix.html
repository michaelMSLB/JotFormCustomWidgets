<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cash Transmittal Widget - Flat Payload v17</title>
  <script src="//js.jotform.com/JotFormCustomWidget.min.js"></script>
  <style>
    :root {
      /* Table/input colors intentionally kept neutral/original. */
      --border: #dcdcdc;
      --header: #4a5568;
      --header-text: #ffffff;
      --bg-alt: #f8fafc;
      --bg-muted: #f8fafc;
      --focus: #2d6cdf;

      /* Button/indicator colors from requested palette. */
      --good-bg: #5aa428; /* forest-green-600 - vibrant with white text */
      --good-text: #ffffff;
      --warn-bg: #ecab13; /* tuscan-sun-500 */
      --warn-text: #211803; /* tuscan-sun-950 */
      --bad-bg: #a54427; /* fiery-terracotta-600 */
      --bad-text: #ffffff;
      --info-bg: #125087; /* deep-space-blue-700 */
      --info-text: #ffffff;
      --neutral-bg: #594a40; /* dust-grey-700 */
      --neutral-text: #ffffff;
      --muted-text: #64748b;
      --surface: #ffffff;
      --surface-tint: #e9f3fc; /* deep-space-blue-50 */
    }

    html,
    body {
      margin: 0;
      padding: 0;
      overflow: visible !important;
      min-height: 100%;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      padding: 12px;
      color: #1a1a1a;
      background: var(--surface);
      box-sizing: border-box;
    }

    #main {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-width: 1280px;
      overflow: visible;
    }


    .table-wrapper {
      overflow-x: auto;
      overflow-y: visible;
    }

    .matrix-table {
      width: 100%;
      border-collapse: collapse;
      border-radius: 8px;
      overflow: visible;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.08);
    }

    .matrix-table th,
    .matrix-table td {
      border: 1px solid var(--border);
      padding: 5px;
      vertical-align: top;
    }

    .matrix-table th {
      background: var(--header);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.02em;
      color: var(--header-text);
      white-space: nowrap;
    }

    .matrix-table input,
    .matrix-table select {
      width: 100%;
      box-sizing: border-box;
      padding: 6px 8px;
      font-size: 13px;
      border-radius: 4px;
      border: 1px solid var(--border);
      background: #fff;
      transition: border-color 0.15s ease, box-shadow 0.15s ease, background-color 0.15s ease;
    }

    .matrix-table input:focus,
    .matrix-table select:focus {
      outline: none;
      border-color: var(--focus);
      box-shadow: 0 0 0 2px rgba(45, 108, 223, 0.15);
    }

    .matrix-table input[autocomplete="off"] {
      background-image: none;
    }

    .matrix-table tr:nth-child(odd) { background-color: #ffffff; }
    .matrix-table tr:nth-child(even) { background-color: var(--bg-alt); }

    .matrix-table tr.is-empty {
      opacity: 0.58;
      background: var(--bg-muted) !important;
    }

    .matrix-table tr.is-empty input,
    .matrix-table tr.is-empty select {
      background: #f9fafb;
    }


    .row-hint {
      display: none;
      font-size: 11px;
      color: var(--muted-text);
      margin-top: 3px;
      font-style: italic;
    }

    tr.is-empty .row-hint {
      display: block;
    }

    .loan-invalid,
    .amount-invalid,
    .required-invalid {
      background-color: #fff3cd !important;
      border-color: #f59e0b !important;
    }

    .loan-cell {
      min-width: 390px;
    }

    .loan-allocations {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .loan-row {
      display: grid;
      grid-template-columns: 100px 92px 1fr 28px;
      align-items: center;
      gap: 4px;
    }


    .loan-btn {
      width: 24px;
      height: 24px;
      border-radius: 4px;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: bold;
      flex-shrink: 0;
    }

    .loan-btn-add { background: var(--info-bg); color: var(--info-text); }
    .loan-btn-add:hover { background: #186bb4; }
    .loan-btn-remove { background: var(--bad-bg); color: var(--bad-text); }
    .loan-btn-remove:hover { background: #7c331d; }

    .row-balance {
      margin-top: 5px;
      font-size: 12px;
      font-weight: 700;
      text-align: right;
    }

    .row-balance.balanced { color: var(--good-text); }
    .row-balance.remaining { color: var(--warn-text); }
    .row-balance.over { color: var(--bad-text); }

    .action-cell {
      white-space: nowrap;
      text-align: center;
      vertical-align: middle !important;
      width: 34px;
      min-width: 34px;
    }

    .action-btn {
      width: 24px;
      height: 24px;
      border-radius: 4px;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin: 1px;
    }

    .action-btn svg {
      width: 13px;
      height: 13px;
    }

    .action-btn-remove { background: var(--bad-bg); color: var(--bad-text); }
    .action-btn-remove:hover { background: #7c331d; }
    tr.is-empty .action-btn-remove { visibility: hidden; }

    .totals {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      flex-wrap: wrap;
      align-items: flex-start;
      position: sticky;
      bottom: 0;
      z-index: 3;
      background: rgba(255, 255, 255, 0.97);
      padding: 6px 0 2px;
    }

    .total-field {
      padding: 8px 12px;
      border-radius: 4px;
      font-weight: bold;
      font-size: 14px;
      line-height: 1.25;
      align-self: flex-start;
      box-shadow: 0 1px 2px rgba(4, 19, 31, 0.18);
      border: 1px solid rgba(255, 255, 255, 0.16);
    }

    .received-total-stack {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 178px;
    }

    .payment-type-breakdown {
      display: grid;
      grid-template-columns: auto auto;
      column-gap: 10px;
      row-gap: 2px;
      padding-top: 4px;
      margin-top: 2px;
      border-top: 1px solid rgba(255, 255, 255, 0.45);
      font-size: 11px;
      line-height: 1.2;
      font-weight: 600;
      opacity: 0.95;
    }

    .payment-type-breakdown .breakdown-label { text-align: left; }
    .payment-type-breakdown .breakdown-value { text-align: right; font-variant-numeric: tabular-nums; }

    .total-received { background: var(--info-bg); color: var(--info-text); }
    .total-allocated { background: var(--good-bg); color: var(--good-text); }
    .total-difference { background: var(--warn-bg); color: var(--warn-text); }
    .total-difference.balanced { background: var(--good-bg); color: var(--good-text); }
    .total-difference.over,
    .total-errors { background: var(--bad-bg); color: var(--bad-text); }
    .total-ready { background: var(--good-bg); color: var(--good-text); }
    .total-ready.not-ready { background: var(--bad-bg); color: var(--bad-text); }
    .hidden { display: none !important; }

    .total-errors,
    .total-ready {
      cursor: help;
      user-select: none;
    }

    .resize-button {
      border: 1px solid var(--border);
      background: var(--surface);
      color: #3b312b;
      border-radius: 4px;
      padding: 7px 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .sync-status {
      font-size: 12px;
      color: #3b312b;
      min-width: 180px;
    }

    .sync-status.ok { color: var(--good-text); font-weight: 700; }
    .sync-status.warn { color: var(--warn-text); font-weight: 700; }
    .sync-status.bad { color: var(--bad-text); font-weight: 700; }

    .resize-button:hover,
    .resize-button:focus {
      border-color: var(--focus);
      outline: none;
      box-shadow: 0 0 0 2px rgba(22, 135, 233, 0.16);
    }

    .total-errors:focus,
    .total-ready:focus {
      outline: none;
      box-shadow: 0 0 0 2px rgba(22, 135, 233, 0.20);
    }

    .validation-summary {
      display: none;
      position: absolute;
      right: 0;
      bottom: calc(100% + 8px);
      width: min(520px, calc(100vw - 40px));
      max-height: 240px;
      overflow: auto;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 12px;
      line-height: 1.35;
      background: var(--surface);
      color: #3b312b;
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.18);
      z-index: 50;
    }

    .validation-summary::after {
      content: "";
      position: absolute;
      right: 28px;
      bottom: -7px;
      width: 12px;
      height: 12px;
      background: inherit;
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      transform: rotate(45deg);
    }

    .validation-summary.ready {
      border-color: var(--good-bg);
    }

    .validation-summary.not-ready {
      border-color: var(--warn-bg);
    }

    .total-errors:hover ~ .validation-summary,
    .total-ready:hover ~ .validation-summary,
    .total-errors:focus ~ .validation-summary,
    .total-ready:focus ~ .validation-summary,
    .validation-summary.is-visible {
      display: block;
    }

    .validation-summary ul {
      margin: 6px 0 0 18px;
      padding: 0;
    }

    .validation-summary li { margin: 2px 0; }
  </style>
</head>
<body>
  <div id="main">
    <div class="table-wrapper">
      <table class="matrix-table" aria-label="Cash Transmittal">
        <thead>
          <tr>
            <th id="col-borrower">Borrower Name</th>
            <th id="col-remitter">Remitter Name</th>
            <th id="col-paymentType">Payment Type</th>
            <th id="col-amount">Amount Received</th>
            <th id="col-effectiveDate">Effective Date</th>
            <th id="col-loanApplied" class="loan-cell">Loan Applied (Loan # / Amount / Comments)</th>
            <th>Del</th>
          </tr>
        </thead>
        <tbody id="matrixBody"></tbody>
      </table>
    </div>

    <div class="totals">
      <div class="total-field total-received received-total-stack">
        <div>Total Received: <span id="totalReceived">$0.00</span></div>
        <div class="payment-type-breakdown" aria-label="Payment type totals">
          <span class="breakdown-label">Checks</span><span class="breakdown-value" id="totalChecks">$0.00</span>
          <span class="breakdown-label">Cash</span><span class="breakdown-value" id="totalCash">$0.00</span>
          <span class="breakdown-label">Money Orders</span><span class="breakdown-value" id="totalMoneyOrders">$0.00</span>
        </div>
      </div>
      <div class="total-field total-allocated">Total Applied: <span id="totalAllocated">$0.00</span></div>
      <div class="total-field total-difference" id="differenceField">Difference: <span id="totalDifference">$0.00</span></div>
      <div class="total-field total-errors hidden" id="errorField" role="button" tabindex="0" aria-controls="validationSummary">Issues: <span id="errorCount">0</span></div>
      <div class="total-field total-ready not-ready" id="readyField" role="button" tabindex="0" aria-controls="validationSummary">Ready: <span id="readyStatus">No</span></div>
      <div class="validation-summary not-ready" id="validationSummary" role="tooltip">
        Ready to submit: No
        <ul id="validationList"><li>Enter at least one payment row.</li></ul>
      </div>
    </div>
  </div>

  <script type="text/javascript">
    var matrixBody = document.getElementById('matrixBody');
    var totalReceivedEl = document.getElementById('totalReceived');
    var totalChecksEl = document.getElementById('totalChecks');
    var totalCashEl = document.getElementById('totalCash');
    var totalMoneyOrdersEl = document.getElementById('totalMoneyOrders');
    var totalAllocatedEl = document.getElementById('totalAllocated');
    var totalDifferenceEl = document.getElementById('totalDifference');
    var differenceField = document.getElementById('differenceField');
    var errorField = document.getElementById('errorField');
    var errorCountEl = document.getElementById('errorCount');
    var readyField = document.getElementById('readyField');
    var readyStatusEl = document.getElementById('readyStatus');
    var validationSummary = document.getElementById('validationSummary');
    var validationList = document.getElementById('validationList');

    function toggleValidationTooltip(event) {
      if (event) {
        event.preventDefault();
        event.stopPropagation();
      }
      validationSummary.classList.toggle('is-visible');
    }

    function hideValidationTooltip(event) {
      if (!event) return;
      if (validationSummary.contains(event.target) || readyField.contains(event.target) || errorField.contains(event.target)) return;
      validationSummary.classList.remove('is-visible');
    }

    [readyField, errorField].forEach(function(el) {
      el.addEventListener('click', toggleValidationTooltip);
      el.addEventListener('keydown', function(event) {
        if (event.key === 'Enter' || event.key === ' ') toggleValidationTooltip(event);
        if (event.key === 'Escape') validationSummary.classList.remove('is-visible');
      });
    });

    document.addEventListener('click', hideValidationTooltip);

    var initialized = false;
    var sendTimer = null;
    var resizeTimer = null;
    var transmittalId = generateUUID();


    var defaultColumnHeaders = {
      borrower: 'Borrower Name',
      remitter: 'Remitter Name',
      paymentType: 'Payment Type',
      amount: 'Amount Received',
      effectiveDate: 'Effective Date',
      loanApplied: 'Loan Applied (Loan # / Amount / Comments)'
    };

    var defaultPaymentTypes = ['Check', 'Cash', 'Money Order'];

    var defaultPlaceholders = {
      borrower: 'Borrower Name',
      remitter: 'Remitter Name (if different)',
      amount: '0.00',
      loanNumber: 'Loan #',
      loanAmount: '0.00',
      loanComments: 'Comments / FH Code'
    };

    var columnHeaders = Object.assign({}, defaultColumnHeaders);
    var paymentTypes = defaultPaymentTypes.slice();
    var placeholders = Object.assign({}, defaultPlaceholders);

    function generateUUID() {
      if (window.crypto && typeof window.crypto.randomUUID === 'function') {
        return window.crypto.randomUUID();
      }
      return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
        var r = Math.random() * 16 | 0;
        var v = c === 'x' ? r : (r & 0x3 | 0x8);
        return v.toString(16);
      });
    }

    function getTodayDate() {
      var today = new Date();
      var year = today.getFullYear();
      var month = String(today.getMonth() + 1).padStart(2, '0');
      var day = String(today.getDate()).padStart(2, '0');
      return year + '-' + month + '-' + day;
    }

    function isToday(dateString) {
      return dateString === getTodayDate();
    }

    function toCents(value) {
      var num = parseFloat(String(value || '').replace(/,/g, ''));
      if (isNaN(num)) return 0;
      return Math.round(num * 100);
    }

    function centsToNumber(cents) {
      return Math.round(cents) / 100;
    }

    function formatCurrency(value) {
      var num = typeof value === 'number' ? value : parseFloat(value);
      if (isNaN(num)) num = 0;
      var sign = num < 0 ? '-' : '';
      return sign + '$' + Math.abs(num).toFixed(2);
    }

    function createCellInput(type, name, placeholder) {
      var input = document.createElement('input');
      input.type = type;
      input.name = name;
      input.autocomplete = 'off';
      input.setAttribute('autocomplete', 'off');
      input.setAttribute('autocorrect', 'off');
      input.setAttribute('autocapitalize', 'off');
      input.setAttribute('spellcheck', 'false');
      if (placeholder) input.placeholder = placeholder;
      if (type === 'number') {
        input.step = '0.01';
        input.min = '0';
        input.inputMode = 'decimal';
      }
      input.addEventListener('input', handleInputChange);
      input.addEventListener('blur', function() {
        if (type === 'number' && input.value !== '') {
          input.value = centsToNumber(toCents(input.value)).toFixed(2);
        }
        handleInputChange({ target: input });
        sendDataToJotForm();
        notifyHeightSoon();
      });
      return input;
    }

    function createSelect(name, options) {
      var select = document.createElement('select');
      select.name = name;
      select.autocomplete = 'off';
      options.forEach(function(opt) {
        var option = document.createElement('option');
        option.value = opt;
        option.textContent = opt;
        select.appendChild(option);
      });
      select.addEventListener('change', handleInputChange);
      select.addEventListener('blur', sendDataToJotForm);
      return select;
    }


    function createLoanRow(container, isFirst, loanAppliedId) {
      var loanRow = document.createElement('div');
      loanRow.className = 'loan-row';
      loanRow.setAttribute('data-loan-applied-id', loanAppliedId || generateUUID());

      var loanNumInput = createCellInput('text', 'loanNumber', placeholders.loanNumber);
      loanNumInput.inputMode = 'text';
      loanNumInput.pattern = '\\d{6,}(-\\d+)?';
      loanNumInput.title = 'Enter at least 6 digits. A dash and trailing digits are allowed, e.g. 123456-00.';
      loanNumInput.addEventListener('input', function() {
        validateLoanNumber(loanNumInput);
      });
      loanNumInput.addEventListener('blur', function() {
        validateLoanNumber(loanNumInput);
        sendDataToJotForm();
      });

      var loanAmountInput = createCellInput('number', 'loanAmount', placeholders.loanAmount);
      var loanCommentsInput = createCellInput('text', 'loanComments', placeholders.loanComments);

      loanRow.appendChild(loanNumInput);
      loanRow.appendChild(loanAmountInput);
      loanRow.appendChild(loanCommentsInput);

      if (isFirst) {
        var addBtn = document.createElement('button');
        addBtn.type = 'button';
        addBtn.className = 'loan-btn loan-btn-add';
        addBtn.textContent = '+';
        addBtn.title = 'Add another loan application for this payment';
        addBtn.addEventListener('click', function() {
          createLoanRow(container, false, generateUUID());
          renumberRows();
          updateTotals();
          sendDataToJotForm();
          notifyHeightSoon();
        });
        loanRow.appendChild(addBtn);
      } else {
        var removeBtn = document.createElement('button');
        removeBtn.type = 'button';
        removeBtn.className = 'loan-btn loan-btn-remove';
        removeBtn.textContent = 'x';
        removeBtn.title = 'Remove this loan application';
        removeBtn.tabIndex = -1;
        removeBtn.addEventListener('click', function() {
          loanRow.remove();
          renumberRows();
          updateTotals();
          sendDataToJotForm();
          notifyHeightSoon();
        });
        loanRow.appendChild(removeBtn);
      }

      container.appendChild(loanRow);
      return loanRow;
    }

    function normalizeLoanNumberValue(value) {
      return String(value || '')
        .trim()
        .replace(/[\u2010\u2011\u2012\u2013\u2014\u2212]/g, '-');
    }

    function isLoanNumberFormatValid(value) {
      // Required format: at least 6 digits, optionally followed by one dash and one or more digits.
      // Valid: 123456, 1234567, 123456-00, 1234567-001
      // Invalid: 12345, 123456-, 123-456, 123456.00, ABC123456, 123456-A1
      return /^\d{6,}(?:-\d+)?$/.test(normalizeLoanNumberValue(value));
    }

    function validateLoanNumber(input) {
      var value = normalizeLoanNumberValue(input.value);
      if (input.value !== value) input.value = value;

      if (value === '') {
        input.classList.remove('loan-invalid');
        return true;
      }

      var isValid = isLoanNumberFormatValid(value);
      input.classList.toggle('loan-invalid', !isValid);
      return isValid;
    }

    function validateMoneyInput(input) {
      var cents = toCents(input.value);
      var isValid = input.value === '' || cents >= 0;
      input.classList.toggle('amount-invalid', !isValid);
      return isValid;
    }

    function validateRequired(input, required) {
      var valid = !required || String(input.value || '').trim() !== '';
      input.classList.toggle('required-invalid', !valid);
      return valid;
    }

    function getPreviousRowValue(row, inputName) {
      var rows = Array.prototype.slice.call(matrixBody.querySelectorAll('tr'));
      var index = rows.indexOf(row);
      if (index <= 0) return '';
      for (var i = index - 1; i >= 0; i -= 1) {
        if (isRowEmpty(rows[i])) continue;
        var previousInput = rows[i].querySelector('[name="' + inputName + '"]');
        if (previousInput && previousInput.value.trim() !== '') return previousInput.value.trim();
      }
      return '';
    }

    function maybeCopyFromPrevious(event) {
      var input = event.target;
      if (!input || (input.name !== 'borrower' && input.name !== 'remitter')) return false;
      if (input.value.trim() !== '"') return false;
      var row = input.closest('tr');
      var previousValue = getPreviousRowValue(row, input.name);
      if (previousValue) {
        input.value = previousValue;
        return true;
      }
      return false;
    }

    function addRow(defaults) {
      var row = document.createElement('tr');
      var transactionId = generateUUID();
      row.setAttribute('data-transaction-id', transactionId);

      var borrowerCell = document.createElement('td');
      borrowerCell.appendChild(createCellInput('text', 'borrower', placeholders.borrower));
      var hint = document.createElement('div');
      hint.className = 'row-hint';
      hint.textContent = 'Start typing to add another payment.';
      borrowerCell.appendChild(hint);
      row.appendChild(borrowerCell);

      var remitterCell = document.createElement('td');
      remitterCell.appendChild(createCellInput('text', 'remitter', placeholders.remitter));
      row.appendChild(remitterCell);

      var paymentTypeCell = document.createElement('td');
      paymentTypeCell.appendChild(createSelect('paymentType', paymentTypes));
      row.appendChild(paymentTypeCell);

      var amountCell = document.createElement('td');
      amountCell.appendChild(createCellInput('number', 'amountReceived', placeholders.amount));
      row.appendChild(amountCell);

      var dateCell = document.createElement('td');
      var dateInput = createCellInput('date', 'effectiveDate');
      dateInput.value = getTodayDate();
      dateCell.appendChild(dateInput);
      row.appendChild(dateCell);

      var loanCell = document.createElement('td');
      loanCell.className = 'loan-cell';
      var loanContainer = document.createElement('div');
      loanContainer.className = 'loan-allocations';
      createLoanRow(loanContainer, true, generateUUID());
      loanCell.appendChild(loanContainer);
      var balance = document.createElement('div');
      balance.className = 'row-balance remaining';
      balance.textContent = 'Payment balance: $0.00 remaining';
      loanCell.appendChild(balance);
      row.appendChild(loanCell);

      var actionCell = document.createElement('td');
      actionCell.className = 'action-cell';

      var removeBtn = document.createElement('button');
      removeBtn.type = 'button';
      removeBtn.className = 'action-btn action-btn-remove';
      removeBtn.title = 'Remove payment row';
      removeBtn.tabIndex = -1;
      removeBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"></path><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>';
      removeBtn.addEventListener('click', function() {
        var rows = matrixBody.querySelectorAll('tr');
        if (rows.length <= 1 || isRowEmpty(row)) return;
        var ok = window.confirm('Remove this payment row and its loan applications?');
        if (!ok) return;
        row.remove();
        ensureEmptyRow();
        renumberRows();
        updateTotals();
        sendDataToJotForm();
        notifyHeightSoon();
      });
      actionCell.appendChild(removeBtn);

      row.appendChild(actionCell);
      matrixBody.appendChild(row);

      if (defaults) {
        Object.keys(defaults).forEach(function(key) {
          var el = row.querySelector('[name="' + key + '"]');
          if (el) el.value = defaults[key];
        });
      }

      updateRowState(row);
      renumberRows();
      updateTotals();
      notifyHeightSoon();
      return row;
    }

    function updateRowState(row) {
      var inputs = row.querySelectorAll('input, select');
      var hasContent = Array.prototype.some.call(inputs, function(input) {
        if (input.name === 'effectiveDate') return false;
        if (input.tagName === 'SELECT') return false;
        return input.value && input.value.trim() !== '' && input.value !== '0.00';
      });
      row.classList.toggle('is-empty', !hasContent);
    }

    function isRowEmpty(row) {
      var inputs = row.querySelectorAll('input, select');
      return !Array.prototype.some.call(inputs, function(input) {
        if (input.name === 'effectiveDate') return false;
        if (input.tagName === 'SELECT') return false;
        return input.value && input.value.trim() !== '' && input.value !== '0.00';
      });
    }

    function isLastRow(row) {
      var rows = matrixBody.querySelectorAll('tr');
      return rows.length && rows[rows.length - 1] === row;
    }

    function ensureEmptyRow() {
      var rows = matrixBody.querySelectorAll('tr');
      if (rows.length === 0) {
        addRow();
        return;
      }
      var lastRow = rows[rows.length - 1];
      if (!isRowEmpty(lastRow)) addRow();
    }

    function renumberRows() {
      // Payment and loan application labels were removed to keep production input alignment stable.
    }

    function handleInputChange(event) {
      if (!event || !event.target) return;
      maybeCopyFromPrevious(event);
      var row = event.target.closest('tr');
      if (event.target.type === 'number') validateMoneyInput(event.target);
      if (row) {
        updateRowState(row);
        if (!isRowEmpty(row) && isLastRow(row)) addRow();
      }
      renumberRows();
      updateTotals();
      scheduleSendData();
      notifyHeightSoon();
    }

    function getTransactionAllocationCents(row) {
      var total = 0;
      row.querySelectorAll('[name="loanAmount"]').forEach(function(input) {
        total += toCents(input.value);
      });
      return total;
    }

    function getLoanRowsWithContent(row) {
      return Array.prototype.filter.call(row.querySelectorAll('.loan-row'), function(loanRow) {
        var loanNumber = normalizeLoanNumberValue(loanRow.querySelector('[name="loanNumber"]').value);
        var loanAmount = loanRow.querySelector('[name="loanAmount"]').value;
        var comments = loanRow.querySelector('[name="loanComments"]').value.trim();
        // Treat a default/blank 0.00 amount as empty so the muted trailing row does not create issues.
        return loanNumber || comments || toCents(loanAmount) > 0;
      });
    }

    function addIssue(issues, message) {
      issues.push(message);
    }

    function updateValidationSummary(issues, readyToSubmit) {
      validationSummary.classList.toggle('ready', readyToSubmit);
      validationSummary.classList.toggle('not-ready', !readyToSubmit);
      readyField.classList.toggle('not-ready', !readyToSubmit);
      readyStatusEl.textContent = readyToSubmit ? 'Yes' : 'No';

      if (readyToSubmit) {
        validationSummary.firstChild.nodeValue = 'Ready to submit: Yes';
        validationList.innerHTML = '<li>All amount and field checks passed.</li>';
        readyField.setAttribute('title', 'All amount and field checks passed.');
        errorField.setAttribute('title', 'No validation issues.');
      } else {
        validationSummary.firstChild.nodeValue = 'Ready to submit: No';
        var issueText = issues.length ? issues.slice(0, 5).join(' | ') : 'Form is not ready.';
        readyField.setAttribute('title', issueText);
        errorField.setAttribute('title', issueText);
        validationList.innerHTML = '';
        issues.slice(0, 8).forEach(function(issue) {
          var li = document.createElement('li');
          li.textContent = issue;
          validationList.appendChild(li);
        });
        if (issues.length > 8) {
          var more = document.createElement('li');
          more.textContent = 'Additional issues not shown: ' + (issues.length - 8);
          validationList.appendChild(more);
        }
      }
    }

    function normalizePaymentType(value) {
      return String(value || '').trim().toLowerCase().replace(/[\s_-]+/g, ' ');
    }

    function updateTotals() {
      var rows = matrixBody.querySelectorAll('tr');
      var receivedCents = 0;
      var allocatedCents = 0;
      var checkCents = 0;
      var cashCents = 0;
      var moneyOrderCents = 0;
      var issues = [];
      var transactionCount = 0;
      var loanAppliedCount = 0;

      rows.forEach(function(row) {
        if (isRowEmpty(row)) return;
        transactionCount += 1;
        var paymentLabel = 'Payment ' + transactionCount;

        var borrowerInput = row.querySelector('[name="borrower"]');
        var amountInput = row.querySelector('[name="amountReceived"]');
        var effectiveDateInput = row.querySelector('[name="effectiveDate"]');
        var rowReceivedCents = toCents(amountInput.value);
        var paymentTypeKey = normalizePaymentType(row.querySelector('[name="paymentType"]').value);
        if (paymentTypeKey === 'check') checkCents += rowReceivedCents;
        else if (paymentTypeKey === 'cash') cashCents += rowReceivedCents;
        else if (paymentTypeKey === 'money order' || paymentTypeKey === 'money orders') moneyOrderCents += rowReceivedCents;
        var rowAllocatedCents = getTransactionAllocationCents(row);
        var rowDifferenceCents = rowReceivedCents - rowAllocatedCents;
        var balanceEl = row.querySelector('.row-balance');
        var loanRows = getLoanRowsWithContent(row);

        receivedCents += rowReceivedCents;
        allocatedCents += rowAllocatedCents;

        if (!validateRequired(borrowerInput, true)) addIssue(issues, paymentLabel + ': Borrower Name is required.');
        if (!validateRequired(amountInput, true) || rowReceivedCents <= 0) addIssue(issues, paymentLabel + ': Amount Received must be greater than zero.');
        if (!validateRequired(effectiveDateInput, true)) addIssue(issues, paymentLabel + ': Effective Date is required.');
        if (loanRows.length === 0) addIssue(issues, paymentLabel + ': At least one loan application is required.');

        loanRows.forEach(function(loanRow, loanIndex) {
          var loanLabel = paymentLabel + ', Loan ' + (loanIndex + 1);
          var loanNumberInput = loanRow.querySelector('[name="loanNumber"]');
          var loanAmountInput = loanRow.querySelector('[name="loanAmount"]');
          var loanAmountCents = toCents(loanAmountInput.value);
          loanAppliedCount += 1;

          if (!validateRequired(loanNumberInput, true)) {
            addIssue(issues, loanLabel + ': Loan Number is required.');
          } else if (!validateLoanNumber(loanNumberInput)) {
            addIssue(issues, loanLabel + ': Loan Number format is invalid.');
          }
          if (!validateRequired(loanAmountInput, true) || loanAmountCents <= 0) {
            addIssue(issues, loanLabel + ': Amount Applied must be greater than zero.');
          }
        });

        if (balanceEl) {
          balanceEl.classList.remove('balanced', 'remaining', 'over');
          if (rowDifferenceCents === 0) {
            balanceEl.classList.add('balanced');
            balanceEl.textContent = 'Payment balance: $0.00 OK';
          } else if (rowDifferenceCents < 0) {
            balanceEl.classList.add('over');
            balanceEl.textContent = 'Payment balance: ' + formatCurrency(centsToNumber(Math.abs(rowDifferenceCents))) + ' over';
            addIssue(issues, paymentLabel + ': Loan applications exceed payment by ' + formatCurrency(centsToNumber(Math.abs(rowDifferenceCents))) + '.');
          } else {
            balanceEl.classList.add('remaining');
            balanceEl.textContent = 'Payment balance: ' + formatCurrency(centsToNumber(rowDifferenceCents)) + ' remaining';
            addIssue(issues, paymentLabel + ': Payment has ' + formatCurrency(centsToNumber(rowDifferenceCents)) + ' remaining.');
          }
        }
      });

      var differenceCents = receivedCents - allocatedCents;
      var amountBalanced = differenceCents === 0 && transactionCount > 0 && loanAppliedCount > 0;
      var validationPassed = issues.length === 0;
      var readyToSubmit = amountBalanced && validationPassed;

      if (transactionCount === 0) addIssue(issues, 'Enter at least one payment row.');
      if (transactionCount > 0 && loanAppliedCount === 0) addIssue(issues, 'Enter at least one loan application.');
      issues = Array.from(new Set(issues));
      validationPassed = issues.length === 0;
      readyToSubmit = amountBalanced && validationPassed;

      totalReceivedEl.textContent = formatCurrency(centsToNumber(receivedCents));
      totalChecksEl.textContent = formatCurrency(centsToNumber(checkCents));
      totalCashEl.textContent = formatCurrency(centsToNumber(cashCents));
      totalMoneyOrdersEl.textContent = formatCurrency(centsToNumber(moneyOrderCents));
      totalAllocatedEl.textContent = formatCurrency(centsToNumber(allocatedCents));

      differenceField.classList.remove('balanced', 'over');
      if (differenceCents === 0) {
        differenceField.classList.add('balanced');
        totalDifferenceEl.textContent = '$0.00 OK';
      } else if (differenceCents < 0) {
        differenceField.classList.add('over');
        totalDifferenceEl.textContent = formatCurrency(centsToNumber(Math.abs(differenceCents))) + ' over';
      } else {
        totalDifferenceEl.textContent = formatCurrency(centsToNumber(differenceCents)) + ' remaining';
      }

      errorCountEl.textContent = String(issues.length);
      errorField.classList.toggle('hidden', issues.length === 0);
      updateValidationSummary(issues, readyToSubmit);

      return {
        totalReceived: centsToNumber(receivedCents),
        totalChecks: centsToNumber(checkCents),
        totalCash: centsToNumber(cashCents),
        totalMoneyOrders: centsToNumber(moneyOrderCents),
        totalApplied: centsToNumber(allocatedCents),
        difference: centsToNumber(differenceCents),
        amountBalanced: amountBalanced ? 'Yes' : 'No',
        validationPassed: validationPassed ? 'Yes' : 'No',
        readyToSubmit: readyToSubmit ? 'Yes' : 'No',
        issueCount: issues.length,
        issues: issues,
        transactionCount: transactionCount,
        loanAppliedCount: loanAppliedCount
      };
    }


    function uniqueSortedCsv(values) {
      var seen = Object.create(null);
      var result = [];
      values.forEach(function(value) {
        var clean = String(value || '').trim();
        if (!clean) return;
        var key = clean.toLowerCase();
        if (seen[key]) return;
        seen[key] = true;
        result.push(clean);
      });
      result.sort(function(a, b) { return a.localeCompare(b); });
      return result.join(', ');
    }

    function getFieldSyncMap(data) {
      var summary = [
        { key: 'totalReceived', value: numberToFixedString(data.TotalReceived) },
        { key: 'totalApplied', value: numberToFixedString(data.TotalApplied) },

        { key: 'amountBalanced', value: data.AmountBalanced },

      ];

        { qid: '25', name: 'totalReceived', value: summary[0].value, readonly: false },
        { qid: '26', name: 'totalApplied', value: summary[1].value, readonly: false },

        { qid: '32', name: 'paymentCount', value: summary[7].value, readonly: false },
        { qid: '33', name: 'loanApplied', value: summary[8].value, readonly: false },
        { qid: '34', name: 'uniqueBorrowers', value: summary[9].value, readonly: false },
        { qid: '35', name: 'uniqueLoan', value: summary[10].value, readonly: false },

        // Visible confirmation page fields. These mirror the hidden fields so users can confirm
        // that summary values are actually being passed into ordinary Jotform inputs.
        { qid: '37', name: 'confirmTotal', value: summary[0].value, readonly: true },
        { qid: '38', name: 'confirmTotal38', value: summary[1].value, readonly: true },

        { qid: '46', name: 'confirmUnique', value: summary[9].value, readonly: true },
        { qid: '47', name: 'confirmUnique47', value: summary[10].value, readonly: true }
      ];
    }

    function numberToFixedString(value) {
      var n = Number(value);
      if (!isFinite(n)) return '0.00';
      return n.toFixed(2);
    }

    function setNativeInputValue(input, value, makeReadonly) {
      if (!input) return false;
      var nextValue = value == null ? '' : String(value);
      if (makeReadonly) {
        try { input.readOnly = true; } catch (e) {}
        try { input.setAttribute('readonly', 'readonly'); } catch (e) {}
        try { input.setAttribute('aria-readonly', 'true'); } catch (e) {}
      }

      // Use the native setter where available. This is more reliable with modern form runtimes
      // that watch property changes rather than raw attributes.
      try {
        var proto = input.tagName === 'TEXTAREA' ? window.HTMLTextAreaElement.prototype : window.HTMLInputElement.prototype;
        var descriptor = Object.getOwnPropertyDescriptor(proto, 'value');
        if (descriptor && descriptor.set) {
          descriptor.set.call(input, nextValue);
        } else {
          input.value = nextValue;
        }
      } catch (e) {
        input.value = nextValue;
      }

      try { input.setAttribute('value', nextValue); } catch (e) {}
      try { input.dispatchEvent(new Event('input', { bubbles: true })); } catch (e) {}
      try { input.dispatchEvent(new Event('change', { bubbles: true })); } catch (e) {}
      try { input.dispatchEvent(new Event('blur', { bubbles: true })); } catch (e) {}
      return input.value === nextValue || input.getAttribute('value') === nextValue;
    }

    function findParentJotformInput(doc, field) {
      if (!doc) return null;
      var selectors = [
        '#input_' + field.qid,
        '#cid_' + field.qid + ' input',
        '#id_' + field.qid + ' input',
        '[name="q' + field.qid + '_' + field.name + '"]',
        '[name="' + field.name + '"]',
        '[data-component="textbox"][id="input_' + field.qid + '"]'
      ];
      for (var i = 0; i < selectors.length; i++) {
        try {
          var found = doc.querySelector(selectors[i]);
          if (found) return found;
        } catch (e) {}
      }
      return null;
    }

    function syncHiddenSummaryFields(data) {
      var fields = getFieldSyncMap(data);
      var result = {
        attempted: fields.length,
        found: 0,
        set: 0,
        parentAccessible: false,
        missing: []
      };

      // Primary strategy: direct parent DOM update. If the widget iframe is sandboxed or
      // cross-origin, this will be blocked; the function returns that status instead of failing.
      try {
        var doc = window.parent && window.parent.document;
        if (doc) {
          result.parentAccessible = true;
          fields.forEach(function(field) {
            var input = findParentJotformInput(doc, field);
            if (input) {
              result.found += 1;
              if (setNativeInputValue(input, field.value, field.readonly)) result.set += 1;
            } else {
              result.missing.push(field.name + ' (#' + field.qid + ')');
            }
          });
        }
      } catch (e) {
        result.parentAccessible = false;
      }

      // Secondary strategy: postMessage. This only works if the parent page has a listener
      // that honors these messages. Native Jotform pages generally do not expose a documented
      // listener for custom widgets to set sibling fields, so this is best-effort only.
      try {
        fields.forEach(function(field) {
          window.parent.postMessage({
            source: 'cash-transmittal-widget',
            action: 'setFieldValue',
            qid: field.qid,
            name: field.name,
            value: field.value
          }, '*');
        });
      } catch (e) {}

      return result;
    }

    function setSyncStatus(message, statusClass) {
      return;
    }

    function confirmAndSyncSummary() {
      var data = collectData();
      var syncResult = syncHiddenSummaryFields(data);
      sendDataToJotForm();
      requestWidgetResize(true);

      if (!data.ReadyToSubmit || data.ReadyToSubmit !== 'Yes') {
        setSyncStatus('Not ready - review issues.', 'bad');
        validationSummary.classList.add('is-visible');
        return;
      }

      if (!syncResult.parentAccessible) {
        setSyncStatus('Widget payload ready. Jotform field sync is blocked.', 'warn');
        return;
      }

      if (syncResult.set > 0) {
        setSyncStatus('Synced ' + syncResult.set + ' field(s). Continue to confirmation.', 'ok');
      } else {
        setSyncStatus('No Jotform fields were reachable. Payload is ready only.', 'warn');
      }
    }

    function collectData() {
      var now = new Date().toISOString();
      var flatRows = [];
      var transactionRows = [];
      var borrowerValues = [];
      var loanNumberValues = [];
      var totals = updateTotals();
      var populatedRows = Array.prototype.filter.call(matrixBody.querySelectorAll('tr'), function(row) {
        return !isRowEmpty(row);
      });

      populatedRows.forEach(function(row, txIndex) {
        var transactionId = row.getAttribute('data-transaction-id');
        var borrowerName = row.querySelector('[name="borrower"]').value.trim();
        if (borrowerName) borrowerValues.push(borrowerName);
        var remitterName = row.querySelector('[name="remitter"]').value.trim();
        var paymentType = row.querySelector('[name="paymentType"]').value;
        var amountReceived = centsToNumber(toCents(row.querySelector('[name="amountReceived"]').value));
        var effectiveDate = row.querySelector('[name="effectiveDate"]').value;
        var effectiveToday = isToday(effectiveDate);
        var transactionAppliedTotal = centsToNumber(getTransactionAllocationCents(row));
        var transactionDifference = centsToNumber(toCents(amountReceived) - toCents(transactionAppliedTotal));
        var loanRows = getLoanRowsWithContent(row);

        transactionRows.push({
          SchemaVersion: '3.2-flat',
          Transmittal_ID: transmittalId,
          Transaction_ID: transactionId,
          Transaction_RowIndex: txIndex + 1,
          BorrowerName: borrowerName,
          RemitterName: remitterName,
          PaymentType: paymentType,
          AmountReceived: amountReceived,
          PaymentTypeTotalCategory: normalizePaymentType(paymentType),
          EffectiveDate: effectiveDate,
          EffectiveToday: effectiveToday ? 'Yes' : 'No',
          TransactionAppliedTotal: transactionAppliedTotal,
          TransactionDifference: transactionDifference,
          TransactionAmountBalanced: transactionDifference === 0 ? 'Yes' : 'No',
          LoanAppliedCountForTransaction: loanRows.length
        });

        if (loanRows.length === 0) {
          flatRows.push(makeFlatRow({
            now: now,
            txIndex: txIndex,
            loanIndex: 0,
            transactionId: transactionId,
            borrowerName: borrowerName,
            remitterName: remitterName,
            paymentType: paymentType,
            amountReceived: amountReceived,
            effectiveDate: effectiveDate,
            effectiveToday: effectiveToday,
            transactionAppliedTotal: transactionAppliedTotal,
            transactionDifference: transactionDifference,
            loanAppliedId: '',
            loanNumber: '',
            amountApplied: 0,
            loanComments: '',
            loanNumberValid: 'NoLoanEntered',
            totals: totals
          }));
          return;
        }

        loanRows.forEach(function(loanRow, loanIndex) {
          var loanNumberInput = loanRow.querySelector('[name="loanNumber"]');
          var loanNumber = normalizeLoanNumberValue(loanNumberInput.value.trim());
          loanNumberInput.value = loanNumber;
          if (loanNumber) loanNumberValues.push(loanNumber);
          var amountApplied = centsToNumber(toCents(loanRow.querySelector('[name="loanAmount"]').value));
          var loanComments = loanRow.querySelector('[name="loanComments"]').value.trim();
          var loanNumberValid = loanNumber === '' ? 'Blank' : (validateLoanNumber(loanNumberInput) ? 'ValidFormat' : 'InvalidFormat');

          flatRows.push(makeFlatRow({
            now: now,
            txIndex: txIndex,
            loanIndex: loanIndex,
            transactionId: transactionId,
            borrowerName: borrowerName,
            remitterName: remitterName,
            paymentType: paymentType,
            amountReceived: amountReceived,
            effectiveDate: effectiveDate,
            effectiveToday: effectiveToday,
            transactionAppliedTotal: transactionAppliedTotal,
            transactionDifference: transactionDifference,
            loanAppliedId: loanRow.getAttribute('data-loan-applied-id'),
            loanNumber: loanNumber,
            amountApplied: amountApplied,
            loanComments: loanComments,
            loanNumberValid: loanNumberValid,
            totals: totals
          }));
        });
      });

      return {
        SchemaVersion: '3.2-flat',
        Transmittal_ID: transmittalId,
        SubmittedAt: now,
        TotalReceived: totals.totalReceived,
        TotalChecks: totals.totalChecks,
        TotalCash: totals.totalCash,
        TotalMoneyOrders: totals.totalMoneyOrders,
        TotalApplied: totals.totalApplied,
        Difference: totals.difference,
        AmountBalanced: totals.amountBalanced,
        ValidationPassed: totals.validationPassed,
        ReadyToSubmit: totals.readyToSubmit,
        IssueCount: totals.issueCount,
        Issues: totals.issues,
        TransactionCount: transactionRows.length,
        PaymentCount: transactionRows.length,
        LoanAppliedCount: flatRows.filter(function(r) { return r.LoanApplied_ID; }).length,
        UniqueBorrowersCSV: uniqueSortedCsv(borrowerValues),
        UniqueLoanNumbersCSV: uniqueSortedCsv(loanNumberValues),
        Rows: flatRows,
        Transactions: transactionRows
      };
    }

    function makeFlatRow(args) {
      return {
        SchemaVersion: '3.2-flat',
        Transmittal_ID: transmittalId,
        SubmittedAt: args.now,
        Transmittal_TotalReceived: args.totals.totalReceived,
        Transmittal_TotalChecks: args.totals.totalChecks,
        Transmittal_TotalCash: args.totals.totalCash,
        Transmittal_TotalMoneyOrders: args.totals.totalMoneyOrders,
        Transmittal_TotalApplied: args.totals.totalApplied,
        Transmittal_Difference: args.totals.difference,
        Transmittal_AmountBalanced: args.totals.amountBalanced,
        Transmittal_ValidationPassed: args.totals.validationPassed,
        Transmittal_ReadyToSubmit: args.totals.readyToSubmit,
        Transaction_ID: args.transactionId,
        Transaction_RowIndex: args.txIndex + 1,
        BorrowerName: args.borrowerName,
        RemitterName: args.remitterName,
        PaymentType: args.paymentType,
        AmountReceived: args.amountReceived,
        TransactionAppliedTotal: args.transactionAppliedTotal,
        TransactionDifference: args.transactionDifference,
        TransactionAmountBalanced: args.transactionDifference === 0 ? 'Yes' : 'No',
        EffectiveDate: args.effectiveDate,
        EffectiveToday: args.effectiveToday ? 'Yes' : 'No',
        LoanApplied_ID: args.loanAppliedId,
        Loan_RowIndex: args.loanIndex + 1,
        LoanNumber: args.loanNumber,
        AmountApplied: args.amountApplied,
        LoanComments: args.loanComments,
        LoanNumberValidation: args.loanNumberValid
      };
    }

    function generateTextSummary(data) {
      var lines = [];
      lines.push('=== CASH TRANSMITTAL ===');
      lines.push('Schema Version: ' + data.SchemaVersion);
      lines.push('Transmittal ID: ' + data.Transmittal_ID);
      lines.push('Submitted: ' + data.SubmittedAt);
      lines.push('Total Received: ' + formatCurrency(data.TotalReceived));
      lines.push('Total Checks: ' + formatCurrency(data.TotalChecks));
      lines.push('Total Cash: ' + formatCurrency(data.TotalCash));
      lines.push('Total Money Orders: ' + formatCurrency(data.TotalMoneyOrders));
      lines.push('Total Applied: ' + formatCurrency(data.TotalApplied));
      lines.push('Difference: ' + formatCurrency(data.Difference));
      lines.push('Amount Balanced: ' + data.AmountBalanced);
      lines.push('Validation Passed: ' + data.ValidationPassed);
      lines.push('Ready To Submit: ' + data.ReadyToSubmit);
      lines.push('Issues: ' + data.IssueCount);
      if (data.Issues && data.Issues.length) {
        data.Issues.forEach(function(issue) { lines.push(' - ' + issue); });
      }
      lines.push('Transactions: ' + data.TransactionCount);
      lines.push('Loan Applications: ' + data.LoanAppliedCount);
      lines.push('Unique Borrowers CSV: ' + data.UniqueBorrowersCSV);
      lines.push('Unique Loan Numbers CSV: ' + data.UniqueLoanNumbersCSV);
      lines.push('');

      data.Transactions.forEach(function(t) {
        lines.push('--- Transaction ' + t.Transaction_RowIndex + ' ---');
        lines.push('Transaction ID: ' + t.Transaction_ID);
        lines.push('Borrower: ' + t.BorrowerName);
        if (t.RemitterName) lines.push('Remitter: ' + t.RemitterName);
        lines.push('Payment Type: ' + t.PaymentType);
        lines.push('Amount Received: ' + formatCurrency(t.AmountReceived));
        lines.push('Applied to Loans: ' + formatCurrency(t.TransactionAppliedTotal));
        lines.push('Transaction Difference: ' + formatCurrency(t.TransactionDifference));
        lines.push('Effective Date: ' + t.EffectiveDate + ' (' + (t.EffectiveToday === 'Yes' ? 'Today' : 'Backdated') + ')');

        var relatedRows = data.Rows.filter(function(r) {
          return r.Transaction_ID === t.Transaction_ID && r.LoanApplied_ID;
        });

        if (relatedRows.length > 0) {
          lines.push('Loan Applications:');
          relatedRows.forEach(function(r) {
            var loanLine = '  - Loan ' + r.LoanNumber + ': ' + formatCurrency(r.AmountApplied);
            if (r.LoanComments) loanLine += ' (' + r.LoanComments + ')';
            lines.push(loanLine);
          });
        } else {
          lines.push('Loan Applications: none entered');
        }
        lines.push('');
      });

      return lines.join('\n');
    }

    function getSubmitValue() {
      var data = collectData();
      return {
        value: JSON.stringify({
          schemaVersion: data.SchemaVersion,
          flatPayload: data,
          rows: data.Rows,
          transactions: data.Transactions,
          totalReceived: data.TotalReceived,
          totalChecks: data.TotalChecks,
          totalCash: data.TotalCash,
          totalMoneyOrders: data.TotalMoneyOrders,
          totalApplied: data.TotalApplied,
          difference: data.Difference,
          amountBalanced: data.AmountBalanced,
          validationPassed: data.ValidationPassed,
          readyToSubmit: data.ReadyToSubmit,
          issueCount: data.IssueCount,
          paymentCount: data.PaymentCount,
          loanAppliedCount: data.LoanAppliedCount,
          uniqueBorrowersCSV: data.UniqueBorrowersCSV,
          uniqueLoanNumbersCSV: data.UniqueLoanNumbersCSV,
          issues: data.Issues,
          text: generateTextSummary(data)
        })
      };
    }

    function scheduleSendData() {
      if (sendTimer) clearTimeout(sendTimer);
      sendTimer = setTimeout(sendDataToJotForm, 250);
    }

    function sendDataToJotForm() {
      var data = collectData();
      syncHiddenSummaryFields(data);
      if (typeof JFCustomWidget === 'undefined') return;
      JFCustomWidget.sendData({
        value: JSON.stringify({
          schemaVersion: data.SchemaVersion,
          flatPayload: data,
          rows: data.Rows,
          transactions: data.Transactions,
          totalReceived: data.TotalReceived,
          totalChecks: data.TotalChecks,
          totalCash: data.TotalCash,
          totalMoneyOrders: data.TotalMoneyOrders,
          totalApplied: data.TotalApplied,
          difference: data.Difference,
          amountBalanced: data.AmountBalanced,
          validationPassed: data.ValidationPassed,
          readyToSubmit: data.ReadyToSubmit,
          issueCount: data.IssueCount,
          paymentCount: data.PaymentCount,
          loanAppliedCount: data.LoanAppliedCount,
          uniqueBorrowersCSV: data.UniqueBorrowersCSV,
          uniqueLoanNumbersCSV: data.UniqueLoanNumbersCSV,
          issues: data.Issues,
          text: generateTextSummary(data)
        })
      });
    }

    var lastRequestedHeight = 0;
    var lastResizeRequestAt = 0;

    function getWidgetHeight() {
      var main = document.getElementById('main');
      if (!main) return 540;

      // Important: measure the widget content only. Do not use body/html scrollHeight,
      // because after Jotform resizes the iframe those values can reflect the iframe height
      // itself, which creates a self-amplifying resize loop.
      var rect = main.getBoundingClientRect();
      var contentHeight = Math.max(main.scrollHeight, rect.height);
      return Math.ceil(contentHeight + 28);
    }

    function requestWidgetResize(force) {
      if (typeof JFCustomWidget === 'undefined') return;
      var height = getWidgetHeight();
      var now = Date.now();

      if (!force) {
        if (Math.abs(height - lastRequestedHeight) < 8) return;
        if (now - lastResizeRequestAt < 150) return;
      }

      lastRequestedHeight = height;
      lastResizeRequestAt = now;

      // Do not set body/html min-height here. That was the source of the production growth loop.
      try { JFCustomWidget.requestFrameResize({ height: height }); } catch (e) {}
      try { JFCustomWidget.requestFrameResize(height); } catch (e) {}
    }

    function notifyHeightSoon() {
      if (resizeTimer) clearTimeout(resizeTimer);
      resizeTimer = setTimeout(function() {
        requestWidgetResize(false);
      }, 75);
    }

    function initializeWidget() {
      if (initialized) return;
      initialized = true;
      addRow();
      addRow();
      installResizeObservers();
      renumberRows();
      updateTotals();
      requestWidgetResize(true);
      sendDataToJotForm();
    }

    function installResizeObservers() {
      // Resize is intentionally event-driven. ResizeObserver/MutationObserver caused a loop
      // in production because iframe resizing changed the measured body height, which triggered
      // another resize request. Add/remove/input events call notifyHeightSoon directly.
      if (window.__cashTransmittalResizeListenerInstalled) return;
      window.__cashTransmittalResizeListenerInstalled = true;
      window.addEventListener('resize', function() {
        notifyHeightSoon();
      });
    }

    function applyWidgetSettings() {
      if (typeof JFCustomWidget === 'undefined') return;

      var customHeaders = JFCustomWidget.getWidgetSetting('columnHeaders');
      if (customHeaders) {
        var headerArray = customHeaders.split(',');
        if (headerArray.length >= 6) {
          columnHeaders.borrower = headerArray[0].trim();
          columnHeaders.remitter = headerArray[1].trim();
          columnHeaders.paymentType = headerArray[2].trim();
          columnHeaders.amount = headerArray[3].trim();
          columnHeaders.effectiveDate = headerArray[4].trim();
          columnHeaders.loanApplied = headerArray[5].trim();
        }
      }

      var customPaymentTypes = JFCustomWidget.getWidgetSetting('paymentTypes');
      if (customPaymentTypes) {
        paymentTypes = customPaymentTypes.split(',').map(function(s) { return s.trim(); }).filter(Boolean);
      }

      var customPlaceholders = JFCustomWidget.getWidgetSetting('placeholders');
      if (customPlaceholders) {
        try {
          var parsed = JSON.parse(customPlaceholders);
          placeholders = Object.assign({}, defaultPlaceholders, parsed);
        } catch (e) {}
      }

      document.getElementById('col-borrower').textContent = columnHeaders.borrower;
      document.getElementById('col-remitter').textContent = columnHeaders.remitter;
      document.getElementById('col-paymentType').textContent = columnHeaders.paymentType;
      document.getElementById('col-amount').textContent = columnHeaders.amount;
      document.getElementById('col-effectiveDate').textContent = columnHeaders.effectiveDate;
      document.getElementById('col-loanApplied').textContent = columnHeaders.loanApplied;
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', function() {
        setTimeout(initializeWidget, 100);
      });
    } else {
      setTimeout(initializeWidget, 100);
    }

    if (typeof JFCustomWidget !== 'undefined') {
      JFCustomWidget.subscribe('ready', function() {
        applyWidgetSettings();
        initializeWidget();

        JFCustomWidget.subscribe('submit', function() {
          var data = collectData();
          var submitValue = getSubmitValue().value;

          // Hard stop: do not allow the Jotform submission to proceed unless
          // the matrix/widget JSON has no balancing or validation errors.
          var canSubmit = data.AmountBalanced === 'Yes' &&
            data.ValidationPassed === 'Yes' &&
            data.ReadyToSubmit === 'Yes' &&
            Number(data.IssueCount || 0) === 0;

          if (!canSubmit) {
            validationSummary.classList.add('is-visible');
            requestWidgetResize(true);
            JFCustomWidget.sendSubmit({
              valid: false,
              value: submitValue
            });
            return;
          }

          JFCustomWidget.sendSubmit({
            valid: true,
            value: submitValue
          });
        });
      });
    }
  </script>
</body>
