<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Dynamic Matrix Widget</title>
  <script src="//js.jotform.com/JotFormCustomWidget.min.js"></script>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      margin: 0;
      padding: 12px;
      color: #1a1a1a;
    }

    #main {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-width: 1200px;
    }

    .table-wrapper {
      overflow-x: auto;
    }

    .matrix-table {
      width: 100%;
      border-collapse: collapse;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.08);
    }

    .matrix-table th,
    .matrix-table td {
      border: 1px solid #dcdcdc;
      padding: 5px;
      vertical-align: middle;
    }

    .matrix-table th {
      background: #4a5568;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.02em;
      color: #ffffff;
      white-space: nowrap;
    }

    .matrix-table tbody tr:nth-child(odd) {
      background-color: #ffffff;
    }

    .matrix-table tbody tr:nth-child(even) {
      background-color: #f1f5f9;
    }

    .matrix-table input,
    .matrix-table select {
      width: 100%;
      box-sizing: border-box;
      padding: 6px 8px;
      font-size: 13px;
      border-radius: 4px;
      border: 1px solid #d7deea;
      background: #fff;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
      autocomplete: off;
    }

    .matrix-table input:focus,
    .matrix-table select:focus {
      outline: none;
      border-color: #2d6cdf;
      box-shadow: 0 0 0 2px rgba(45, 108, 223, 0.15);
    }

    .matrix-table input.invalid-loan {
      background-color: #fff3e0;
      border-color: #ff9800;
    }

    .matrix-table input.required-missing {
      background-color: #ffebee;
      border-color: #f44336;
    }

    .totals {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      font-weight: bold;
      flex-wrap: wrap;
    }

    .totals .total-field {
      background: #9acd32;
      color: #0d2a00;
      padding: 6px 12px;
      border-radius: 4px;
      min-width: 120px;
      text-align: right;
      font-size: 13px;
    }

    .actions-cell {
      white-space: nowrap;
      text-align: center;
    }

    .action-btn {
      border: none;
      border-radius: 4px;
      padding: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      margin: 2px 3px;
      transition: opacity 0.15s ease;
    }

    .action-btn:hover {
      opacity: 0.8;
    }

    .action-btn svg {
      width: 14px;
      height: 14px;
    }

    .action-btn.copy-all {
      background: #2d6cdf;
      color: #fff;
    }

    .action-btn.copy-borrower {
      background: #17a2b8;
      color: #fff;
    }

    .action-btn.remove {
      background: #e55353;
      color: #fff;
    }

    .debug-output {
      background: #f5f5f5;
      border: 1px solid #ddd;
      padding: 10px;
      margin-top: 10px;
      font-family: monospace;
      font-size: 11px;
      max-height: 150px;
      overflow-y: auto;
      display: none;
    }

    .debug-output.visible {
      display: block;
    }
  </style>
</head>
<body>
  <div id="main">
    <div class="table-wrapper">
      <table class="matrix-table" aria-label="Payment matrix">
        <thead>
          <tr id="headerRow">
            <th>Borrower Name</th>
            <th>Remitter Name</th>
            <th>Cash or Check</th>
            <th>Check/Cash Amount</th>
            <th>Effective Date</th>
            <th>Loan Number</th>
            <th>Amount</th>
            <th>Remarks</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="matrixBody"></tbody>
      </table>
    </div>
    <div class="totals">
      <div class="total-field">Total Check/Cash: <span id="totalCheckCash">$0.00</span></div>
      <div class="total-field">Total Amount: <span id="totalAmount">$0.00</span></div>
    </div>
    <div id="debugOutput" class="debug-output"></div>
  </div>

  <script type="text/javascript">
    var matrixBody = document.getElementById('matrixBody');
    var totalCheckCashEl = document.getElementById('totalCheckCash');
    var totalAmountEl = document.getElementById('totalAmount');
    var debugOutput = document.getElementById('debugOutput');
    var initialized = false;
    var paymentTypeOptions = ['Cash', 'Check', 'Money Order'];
    var columnHeaders = ['Borrower Name', 'Remitter Name', 'Cash or Check', 'Check/Cash Amount', 'Effective Date', 'Loan Number', 'Amount', 'Remarks', 'Actions'];

    // Enable debug mode by adding ?debug=true to URL
    var debugMode = window.location.search.indexOf('debug=true') > -1;

    function debugLog(message, data) {
      if (!debugMode) return;
      debugOutput.classList.add('visible');
      var timestamp = new Date().toLocaleTimeString();
      var logEntry = document.createElement('div');
      logEntry.textContent = '[' + timestamp + '] ' + message + (data ? ': ' + JSON.stringify(data) : '');
      debugOutput.appendChild(logEntry);
      debugOutput.scrollTop = debugOutput.scrollHeight;
      console.log(message, data);
    }

    function formatCurrency(value) {
      var numberValue = Number(value);
      if (Number.isNaN(numberValue)) {
        return '$0.00';
      }
      return '$' + numberValue.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    }

    function createCellInput(type, name, placeholder) {
      var input = document.createElement('input');
      input.type = type;
      input.name = name;
      input.setAttribute('autocomplete', 'off');
      input.setAttribute('autocorrect', 'off');
      input.setAttribute('autocapitalize', 'off');
      input.setAttribute('spellcheck', 'false');
      input.setAttribute('data-lpignore', 'true');
      input.setAttribute('data-form-type', 'other');
      if (placeholder) {
        input.placeholder = placeholder;
      }
      if (type === 'number') {
        input.step = '0.01';
        input.min = '0';
      }
      input.addEventListener('input', handleInputChange);
      input.addEventListener('blur', handleInputChange);

      if (name === 'loanNumber') {
        input.addEventListener('input', validateLoanNumber);
        input.addEventListener('blur', validateLoanNumber);
        input.setAttribute('maxlength', '7');
        input.setAttribute('pattern', '[0-9]{6,7}');
      }

      return input;
    }

    function validateLoanNumber(event) {
      var input = event.target;
      var value = input.value.trim();

      input.classList.remove('invalid-loan');

      if (value === '') return;

      var isValidFormat = /^\d{6,7}$/.test(value);
      if (!isValidFormat) {
        input.classList.add('invalid-loan');
      }
    }

    function createSelect(name, options) {
      var select = document.createElement('select');
      select.name = name;
      select.setAttribute('autocomplete', 'off');
      options.forEach(function(optionValue) {
        var option = document.createElement('option');
        option.value = optionValue;
        option.textContent = optionValue;
        select.appendChild(option);
      });
      select.addEventListener('change', handleInputChange);
      return select;
    }

    function isRowEmpty(row) {
      var inputs = row.querySelectorAll('input, select');
      for (var i = 0; i < inputs.length; i++) {
        var input = inputs[i];
        if (input.name === 'paymentType') continue;
        if (input.value && input.value.trim() !== '' && input.value !== '0' && input.value !== '0.00') {
          return false;
        }
      }
      return true;
    }

    function isLastRow(row) {
      var rows = matrixBody.querySelectorAll('tr');
      return rows.length && rows[rows.length - 1] === row;
    }

    function addRow(defaults) {
      var row = document.createElement('tr');

      var borrowerCell = document.createElement('td');
      borrowerCell.appendChild(createCellInput('text', 'borrower', 'Borrower Name'));
      row.appendChild(borrowerCell);

      var remitterCell = document.createElement('td');
      remitterCell.appendChild(createCellInput('text', 'remitter', 'Remitter Name'));
      row.appendChild(remitterCell);

      var cashCheckCell = document.createElement('td');
      cashCheckCell.appendChild(createSelect('paymentType', paymentTypeOptions));
      row.appendChild(cashCheckCell);

      var totalCell = document.createElement('td');
      totalCell.appendChild(createCellInput('number', 'checkCashAmount', '0.00'));
      row.appendChild(totalCell);

      var dateCell = document.createElement('td');
      dateCell.appendChild(createCellInput('date', 'effectiveDate'));
      row.appendChild(dateCell);

      var loanCell = document.createElement('td');
      loanCell.appendChild(createCellInput('text', 'loanNumber', '000000'));
      row.appendChild(loanCell);

      var amountCell = document.createElement('td');
      amountCell.appendChild(createCellInput('number', 'amount', '0.00'));
      row.appendChild(amountCell);

      var remarksCell = document.createElement('td');
      remarksCell.appendChild(createCellInput('text', 'remarks', 'Remarks'));
      row.appendChild(remarksCell);

      var actionsCell = document.createElement('td');
      actionsCell.className = 'actions-cell';

      // Copy All button
      var copyAllBtn = document.createElement('button');
      copyAllBtn.type = 'button';
      copyAllBtn.className = 'action-btn copy-all';
      copyAllBtn.setAttribute('aria-label', 'Copy all to new row');
      copyAllBtn.setAttribute('title', 'Copy Borrower + Loan to new row');
      copyAllBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>';
      copyAllBtn.addEventListener('click', function() {
        copyToNewRow(row, true);
      });
      actionsCell.appendChild(copyAllBtn);

      // Copy Borrower button
      var copyBorrowerBtn = document.createElement('button');
      copyBorrowerBtn.type = 'button';
      copyBorrowerBtn.className = 'action-btn copy-borrower';
      copyBorrowerBtn.setAttribute('aria-label', 'Copy borrower to new row');
      copyBorrowerBtn.setAttribute('title', 'Copy Borrower only to new row');
      copyBorrowerBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>';
      copyBorrowerBtn.addEventListener('click', function() {
        copyToNewRow(row, false);
      });
      actionsCell.appendChild(copyBorrowerBtn);

      // Remove button
      var removeBtn = document.createElement('button');
      removeBtn.type = 'button';
      removeBtn.className = 'action-btn remove';
      removeBtn.setAttribute('aria-label', 'Remove row');
      removeBtn.setAttribute('title', 'Remove this row');
      removeBtn.setAttribute('tabindex', '-1');
      removeBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12 19 6.41z"/></svg>';
      removeBtn.addEventListener('click', function() {
        var rows = matrixBody.querySelectorAll('tr');
        if (rows.length > 1) {
          row.remove();
          updateTotals();
          ensureMinimumRows();
          notifyHeight();
        }
      });
      actionsCell.appendChild(removeBtn);

      row.appendChild(actionsCell);
      matrixBody.appendChild(row);

      if (defaults) {
        Object.keys(defaults).forEach(function(key) {
          var element = row.querySelector('[name="' + key + '"]');
          if (element) {
            element.value = defaults[key];
          }
        });
      }

      updateTotals();
      notifyHeight();
      return row;
    }

    function copyToNewRow(sourceRow, includeLoan) {
      var borrowerValue = sourceRow.querySelector('[name="borrower"]').value;
      var remitterValue = sourceRow.querySelector('[name="remitter"]').value;

      var defaults = {
        borrower: borrowerValue,
        remitter: remitterValue
      };

      if (includeLoan) {
        defaults.loanNumber = sourceRow.querySelector('[name="loanNumber"]').value;
      }

      var rows = matrixBody.querySelectorAll('tr');
      var lastRow = rows[rows.length - 1];

      if (isRowEmpty(lastRow)) {
        Object.keys(defaults).forEach(function(key) {
          var element = lastRow.querySelector('[name="' + key + '"]');
          if (element) {
            element.value = defaults[key];
          }
        });
        addRow();
      } else {
        var newRow = addRow(defaults);
        addRow();
      }

      var allRows = matrixBody.querySelectorAll('tr');
      var targetRow = allRows[allRows.length - 2];
      var focusTarget = targetRow.querySelector('[name="checkCashAmount"]');
      if (focusTarget) {
        focusTarget.focus();
        focusTarget.select();
      }
    }

    function ensureMinimumRows() {
      var rows = matrixBody.querySelectorAll('tr');
      if (rows.length === 0) {
        addRow();
        addRow();
      } else if (rows.length === 1) {
        addRow();
      }
    }

    function updateTotals() {
      var rows = matrixBody.querySelectorAll('tr');
      var totalCheckCash = 0;
      var totalAmount = 0;

      rows.forEach(function(row) {
        var checkCashInput = row.querySelector('[name="checkCashAmount"]');
        var amountInput = row.querySelector('[name="amount"]');

        var checkCashValue = parseFloat(checkCashInput.value) || 0;
        var amountValue = parseFloat(amountInput.value) || 0;

        totalCheckCash += checkCashValue;
        totalAmount += amountValue;
      });

      totalCheckCashEl.textContent = formatCurrency(totalCheckCash);
      totalAmountEl.textContent = formatCurrency(totalAmount);
    }

    function handleInputChange(event) {
      updateTotals();

      var targetRow = event.target.closest('tr');
      if (targetRow && isLastRow(targetRow) && !isRowEmpty(targetRow)) {
        addRow();
      }
    }

    function collectRows() {
      var rows = [];
      matrixBody.querySelectorAll('tr').forEach(function(row, index) {
        if (isRowEmpty(row)) return;

        rows.push({
          rowNumber: index + 1,
          borrower: row.querySelector('[name="borrower"]').value || '',
          remitter: row.querySelector('[name="remitter"]').value || '',
          paymentType: row.querySelector('[name="paymentType"]').value || '',
          checkCashAmount: row.querySelector('[name="checkCashAmount"]').value || '0',
          effectiveDate: row.querySelector('[name="effectiveDate"]').value || '',
          loanNumber: row.querySelector('[name="loanNumber"]').value || '',
          amount: row.querySelector('[name="amount"]').value || '0',
          remarks: row.querySelector('[name="remarks"]').value || ''
        });
      });

      return rows;
    }

    function buildSubmissionPayload() {
      var rows = collectRows();

      var totalCheckCashRaw = 0;
      var totalAmountRaw = 0;

      rows.forEach(function(row) {
        totalCheckCashRaw += parseFloat(row.checkCashAmount) || 0;
        totalAmountRaw += parseFloat(row.amount) || 0;
      });

      return {
        rowCount: rows.length,
        rows: rows,
        totalCheckCash: totalCheckCashRaw.toFixed(2),
        totalAmount: totalAmountRaw.toFixed(2)
      };
    }

    function validateRows() {
      var rows = collectRows();
      var hasErrors = false;

      matrixBody.querySelectorAll('tr').forEach(function(row) {
        if (isRowEmpty(row)) return;

        var borrowerInput = row.querySelector('[name="borrower"]');
        var loanInput = row.querySelector('[name="loanNumber"]');

        borrowerInput.classList.remove('required-missing');
        loanInput.classList.remove('required-missing');

        if (!borrowerInput.value.trim()) {
          borrowerInput.classList.add('required-missing');
          hasErrors = true;
        }

        var loanValue = loanInput.value.trim();
        if (!loanValue || !/^\d{6,7}$/.test(loanValue)) {
          loanInput.classList.add('required-missing');
          hasErrors = true;
        }
      });

      return !hasErrors;
    }

    function notifyHeight() {
      if (typeof JFCustomWidget !== 'undefined' && JFCustomWidget.requestFrameResize) {
        setTimeout(function() {
          JFCustomWidget.requestFrameResize();
        }, 50);
      }
    }

    function applySettings() {
      if (typeof JFCustomWidget === 'undefined') return;

      var headersSetting = JFCustomWidget.getWidgetSetting('columnHeaders');
      if (headersSetting) {
        var headers = headersSetting.split(',');
        var headerRow = document.getElementById('headerRow');
        var ths = headerRow.querySelectorAll('th');
        headers.forEach(function(header, index) {
          if (ths[index]) {
            ths[index].textContent = header.trim();
          }
        });
      }

      var paymentTypesSetting = JFCustomWidget.getWidgetSetting('paymentTypes');
      if (paymentTypesSetting) {
        paymentTypeOptions = paymentTypesSetting.split(',').map(function(opt) {
          return opt.trim();
        });
      }
    }

    function initializeWidget() {
      if (initialized) return;
      initialized = true;

      debugLog('Initializing widget');

      addRow();
      addRow();
      notifyHeight();

      debugLog('Widget initialized with 2 rows');
    }

    // Initialize on DOM ready as fallback
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', function() {
        debugLog('DOM Content Loaded');
        setTimeout(initializeWidget, 100);
      });
    } else {
      debugLog('DOM already ready');
      setTimeout(initializeWidget, 100);
    }

    // JotForm widget initialization
    if (typeof JFCustomWidget !== 'undefined') {
      debugLog('JFCustomWidget found');

      JFCustomWidget.subscribe('ready', function() {
        debugLog('JFCustomWidget ready event fired');

        applySettings();
        initializeWidget();

        JFCustomWidget.subscribe('submit', function() {
          debugLog('Submit event fired');

          var payload = buildSubmissionPayload();
          var isValid = validateRows();

          debugLog('Payload built', payload);
          debugLog('Validation result', isValid);

          var valueString = JSON.stringify(payload);

          debugLog('Sending submit with value', valueString);

          var msg = {
            valid: true,
            value: valueString
          };

          JFCustomWidget.sendSubmit(msg);

          debugLog('sendSubmit called', msg);
        });
      });
    } else {
      debugLog('JFCustomWidget NOT found - running standalone');
    }
  </script>
</body>
</html>
