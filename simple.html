<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Dynamic Matrix Widget</title>
  <script src="//js.jotform.com/JotFormCustomWidget.min.js"></script>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      margin: 0;
      padding: 16px;
      color: #1a1a1a;
    }

    #main {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .table-wrapper {
      overflow-x: auto;
    }

    .matrix-table {
      width: 100%;
      border-collapse: collapse;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
    }

    .matrix-table th,
    .matrix-table td {
      border: 1px solid #dcdcdc;
      padding: 6px;
      vertical-align: top;
    }

    .matrix-table th {
      background: #f7f7f7;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.02em;
    }

    .matrix-table input,
    .matrix-table select {
      width: 100%;
      box-sizing: border-box;
      padding: 6px 8px;
      font-size: 13px;
      border-radius: 4px;
      border: 1px solid #d7deea;
      background: #fff;
      transition: border-color 0.15s ease, box-shadow 0.15s ease, background-color 0.15s ease;
    }

    .matrix-table input:focus,
    .matrix-table select:focus {
      outline: none;
      border-color: #2d6cdf;
      box-shadow: 0 0 0 3px rgba(45, 108, 223, 0.15);
    }

    .matrix-table input.invalid-loan {
      background-color: #ffcc80;
      border-color: #f57c00;
    }

    .matrix-table input.invalid-loan:focus {
      box-shadow: 0 0 0 3px rgba(245, 124, 0, 0.25);
    }

    .matrix-table input.required-error {
      background-color: #ffcdd2;
      border-color: #e53935;
    }

    .actions-cell {
      white-space: nowrap;
    }

    .action-btn {
      background: #2d6cdf;
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 5px 8px;
      cursor: pointer;
      font-size: 11px;
      margin-right: 3px;
      margin-bottom: 3px;
    }

    .action-btn:hover {
      background: #1e5bc6;
    }

    .action-btn:focus {
      outline: none;
      box-shadow: 0 0 0 3px rgba(45, 108, 223, 0.35);
    }

    .action-btn.copy-all {
      background: #43a047;
    }

    .action-btn.copy-all:hover {
      background: #388e3c;
    }

    .action-btn.copy-all:focus {
      box-shadow: 0 0 0 3px rgba(67, 160, 71, 0.35);
    }

    .action-btn.copy-borrower {
      background: #7b1fa2;
    }

    .action-btn.copy-borrower:hover {
      background: #6a1b9a;
    }

    .action-btn.copy-borrower:focus {
      box-shadow: 0 0 0 3px rgba(123, 31, 162, 0.35);
    }

    .action-btn.remove-btn {
      background: #e53935;
    }

    .action-btn.remove-btn:hover {
      background: #c62828;
    }

    .totals {
      display: flex;
      justify-content: flex-end;
      gap: 16px;
      font-weight: bold;
    }

    .total-field {
      background: #9acd32;
      color: #0d2a00;
      padding: 6px 12px;
      border-radius: 4px;
      min-width: 140px;
      text-align: right;
    }
  </style>
</head>
<body>
  <div id="main">
    <div class="table-wrapper">
      <table class="matrix-table" aria-label="Dynamic matrix">
        <thead>
          <tr>
            <th>Borrower Name</th>
            <th>Remitter Name (if different)</th>
            <th>Cash or Check</th>
            <th>Total Check/Cash Amount</th>
            <th>Effective Date</th>
            <th>Loan Number</th>
            <th>Amount</th>
            <th>Remarks/Comments/FH Code</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="matrixBody"></tbody>
      </table>
    </div>
    <div class="totals">
      <div class="total-field">Total Check/Cash: <span id="totalCheckCash">$0.00</span></div>
      <div class="total-field">Total Amount: <span id="totalAmount">$0.00</span></div>
    </div>
  </div>

  <script type="text/javascript">
    var matrixBody = document.getElementById('matrixBody');
    var totalCheckCashEl = document.getElementById('totalCheckCash');
    var totalAmountEl = document.getElementById('totalAmount');
    var initialized = false;

    function formatCurrency(value) {
      var numberValue = Number(value);
      if (Number.isNaN(numberValue)) {
        return '$0.00';
      }
      return '$' + numberValue.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    }

    function parseCurrency(value) {
      var numberValue = Number(value);
      if (Number.isNaN(numberValue)) {
        return 0;
      }
      return numberValue;
    }

    function validateLoanNumber(input) {
      var value = input.value.trim();
      if (value === '') {
        input.classList.remove('invalid-loan');
        return true;
      }
      var isValid = /^\d{6,7}$/.test(value);
      if (isValid) {
        input.classList.remove('invalid-loan');
      } else {
        input.classList.add('invalid-loan');
      }
      return isValid;
    }

    function createCellInput(type, name, placeholder) {
      var input = document.createElement('input');
      input.type = type;
      input.name = name;
      input.autocomplete = 'off';
      input.setAttribute('autocomplete', 'off');
      input.setAttribute('autocapitalize', 'off');
      input.setAttribute('autocorrect', 'off');
      input.setAttribute('spellcheck', 'false');
      input.setAttribute('data-lpignore', 'true');
      input.setAttribute('data-form-type', 'other');

      if (placeholder) {
        input.placeholder = placeholder;
      }
      if (type === 'number') {
        input.step = '0.01';
        input.min = '0';
      }
      input.addEventListener('input', handleInputChange);

      if (name === 'loanNumber') {
        input.addEventListener('input', function() {
          validateLoanNumber(input);
        });
        input.addEventListener('blur', function() {
          validateLoanNumber(input);
        });
      }

      return input;
    }

    function createSelect(name, options) {
      var select = document.createElement('select');
      select.name = name;
      select.autocomplete = 'off';
      select.setAttribute('autocomplete', 'off');
      select.setAttribute('data-lpignore', 'true');
      select.setAttribute('data-form-type', 'other');

      options.forEach(function(optionValue) {
        var option = document.createElement('option');
        option.value = optionValue;
        option.textContent = optionValue;
        select.appendChild(option);
      });
      select.addEventListener('change', handleInputChange);
      return select;
    }

    function addRow(defaults) {
      var row = document.createElement('tr');

      var borrowerCell = document.createElement('td');
      borrowerCell.appendChild(createCellInput('text', 'borrower', 'Borrower Name'));
      row.appendChild(borrowerCell);

      var remitterCell = document.createElement('td');
      remitterCell.appendChild(createCellInput('text', 'remitter', 'Remitter Name'));
      row.appendChild(remitterCell);

      var cashCheckCell = document.createElement('td');
      cashCheckCell.appendChild(createSelect('paymentType', ['Cash', 'Check', 'Money Order']));
      row.appendChild(cashCheckCell);

      var totalCell = document.createElement('td');
      totalCell.appendChild(createCellInput('number', 'checkCashAmount', '0.00'));
      row.appendChild(totalCell);

      var dateCell = document.createElement('td');
      dateCell.appendChild(createCellInput('date', 'effectiveDate'));
      row.appendChild(dateCell);

      var loanCell = document.createElement('td');
      loanCell.appendChild(createCellInput('text', 'loanNumber', '000000'));
      row.appendChild(loanCell);

      var amountCell = document.createElement('td');
      amountCell.appendChild(createCellInput('number', 'amount', '0.00'));
      row.appendChild(amountCell);

      var remarksCell = document.createElement('td');
      remarksCell.appendChild(createCellInput('text', 'remarks', 'Remarks'));
      row.appendChild(remarksCell);

      var actionsCell = document.createElement('td');
      actionsCell.className = 'actions-cell';

      var copyAllBtn = document.createElement('button');
      copyAllBtn.type = 'button';
      copyAllBtn.className = 'action-btn copy-all';
      copyAllBtn.textContent = 'Copy All';
      copyAllBtn.title = 'Copy Borrower and Loan info to next row';
      copyAllBtn.addEventListener('click', function() {
        copyToNextRow(row, true);
      });
      actionsCell.appendChild(copyAllBtn);

      var copyBorrowerBtn = document.createElement('button');
      copyBorrowerBtn.type = 'button';
      copyBorrowerBtn.className = 'action-btn copy-borrower';
      copyBorrowerBtn.textContent = 'Copy Borrower';
      copyBorrowerBtn.title = 'Copy Borrower info only to next row';
      copyBorrowerBtn.addEventListener('click', function() {
        copyToNextRow(row, false);
      });
      actionsCell.appendChild(copyBorrowerBtn);

      var removeBtn = document.createElement('button');
      removeBtn.type = 'button';
      removeBtn.className = 'action-btn remove-btn';
      removeBtn.textContent = 'Remove';
      removeBtn.title = 'Remove this row';
      removeBtn.tabIndex = -1;
      removeBtn.addEventListener('click', function() {
        var rows = matrixBody.querySelectorAll('tr');
        if (rows.length > 1) {
          row.remove();
          updateTotals();
          ensureBlankRow();
          notifyHeight();
        }
      });
      actionsCell.appendChild(removeBtn);

      row.appendChild(actionsCell);
      matrixBody.appendChild(row);

      if (defaults) {
        Object.keys(defaults).forEach(function(key) {
          var element = row.querySelector('[name="' + key + '"]');
          if (element) {
            element.value = defaults[key];
            if (key === 'loanNumber') {
              validateLoanNumber(element);
            }
          }
        });
      }

      updateTotals();
      notifyHeight();
      return row;
    }

    function copyToNextRow(sourceRow, includeLoan) {
      var borrower = sourceRow.querySelector('[name="borrower"]').value;
      var remitter = sourceRow.querySelector('[name="remitter"]').value;
      var paymentType = sourceRow.querySelector('[name="paymentType"]').value;
      var checkCashAmount = sourceRow.querySelector('[name="checkCashAmount"]').value;
      var effectiveDate = sourceRow.querySelector('[name="effectiveDate"]').value;

      var defaults = {
        borrower: borrower,
        remitter: remitter,
        paymentType: paymentType,
        checkCashAmount: checkCashAmount,
        effectiveDate: effectiveDate
      };

      if (includeLoan) {
        defaults.loanNumber = sourceRow.querySelector('[name="loanNumber"]').value;
      }

      var rows = matrixBody.querySelectorAll('tr');
      var lastRow = rows[rows.length - 1];

      if (isRowEmpty(lastRow)) {
        Object.keys(defaults).forEach(function(key) {
          var element = lastRow.querySelector('[name="' + key + '"]');
          if (element) {
            element.value = defaults[key];
            if (key === 'loanNumber') {
              validateLoanNumber(element);
            }
          }
        });
        addRow();
      } else {
        addRow(defaults);
        addRow();
      }

      notifyHeight();
    }

    function updateTotals() {
      var rows = matrixBody.querySelectorAll('tr');
      var totalCheckCash = 0;
      var totalAmount = 0;

      rows.forEach(function(row) {
        var checkCashValue = parseCurrency(row.querySelector('[name="checkCashAmount"]').value);
        var amountValue = parseCurrency(row.querySelector('[name="amount"]').value);
        totalCheckCash += checkCashValue;
        totalAmount += amountValue;
      });

      totalCheckCashEl.textContent = formatCurrency(totalCheckCash);
      totalAmountEl.textContent = formatCurrency(totalAmount);
    }

    function handleInputChange(event) {
      updateTotals();
      var targetRow = event.target.closest('tr');
      if (targetRow && !isRowEmpty(targetRow) && isLastRow(targetRow)) {
        addRow();
      }
    }

    function isRowEmpty(row) {
      var borrower = row.querySelector('[name="borrower"]').value.trim();
      var loanNumber = row.querySelector('[name="loanNumber"]').value.trim();
      var checkCashAmount = row.querySelector('[name="checkCashAmount"]').value.trim();
      var amount = row.querySelector('[name="amount"]').value.trim();
      var remarks = row.querySelector('[name="remarks"]').value.trim();

      return borrower === '' && loanNumber === '' &&
             (checkCashAmount === '' || checkCashAmount === '0' || checkCashAmount === '0.00') &&
             (amount === '' || amount === '0' || amount === '0.00') &&
             remarks === '';
    }

    function isLastRow(row) {
      var rows = matrixBody.querySelectorAll('tr');
      return rows.length && rows[rows.length - 1] === row;
    }

    function ensureBlankRow() {
      var rows = matrixBody.querySelectorAll('tr');
      if (rows.length === 0) {
        addRow();
        addRow();
        return;
      }
      var lastRow = rows[rows.length - 1];
      if (!isRowEmpty(lastRow)) {
        addRow();
      }
    }

    function collectRows() {
      var rows = [];
      matrixBody.querySelectorAll('tr').forEach(function(row, index) {
        var rowData = {
          rowNumber: index + 1,
          borrower: row.querySelector('[name="borrower"]').value,
          remitter: row.querySelector('[name="remitter"]').value,
          paymentType: row.querySelector('[name="paymentType"]').value,
          checkCashAmount: parseCurrency(row.querySelector('[name="checkCashAmount"]').value),
          effectiveDate: row.querySelector('[name="effectiveDate"]').value,
          loanNumber: row.querySelector('[name="loanNumber"]').value,
          amount: parseCurrency(row.querySelector('[name="amount"]').value),
          remarks: row.querySelector('[name="remarks"]').value
        };

        if (!isRowEmpty(row)) {
          rows.push(rowData);
        }
      });
      return rows;
    }

    function validateRows() {
      var valid = true;
      var rows = matrixBody.querySelectorAll('tr');

      rows.forEach(function(row) {
        var borrowerInput = row.querySelector('[name="borrower"]');
        var loanInput = row.querySelector('[name="loanNumber"]');
        var borrower = borrowerInput.value.trim();
        var loanNumber = loanInput.value.trim();

        borrowerInput.classList.remove('required-error');
        loanInput.classList.remove('required-error');

        if (!isRowEmpty(row)) {
          if (borrower === '') {
            borrowerInput.classList.add('required-error');
            valid = false;
          }
          if (loanNumber === '') {
            loanInput.classList.add('required-error');
            valid = false;
          } else if (!validateLoanNumber(loanInput)) {
            valid = false;
          }
        }
      });

      return valid;
    }

    function buildSubmissionPayload() {
      var rows = collectRows();
      var totalCheckCash = parseCurrency(totalCheckCashEl.textContent.replace('$', '').replace(/,/g, ''));
      var totalAmount = parseCurrency(totalAmountEl.textContent.replace('$', '').replace(/,/g, ''));

      return {
        rows: rows,
        totalCheckCash: totalCheckCash,
        totalAmount: totalAmount,
        rowCount: rows.length
      };
    }

    function notifyHeight() {
      if (typeof JFCustomWidget !== 'undefined') {
        JFCustomWidget.requestFrameResize();
      }
    }

    function initializeWidget() {
      if (initialized) return;
      initialized = true;

      addRow();
      addRow();
      notifyHeight();
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', function() {
        setTimeout(initializeWidget, 100);
      });
    } else {
      setTimeout(initializeWidget, 100);
    }

    if (typeof JFCustomWidget !== 'undefined') {
      JFCustomWidget.subscribe('ready', function() {
        initializeWidget();

        JFCustomWidget.subscribe('submit', function() {
          var isValid = validateRows();
          var payload = buildSubmissionPayload();

          var msg = {
            valid: isValid,
            value: JSON.stringify(payload)
          };

          if (!isValid) {
            msg.value = JSON.stringify({
              error: 'Please fill in all required fields (Borrower Name and Loan Number 6-7 digits) for each row with data.',
              partialData: payload
            });
          }

          JFCustomWidget.sendSubmit(msg);
        });
      });
    }
  </script>
</body>
</html>
