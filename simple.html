<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Dynamic Matrix Widget</title>
  <script src="//js.jotform.com/JotFormCustomWidget.min.js"></script>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      margin: 0;
      padding: 16px;
      color: #1a1a1a;
    }

    #main {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .table-wrapper {
      overflow-x: auto;
    }

    .matrix-table {
      width: 100%;
      border-collapse: collapse;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
    }

    .matrix-table th,
    .matrix-table td {
      border: 1px solid #dcdcdc;
      padding: 6px;
      vertical-align: top;
    }

    .matrix-table th {
      background: #f7f7f7;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.02em;
      color: #394150;
    }

    .matrix-table input,
    .matrix-table select {
      width: 100%;
      box-sizing: border-box;
      padding: 6px 8px;
      font-size: 13px;
      border-radius: 4px;
      border: 1px solid #d7deea;
      background: #fff;
      transition: border-color 0.15s ease, box-shadow 0.15s ease, background-color 0.15s ease;
    }

    .matrix-table input:focus,
    .matrix-table select:focus {
      outline: none;
      border-color: #2d6cdf;
      box-shadow: 0 0 0 3px rgba(45, 108, 223, 0.15);
    }

    .matrix-table input.invalid-loan {
      background-color: #fff3e0;
      border-color: #ff9800;
    }

    .matrix-table input.required-error {
      background-color: #ffebee;
      border-color: #f44336;
    }

    .totals {
      display: flex;
      justify-content: flex-end;
      gap: 16px;
      font-weight: bold;
    }

    .totals .total-field {
      background: #9acd32;
      color: #0d2a00;
      padding: 6px 12px;
      border-radius: 4px;
      min-width: 140px;
      text-align: right;
    }

    .action-buttons {
      display: flex;
      gap: 4px;
      flex-wrap: nowrap;
    }

    .action-btn {
      padding: 4px 8px;
      font-size: 11px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      white-space: nowrap;
    }

    .action-btn.copy-all {
      background: #2196F3;
      color: #fff;
    }

    .action-btn.copy-all:hover {
      background: #1976D2;
    }

    .action-btn.copy-all:focus {
      outline: none;
      box-shadow: 0 0 0 3px rgba(33, 150, 243, 0.3);
    }

    .action-btn.copy-borrower {
      background: #4CAF50;
      color: #fff;
    }

    .action-btn.copy-borrower:hover {
      background: #388E3C;
    }

    .action-btn.copy-borrower:focus {
      outline: none;
      box-shadow: 0 0 0 3px rgba(76, 175, 80, 0.3);
    }

    .action-btn.remove {
      background: #e55353;
      color: #fff;
    }

    .action-btn.remove:hover {
      background: #c62828;
    }
  </style>
</head>
<body>
  <div id="main">
    <div class="table-wrapper">
      <table class="matrix-table" aria-label="Dynamic matrix">
        <thead>
          <tr>
            <th id="header-borrower">Borrower Name</th>
            <th id="header-remitter">Remitter Name (if different)</th>
            <th id="header-paymentType">Cash or Check</th>
            <th id="header-checkCashAmount">Total Check/Cash Amount</th>
            <th id="header-effectiveDate">Effective Date</th>
            <th id="header-loanNumber">Loan Number</th>
            <th id="header-amount">Amount</th>
            <th id="header-remarks">Remarks/Comments/FH Code</th>
            <th id="header-actions">Actions</th>
          </tr>
        </thead>
        <tbody id="matrixBody"></tbody>
      </table>
    </div>
    <div class="totals">
      <div class="total-field">Total Check/Cash: <span id="totalCheckCash">$0.00</span></div>
      <div class="total-field">Total Amount: <span id="totalAmount">$0.00</span></div>
    </div>
  </div>

  <script type="text/javascript">
    var matrixBody = document.getElementById('matrixBody');
    var totalCheckCashEl = document.getElementById('totalCheckCash');
    var totalAmountEl = document.getElementById('totalAmount');
    var initialized = false;

    // Default settings
    var defaultHeaders = {
      borrower: 'Borrower Name',
      remitter: 'Remitter Name (if different)',
      paymentType: 'Cash or Check',
      checkCashAmount: 'Total Check/Cash Amount',
      effectiveDate: 'Effective Date',
      loanNumber: 'Loan Number',
      amount: 'Amount',
      remarks: 'Remarks/Comments/FH Code',
      actions: 'Actions'
    };

    var paymentTypeOptions = ['Cash', 'Check', 'Money Order'];

    function formatCurrency(value) {
      var numberValue = Number(value);
      if (Number.isNaN(numberValue)) {
        return '$0.00';
      }
      return '$' + numberValue.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    }

    function createCellInput(type, name, placeholder) {
      var input = document.createElement('input');
      input.type = type;
      input.name = name;
      input.autocomplete = 'off';
      input.setAttribute('autocomplete', 'off');
      input.setAttribute('autocorrect', 'off');
      input.setAttribute('autocapitalize', 'off');
      input.setAttribute('spellcheck', 'false');
      input.setAttribute('data-lpignore', 'true');
      input.setAttribute('data-form-type', 'other');

      if (placeholder) {
        input.placeholder = placeholder;
      }
      if (type === 'number') {
        input.step = '0.01';
        input.min = '0';
      }
      if (name === 'loanNumber') {
        input.setAttribute('maxlength', '7');
        input.setAttribute('pattern', '[0-9]{6,7}');
        input.addEventListener('input', function() {
          validateLoanNumber(input);
          handleInputChange(input);
        });
      } else {
        input.addEventListener('input', function() {
          handleInputChange(input);
        });
      }
      return input;
    }

    function createSelect(name, options) {
      var select = document.createElement('select');
      select.name = name;
      select.autocomplete = 'off';
      select.setAttribute('autocomplete', 'off');
      select.setAttribute('data-lpignore', 'true');
      select.setAttribute('data-form-type', 'other');

      options.forEach(function(optionValue) {
        var option = document.createElement('option');
        option.value = optionValue;
        option.textContent = optionValue;
        select.appendChild(option);
      });
      select.addEventListener('change', function() {
        handleInputChange(select);
      });
      return select;
    }

    function validateLoanNumber(input) {
      if (input.name !== 'loanNumber') return;

      var value = input.value.trim();
      input.classList.remove('invalid-loan');

      if (value === '') return;

      var isValidFormat = /^[0-9]{6,7}$/.test(value);
      if (!isValidFormat) {
        input.classList.add('invalid-loan');
      }
    }

    function addRow(defaults) {
      var row = document.createElement('tr');

      var borrowerCell = document.createElement('td');
      borrowerCell.appendChild(createCellInput('text', 'borrower', 'Borrower Name'));
      row.appendChild(borrowerCell);

      var remitterCell = document.createElement('td');
      remitterCell.appendChild(createCellInput('text', 'remitter', 'Remitter Name'));
      row.appendChild(remitterCell);

      var cashCheckCell = document.createElement('td');
      cashCheckCell.appendChild(createSelect('paymentType', paymentTypeOptions));
      row.appendChild(cashCheckCell);

      var totalCell = document.createElement('td');
      totalCell.appendChild(createCellInput('number', 'checkCashAmount', '0.00'));
      row.appendChild(totalCell);

      var dateCell = document.createElement('td');
      dateCell.appendChild(createCellInput('date', 'effectiveDate'));
      row.appendChild(dateCell);

      var loanCell = document.createElement('td');
      loanCell.appendChild(createCellInput('text', 'loanNumber', 'Loan #'));
      row.appendChild(loanCell);

      var amountCell = document.createElement('td');
      amountCell.appendChild(createCellInput('number', 'amount', '0.00'));
      row.appendChild(amountCell);

      var remarksCell = document.createElement('td');
      remarksCell.appendChild(createCellInput('text', 'remarks', 'Remarks'));
      row.appendChild(remarksCell);

      var actionsCell = document.createElement('td');
      var actionButtons = document.createElement('div');
      actionButtons.className = 'action-buttons';

      var copyAllBtn = document.createElement('button');
      copyAllBtn.type = 'button';
      copyAllBtn.className = 'action-btn copy-all';
      copyAllBtn.textContent = 'Copy All';
      copyAllBtn.setAttribute('tabindex', '0');
      copyAllBtn.addEventListener('click', function() {
        copyRowData(row, true);
      });
      actionButtons.appendChild(copyAllBtn);

      var copyBorrowerBtn = document.createElement('button');
      copyBorrowerBtn.type = 'button';
      copyBorrowerBtn.className = 'action-btn copy-borrower';
      copyBorrowerBtn.textContent = 'Copy Borrower';
      copyBorrowerBtn.setAttribute('tabindex', '0');
      copyBorrowerBtn.addEventListener('click', function() {
        copyRowData(row, false);
      });
      actionButtons.appendChild(copyBorrowerBtn);

      var removeBtn = document.createElement('button');
      removeBtn.type = 'button';
      removeBtn.className = 'action-btn remove';
      removeBtn.textContent = 'Remove';
      removeBtn.setAttribute('tabindex', '-1');
      removeBtn.addEventListener('click', function() {
        removeRow(row);
      });
      actionButtons.appendChild(removeBtn);

      actionsCell.appendChild(actionButtons);
      row.appendChild(actionsCell);

      matrixBody.appendChild(row);

      if (defaults) {
        Object.keys(defaults).forEach(function(key) {
          var element = row.querySelector('[name="' + key + '"]');
          if (element) {
            element.value = defaults[key];
            if (key === 'loanNumber') {
              validateLoanNumber(element);
            }
          }
        });
      }

      updateTotals();
      notifyHeight();
      return row;
    }

    function copyRowData(sourceRow, includeAll) {
      var data = {
        borrower: sourceRow.querySelector('[name="borrower"]').value,
        remitter: sourceRow.querySelector('[name="remitter"]').value,
        paymentType: sourceRow.querySelector('[name="paymentType"]').value,
        checkCashAmount: sourceRow.querySelector('[name="checkCashAmount"]').value,
        effectiveDate: sourceRow.querySelector('[name="effectiveDate"]').value
      };

      if (includeAll) {
        data.loanNumber = sourceRow.querySelector('[name="loanNumber"]').value;
      }

      var rows = matrixBody.querySelectorAll('tr');
      var lastRow = rows[rows.length - 1];

      // Fill the last blank row with copied data
      Object.keys(data).forEach(function(key) {
        var element = lastRow.querySelector('[name="' + key + '"]');
        if (element && data[key]) {
          element.value = data[key];
          if (key === 'loanNumber') {
            validateLoanNumber(element);
          }
        }
      });

      // Add a new blank row
      addRow();

      // Focus on appropriate field in the filled row
      if (includeAll) {
        var amountField = lastRow.querySelector('[name="amount"]');
        if (amountField) amountField.focus();
      } else {
        var loanField = lastRow.querySelector('[name="loanNumber"]');
        if (loanField) loanField.focus();
      }

      updateTotals();
    }

    function removeRow(row) {
      var rows = matrixBody.querySelectorAll('tr');
      if (rows.length <= 2) {
        // Clear the row instead of removing if it's one of the last two
        row.querySelectorAll('input').forEach(function(input) {
          input.value = '';
          input.classList.remove('invalid-loan', 'required-error');
        });
        row.querySelectorAll('select').forEach(function(select) {
          select.selectedIndex = 0;
        });
        updateTotals();
        return;
      }

      row.remove();
      ensureBlankRowExists();
      updateTotals();
      notifyHeight();
    }

    function isRowEmpty(row) {
      var inputs = row.querySelectorAll('input, select');
      for (var i = 0; i < inputs.length; i++) {
        var input = inputs[i];
        if (input.name === 'paymentType') {
          continue; // Skip select as it always has a value
        }
        if (input.value && input.value.trim() !== '' && input.value !== '0' && input.value !== '0.00') {
          return false;
        }
      }
      return true;
    }

    function isLastRow(row) {
      var rows = matrixBody.querySelectorAll('tr');
      return rows.length && rows[rows.length - 1] === row;
    }

    function ensureBlankRowExists() {
      var rows = matrixBody.querySelectorAll('tr');
      if (rows.length === 0) {
        addRow();
        addRow();
        return;
      }

      var lastRow = rows[rows.length - 1];
      if (!isRowEmpty(lastRow)) {
        addRow();
      }
    }

    function handleInputChange(inputElement) {
      updateTotals();

      var targetRow = inputElement.closest('tr');
      if (targetRow && isLastRow(targetRow) && !isRowEmpty(targetRow)) {
        addRow();
      }
    }

    function updateTotals() {
      var rows = matrixBody.querySelectorAll('tr');
      var totalCheckCash = 0;
      var totalAmount = 0;

      rows.forEach(function(row) {
        var checkCashInput = row.querySelector('[name="checkCashAmount"]');
        var amountInput = row.querySelector('[name="amount"]');

        var checkCashValue = checkCashInput ? parseFloat(checkCashInput.value) || 0 : 0;
        var amountValue = amountInput ? parseFloat(amountInput.value) || 0 : 0;

        totalCheckCash += checkCashValue;
        totalAmount += amountValue;
      });

      totalCheckCashEl.textContent = formatCurrency(totalCheckCash);
      totalAmountEl.textContent = formatCurrency(totalAmount);
    }

    function validateRows() {
      var rows = matrixBody.querySelectorAll('tr');
      var isValid = true;
      var hasAtLeastOneFilledRow = false;

      rows.forEach(function(row) {
        var borrowerInput = row.querySelector('[name="borrower"]');
        var loanInput = row.querySelector('[name="loanNumber"]');

        borrowerInput.classList.remove('required-error');
        loanInput.classList.remove('required-error');

        if (isRowEmpty(row)) {
          return;
        }

        hasAtLeastOneFilledRow = true;

        if (!borrowerInput.value.trim()) {
          borrowerInput.classList.add('required-error');
          isValid = false;
        }

        if (!loanInput.value.trim()) {
          loanInput.classList.add('required-error');
          isValid = false;
        } else {
          var isValidLoan = /^[0-9]{6,7}$/.test(loanInput.value.trim());
          if (!isValidLoan) {
            loanInput.classList.add('invalid-loan');
            isValid = false;
          }
        }
      });

      if (!hasAtLeastOneFilledRow) {
        isValid = false;
      }

      return isValid;
    }

    function collectRows() {
      var rows = [];
      matrixBody.querySelectorAll('tr').forEach(function(row, index) {
        if (isRowEmpty(row)) {
          return;
        }

        rows.push({
          rowNumber: index + 1,
          borrower: row.querySelector('[name="borrower"]').value.trim(),
          remitter: row.querySelector('[name="remitter"]').value.trim(),
          paymentType: row.querySelector('[name="paymentType"]').value,
          checkCashAmount: parseFloat(row.querySelector('[name="checkCashAmount"]').value) || 0,
          effectiveDate: row.querySelector('[name="effectiveDate"]').value,
          loanNumber: row.querySelector('[name="loanNumber"]').value.trim(),
          amount: parseFloat(row.querySelector('[name="amount"]').value) || 0,
          remarks: row.querySelector('[name="remarks"]').value.trim()
        });
      });

      return rows;
    }

    function buildSubmissionPayload() {
      var rows = collectRows();
      var totalCheckCash = 0;
      var totalAmount = 0;

      rows.forEach(function(row) {
        totalCheckCash += row.checkCashAmount;
        totalAmount += row.amount;
      });

      return {
        rows: rows,
        rowCount: rows.length,
        totalCheckCash: totalCheckCash,
        totalAmount: totalAmount
      };
    }

    function applySettings() {
      if (typeof JFCustomWidget === 'undefined') return;

      // Apply header labels
      var headerFields = ['borrower', 'remitter', 'paymentType', 'checkCashAmount', 'effectiveDate', 'loanNumber', 'amount', 'remarks', 'actions'];
      headerFields.forEach(function(field) {
        var settingName = 'header_' + field;
        var headerValue = JFCustomWidget.getWidgetSetting(settingName);
        if (headerValue) {
          var headerEl = document.getElementById('header-' + field);
          if (headerEl) {
            headerEl.textContent = headerValue;
          }
        }
      });

      // Apply payment type options
      var paymentOptions = JFCustomWidget.getWidgetSetting('paymentTypeOptions');
      if (paymentOptions) {
        paymentTypeOptions = paymentOptions.split(',').map(function(opt) {
          return opt.trim();
        });
      }
    }

    function notifyHeight() {
      if (typeof JFCustomWidget !== 'undefined') {
        JFCustomWidget.requestFrameResize();
      }
    }

    function initializeWidget() {
      if (initialized) return;
      initialized = true;

      addRow();
      addRow();
      notifyHeight();
    }

    // Initialize on DOM ready as fallback
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', function() {
        setTimeout(initializeWidget, 100);
      });
    } else {
      setTimeout(initializeWidget, 100);
    }

    // JotForm widget initialization
    if (typeof JFCustomWidget !== 'undefined') {
      JFCustomWidget.subscribe('ready', function() {
        applySettings();
        initializeWidget();

        JFCustomWidget.subscribe('submit', function() {
          var isValid = validateRows();
          var payload = buildSubmissionPayload();

          var msg = {
            valid: isValid,
            value: JSON.stringify(payload)
          };

          JFCustomWidget.sendSubmit(msg);
        });
      });
    }
  </script>
</body>
</html>
