<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Dynamic Matrix Widget</title>
  <script src="//js.jotform.com/JotFormCustomWidget.min.js"></script>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      margin: 0;
      padding: 12px;
      color: #1a1a1a;
    }

    #main {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-width: 1200px;
    }

    .table-wrapper {
      overflow-x: auto;
    }

    .matrix-table {
      width: 100%;
      border-collapse: collapse;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.08);
    }

    .matrix-table th,
    .matrix-table td {
      border: 1px solid #dcdcdc;
      padding: 5px;
      vertical-align: middle;
    }

    .matrix-table th {
      background: #4a5568;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.02em;
      color: #ffffff;
      white-space: nowrap;
    }

    .matrix-table tbody tr:nth-child(odd) {
      background-color: #ffffff;
    }

    .matrix-table tbody tr:nth-child(even) {
      background-color: #f1f5f9;
    }

    .matrix-table input,
    .matrix-table select {
      width: 100%;
      box-sizing: border-box;
      padding: 6px 8px;
      font-size: 12px;
      border-radius: 4px;
      border: 1px solid #d7deea;
      background: #fff;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .matrix-table input:focus,
    .matrix-table select:focus {
      outline: none;
      border-color: #2d6cdf;
      box-shadow: 0 0 0 2px rgba(45, 108, 223, 0.15);
    }

    .matrix-table input.invalid-loan {
      background-color: #fff3e0;
      border-color: #ff9800;
    }

    .matrix-table input.invalid-required {
      background-color: #ffebee;
      border-color: #f44336;
    }

    .totals {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      font-weight: bold;
      font-size: 13px;
    }

    .totals .total-field {
      background: #9acd32;
      color: #0d2a00;
      padding: 6px 12px;
      border-radius: 4px;
      min-width: 120px;
      text-align: right;
    }

    .actions-cell {
      white-space: nowrap;
      text-align: center;
    }

    .action-btn {
      border: none;
      border-radius: 4px;
      padding: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      margin: 0 3px;
      transition: opacity 0.15s ease;
    }

    .action-btn:hover {
      opacity: 0.8;
    }

    .action-btn:focus {
      outline: 2px solid #2d6cdf;
      outline-offset: 1px;
    }

    .action-btn svg {
      width: 16px;
      height: 16px;
    }

    .btn-copy-all {
      background: #2d6cdf;
      color: #ffffff;
    }

    .btn-copy-borrower {
      background: #17a2b8;
      color: #ffffff;
    }

    .btn-remove {
      background: #e55353;
      color: #ffffff;
    }

    .icon {
      display: inline-block;
    }
  </style>
</head>
<body>
  <div id="main">
    <div class="table-wrapper">
      <table class="matrix-table" aria-label="Dynamic matrix">
        <thead>
          <tr>
            <th id="th-borrower">Borrower Name</th>
            <th id="th-remitter">Remitter Name</th>
            <th id="th-paymentType">Cash/Check</th>
            <th id="th-checkCashAmount">Check/Cash Amt</th>
            <th id="th-effectiveDate">Effective Date</th>
            <th id="th-loanNumber">Loan Number</th>
            <th id="th-amount">Amount</th>
            <th id="th-remarks">Remarks</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="matrixBody"></tbody>
      </table>
    </div>
    <div class="totals">
      <div class="total-field">Check/Cash: <span id="totalCheckCash">$0.00</span></div>
      <div class="total-field">Amount: <span id="totalAmount">$0.00</span></div>
    </div>
  </div>

  <script type="text/javascript">
    var matrixBody = document.getElementById('matrixBody');
    var totalCheckCashEl = document.getElementById('totalCheckCash');
    var totalAmountEl = document.getElementById('totalAmount');
    var initialized = false;

    // Default settings
    var columnHeaders = {
      borrower: 'Borrower Name',
      remitter: 'Remitter Name',
      paymentType: 'Cash/Check',
      checkCashAmount: 'Check/Cash Amt',
      effectiveDate: 'Effective Date',
      loanNumber: 'Loan Number',
      amount: 'Amount',
      remarks: 'Remarks'
    };

    var paymentTypeOptions = ['Cash', 'Check', 'Money Order'];

    function formatCurrency(value) {
      var numberValue = Number(value);
      if (Number.isNaN(numberValue)) {
        return '$0.00';
      }
      return '$' + numberValue.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function createCellInput(type, name, placeholder) {
      var input = document.createElement('input');
      input.type = type;
      input.name = name;
      input.autocomplete = 'off';
      input.setAttribute('autocomplete', 'off');
      input.setAttribute('data-lpignore', 'true');
      input.setAttribute('data-form-type', 'other');
      if (placeholder) {
        input.placeholder = placeholder;
      }
      if (type === 'number') {
        input.step = '0.01';
        input.min = '0';
      }
      input.addEventListener('input', handleInputChange);
      input.addEventListener('blur', function() {
        if (name === 'loanNumber') {
          validateLoanNumber(input);
        }
      });
      return input;
    }

    function createSelect(name, options) {
      var select = document.createElement('select');
      select.name = name;
      select.autocomplete = 'off';
      options.forEach(function(optionValue) {
        var option = document.createElement('option');
        option.value = optionValue;
        option.textContent = optionValue;
        select.appendChild(option);
      });
      select.addEventListener('change', handleInputChange);
      return select;
    }

    function validateLoanNumber(input) {
      var value = input.value.trim();
      if (value === '') {
        input.classList.remove('invalid-loan');
        return true;
      }
      var isValidFormat = /^\d{6,7}$/.test(value);
      if (!isValidFormat) {
        input.classList.add('invalid-loan');
        return false;
      } else {
        input.classList.remove('invalid-loan');
        return true;
      }
    }

    function isRowEmpty(row) {
      var inputs = row.querySelectorAll('input, select');
      var isEmpty = true;
      for (var i = 0; i < inputs.length; i++) {
        var input = inputs[i];
        if (input.name === 'paymentType') continue;
        if (input.value && input.value.toString().trim() !== '') {
          isEmpty = false;
          break;
        }
      }
      return isEmpty;
    }

    function isRowFilled(row) {
      return !isRowEmpty(row);
    }

    function isLastRow(row) {
      var rows = matrixBody.querySelectorAll('tr');
      return rows.length && rows[rows.length - 1] === row;
    }

    function ensureBlankRow() {
      var rows = matrixBody.querySelectorAll('tr');
      if (rows.length === 0) {
        addRow();
        return;
      }
      var lastRow = rows[rows.length - 1];
      if (isRowFilled(lastRow)) {
        addRow();
      }
    }

    function addRow(defaults) {
      var row = document.createElement('tr');

      var borrowerCell = document.createElement('td');
      borrowerCell.appendChild(createCellInput('text', 'borrower', 'Borrower Name'));
      row.appendChild(borrowerCell);

      var remitterCell = document.createElement('td');
      remitterCell.appendChild(createCellInput('text', 'remitter', 'Remitter Name'));
      row.appendChild(remitterCell);

      var cashCheckCell = document.createElement('td');
      cashCheckCell.appendChild(createSelect('paymentType', paymentTypeOptions));
      row.appendChild(cashCheckCell);

      var totalCell = document.createElement('td');
      totalCell.appendChild(createCellInput('number', 'checkCashAmount', '0.00'));
      row.appendChild(totalCell);

      var dateCell = document.createElement('td');
      dateCell.appendChild(createCellInput('date', 'effectiveDate'));
      row.appendChild(dateCell);

      var loanCell = document.createElement('td');
      loanCell.appendChild(createCellInput('text', 'loanNumber', '000000'));
      row.appendChild(loanCell);

      var amountCell = document.createElement('td');
      amountCell.appendChild(createCellInput('number', 'amount', '0.00'));
      row.appendChild(amountCell);

      var remarksCell = document.createElement('td');
      remarksCell.appendChild(createCellInput('text', 'remarks', 'Remarks'));
      row.appendChild(remarksCell);

      // Actions cell with icon buttons
      var actionsCell = document.createElement('td');
      actionsCell.className = 'actions-cell';

      // Copy All button
      var copyAllBtn = document.createElement('button');
      copyAllBtn.type = 'button';
      copyAllBtn.className = 'action-btn btn-copy-all';
      copyAllBtn.setAttribute('aria-label', 'Copy borrower and loan to next row');
      copyAllBtn.setAttribute('title', 'Copy Borrower + Loan');
      copyAllBtn.innerHTML = '<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>';
      copyAllBtn.addEventListener('click', function() {
        copyToNextRow(row, true);
      });
      actionsCell.appendChild(copyAllBtn);

      // Copy Borrower button
      var copyBorrowerBtn = document.createElement('button');
      copyBorrowerBtn.type = 'button';
      copyBorrowerBtn.className = 'action-btn btn-copy-borrower';
      copyBorrowerBtn.setAttribute('aria-label', 'Copy borrower only to next row');
      copyBorrowerBtn.setAttribute('title', 'Copy Borrower Only');
      copyBorrowerBtn.innerHTML = '<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>';
      copyBorrowerBtn.addEventListener('click', function() {
        copyToNextRow(row, false);
      });
      actionsCell.appendChild(copyBorrowerBtn);

      // Remove button (not tabbable)
      var removeBtn = document.createElement('button');
      removeBtn.type = 'button';
      removeBtn.className = 'action-btn btn-remove';
      removeBtn.setAttribute('aria-label', 'Remove row');
      removeBtn.setAttribute('title', 'Remove Row');
      removeBtn.setAttribute('tabindex', '-1');
      removeBtn.innerHTML = '<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>';
      removeBtn.addEventListener('click', function() {
        if (matrixBody.querySelectorAll('tr').length > 1) {
          row.remove();
          updateTotals();
          ensureBlankRow();
          notifyHeight();
        }
      });
      actionsCell.appendChild(removeBtn);

      row.appendChild(actionsCell);
      matrixBody.appendChild(row);

      if (defaults) {
        Object.keys(defaults).forEach(function(key) {
          var element = row.querySelector('[name="' + key + '"]');
          if (element) {
            element.value = defaults[key];
          }
        });
      }

      updateTotals();
      notifyHeight();
      return row;
    }

    function copyToNextRow(sourceRow, includeLoan) {
      var borrowerValue = sourceRow.querySelector('[name="borrower"]').value;
      var remitterValue = sourceRow.querySelector('[name="remitter"]').value;
      var paymentTypeValue = sourceRow.querySelector('[name="paymentType"]').value;
      var checkCashAmountValue = sourceRow.querySelector('[name="checkCashAmount"]').value;
      var effectiveDateValue = sourceRow.querySelector('[name="effectiveDate"]').value;
      var loanNumberValue = sourceRow.querySelector('[name="loanNumber"]').value;

      var defaults = {
        borrower: borrowerValue,
        remitter: remitterValue,
        paymentType: paymentTypeValue,
        checkCashAmount: checkCashAmountValue,
        effectiveDate: effectiveDateValue
      };

      if (includeLoan) {
        defaults.loanNumber = loanNumberValue;
      }

      var rows = matrixBody.querySelectorAll('tr');
      var lastRow = rows[rows.length - 1];

      if (isRowEmpty(lastRow)) {
        Object.keys(defaults).forEach(function(key) {
          var element = lastRow.querySelector('[name="' + key + '"]');
          if (element) {
            element.value = defaults[key];
          }
        });
        ensureBlankRow();
        var newLastRow = matrixBody.querySelectorAll('tr');
        var focusTarget = newLastRow[newLastRow.length - 1].querySelector('[name="loanNumber"]');
        if (!includeLoan && focusTarget) {
          focusTarget.focus();
        }
      } else {
        var newRow = addRow(defaults);
        ensureBlankRow();
        if (!includeLoan) {
          var loanInput = newRow.querySelector('[name="loanNumber"]');
          if (loanInput) {
            loanInput.focus();
          }
        }
      }

      updateTotals();
      notifyHeight();
    }

    function updateTotals() {
      var rows = matrixBody.querySelectorAll('tr');
      var totalCheckCash = 0;
      var totalAmount = 0;

      rows.forEach(function(row) {
        var checkCashValue = parseFloat(row.querySelector('[name="checkCashAmount"]').value) || 0;
        var amountValue = parseFloat(row.querySelector('[name="amount"]').value) || 0;
        totalCheckCash += checkCashValue;
        totalAmount += amountValue;
      });

      totalCheckCashEl.textContent = formatCurrency(totalCheckCash);
      totalAmountEl.textContent = formatCurrency(totalAmount);
    }

    function handleInputChange(event) {
      updateTotals();

      var targetRow = event.target.closest('tr');
      if (targetRow && isLastRow(targetRow) && isRowFilled(targetRow)) {
        ensureBlankRow();
      }
    }

    function collectRows() {
      var rows = [];
      matrixBody.querySelectorAll('tr').forEach(function(row, index) {
        if (isRowEmpty(row)) return;

        rows.push({
          rowNumber: index + 1,
          borrower: row.querySelector('[name="borrower"]').value,
          remitter: row.querySelector('[name="remitter"]').value,
          paymentType: row.querySelector('[name="paymentType"]').value,
          checkCashAmount: row.querySelector('[name="checkCashAmount"]').value,
          effectiveDate: row.querySelector('[name="effectiveDate"]').value,
          loanNumber: row.querySelector('[name="loanNumber"]').value,
          amount: row.querySelector('[name="amount"]').value,
          remarks: row.querySelector('[name="remarks"]').value
        });
      });
      return rows;
    }

    function validateRows() {
      var isValid = true;
      var rows = matrixBody.querySelectorAll('tr');

      rows.forEach(function(row) {
        if (isRowEmpty(row)) return;

        var borrowerInput = row.querySelector('[name="borrower"]');
        var loanInput = row.querySelector('[name="loanNumber"]');

        var borrowerValue = borrowerInput.value.trim();
        var loanValue = loanInput.value.trim();

        // Check borrower
        if (borrowerValue === '') {
          borrowerInput.classList.add('invalid-required');
          isValid = false;
        } else {
          borrowerInput.classList.remove('invalid-required');
        }

        // Check loan number
        if (loanValue === '' || !/^\d{6,7}$/.test(loanValue)) {
          loanInput.classList.add('invalid-loan');
          isValid = false;
        } else {
          loanInput.classList.remove('invalid-loan');
        }
      });

      return isValid;
    }

    function buildSubmissionPayload() {
      var rows = collectRows();
      var totalCheckCash = totalCheckCashEl.textContent.replace('$', '').replace(/,/g, '');
      var totalAmount = totalAmountEl.textContent.replace('$', '').replace(/,/g, '');

      return {
        rows: rows,
        totalCheckCash: totalCheckCash,
        totalAmount: totalAmount,
        rowCount: rows.length
      };
    }

    function notifyHeight() {
      if (typeof JFCustomWidget !== 'undefined') {
        JFCustomWidget.requestFrameResize();
      }
    }

    function applySettings() {
      if (typeof JFCustomWidget === 'undefined') return;

      // Column headers
      var headerFields = ['borrower', 'remitter', 'paymentType', 'checkCashAmount', 'effectiveDate', 'loanNumber', 'amount', 'remarks'];
      headerFields.forEach(function(field) {
        var settingName = 'header_' + field;
        var headerValue = JFCustomWidget.getWidgetSetting(settingName);
        if (headerValue) {
          var th = document.getElementById('th-' + field);
          if (th) {
            th.textContent = headerValue;
          }
          columnHeaders[field] = headerValue;
        }
      });

      // Payment type options
      var paymentOptions = JFCustomWidget.getWidgetSetting('paymentTypeOptions');
      if (paymentOptions) {
        paymentTypeOptions = paymentOptions.split(',').map(function(opt) {
          return opt.trim();
        });
      }
    }

    function initializeWidget() {
      if (initialized) return;
      initialized = true;

      addRow();
      addRow();
      notifyHeight();
    }

    // Initialize on DOM ready as fallback
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', function() {
        setTimeout(initializeWidget, 100);
      });
    } else {
      setTimeout(initializeWidget, 100);
    }

    // JotForm widget initialization
    if (typeof JFCustomWidget !== 'undefined') {
      JFCustomWidget.subscribe('ready', function() {
        applySettings();
        initializeWidget();

        JFCustomWidget.subscribe('submit', function() {
          var isValid = validateRows();
          var payload = buildSubmissionPayload();

          var msg = {
            valid: isValid,
            value: JSON.stringify(payload)
          };

          JFCustomWidget.sendSubmit(msg);
        });
      });
    }
  </script>
</body>
</html>
