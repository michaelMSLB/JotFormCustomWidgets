<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Dynamic Matrix Widget</title>
  <script src="//js.jotform.com/JotFormCustomWidget.min.js"></script>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      margin: 0;
      padding: 16px;
      color: #1a1a1a;
    }

    #main {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .table-wrapper {
      overflow-x: auto;
    }

    .matrix-table {
      width: 100%;
      border-collapse: collapse;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
    }

    .matrix-table th,
    .matrix-table td {
      border: 1px solid #dcdcdc;
      padding: 6px;
      vertical-align: top;
    }

    .matrix-table th {
      background: #f7f7f7;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.02em;
      color: #394150;
    }

    .matrix-table input,
    .matrix-table select {
      width: 100%;
      box-sizing: border-box;
      padding: 6px 8px;
      font-size: 13px;
      border-radius: 4px;
      border: 1px solid #d7deea;
      background: #fff;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .matrix-table input:focus,
    .matrix-table select:focus {
      outline: none;
      border-color: #2d6cdf;
      box-shadow: 0 0 0 3px rgba(45, 108, 223, 0.15);
    }

    .matrix-table input.invalid {
      background-color: #fff3e0;
      border-color: #ff9800;
    }

    .matrix-table input.invalid:focus {
      box-shadow: 0 0 0 3px rgba(255, 152, 0, 0.25);
    }

    .matrix-table input[required] {
      border-left: 3px solid #2d6cdf;
    }

    .totals {
      display: flex;
      justify-content: flex-end;
      gap: 16px;
      font-weight: bold;
    }

    .totals .total-field {
      background: #9acd32;
      color: #0d2a00;
      padding: 6px 12px;
      border-radius: 4px;
      min-width: 140px;
      text-align: right;
    }

    .action-cell {
      white-space: nowrap;
    }

    .action-btn {
      background: #2d6cdf;
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 4px 8px;
      cursor: pointer;
      font-size: 11px;
      margin-right: 4px;
      margin-bottom: 4px;
    }

    .action-btn:hover {
      background: #1e5bbf;
    }

    .action-btn:focus {
      outline: none;
      box-shadow: 0 0 0 3px rgba(45, 108, 223, 0.35);
    }

    .action-btn.copy-borrower {
      background: #17a2b8;
    }

    .action-btn.copy-borrower:hover {
      background: #138496;
    }

    .action-btn.remove-btn {
      background: #e55353;
    }

    .action-btn.remove-btn:hover {
      background: #d43f3f;
    }
  </style>
</head>
<body>
  <div id="main">
    <div class="table-wrapper">
      <table class="matrix-table" aria-label="Dynamic matrix">
        <thead>
          <tr id="headerRow"></tr>
        </thead>
        <tbody id="matrixBody"></tbody>
      </table>
    </div>
    <div class="totals">
      <div class="total-field">Total Check/Cash: <span id="totalCheckCash">$0.00</span></div>
      <div class="total-field">Total Amount: <span id="totalAmount">$0.00</span></div>
    </div>
  </div>

  <script>
    (function() {
      var matrixBody = document.getElementById('matrixBody');
      var headerRow = document.getElementById('headerRow');
      var totalCheckCashEl = document.getElementById('totalCheckCash');
      var totalAmountEl = document.getElementById('totalAmount');
      var initialized = false;

      // Default configuration - can be overridden by JotForm widget settings
      var config = {
        columnHeaders: {
          borrower: 'Borrower Name',
          remitter: 'Remitter Name (if different)',
          paymentType: 'Cash or Check',
          checkCashAmount: 'Total Check/Cash Amount',
          effectiveDate: 'Effective Date',
          loanNumber: 'Loan Number',
          amount: 'Amount',
          remarks: 'Remarks/Comments/FH Code',
          actions: 'Actions'
        },
        paymentTypeOptions: ['Cash', 'Check', 'Money Order']
      };

      function applyWidgetSettings() {
        if (typeof JFCustomWidget === 'undefined') return;

        // Column Headers
        var borrowerLabel = JFCustomWidget.getWidgetSetting('labelBorrower');
        var remitterLabel = JFCustomWidget.getWidgetSetting('labelRemitter');
        var paymentTypeLabel = JFCustomWidget.getWidgetSetting('labelPaymentType');
        var checkCashAmountLabel = JFCustomWidget.getWidgetSetting('labelCheckCashAmount');
        var effectiveDateLabel = JFCustomWidget.getWidgetSetting('labelEffectiveDate');
        var loanNumberLabel = JFCustomWidget.getWidgetSetting('labelLoanNumber');
        var amountLabel = JFCustomWidget.getWidgetSetting('labelAmount');
        var remarksLabel = JFCustomWidget.getWidgetSetting('labelRemarks');
        var actionsLabel = JFCustomWidget.getWidgetSetting('labelActions');

        if (borrowerLabel) config.columnHeaders.borrower = borrowerLabel;
        if (remitterLabel) config.columnHeaders.remitter = remitterLabel;
        if (paymentTypeLabel) config.columnHeaders.paymentType = paymentTypeLabel;
        if (checkCashAmountLabel) config.columnHeaders.checkCashAmount = checkCashAmountLabel;
        if (effectiveDateLabel) config.columnHeaders.effectiveDate = effectiveDateLabel;
        if (loanNumberLabel) config.columnHeaders.loanNumber = loanNumberLabel;
        if (amountLabel) config.columnHeaders.amount = amountLabel;
        if (remarksLabel) config.columnHeaders.remarks = remarksLabel;
        if (actionsLabel) config.columnHeaders.actions = actionsLabel;

        // Payment Type Dropdown Options (comma-separated)
        var paymentOptions = JFCustomWidget.getWidgetSetting('paymentTypeOptions');
        if (paymentOptions && paymentOptions.trim() !== '') {
          config.paymentTypeOptions = paymentOptions.split(',').map(function(opt) {
            return opt.trim();
          }).filter(function(opt) {
            return opt !== '';
          });
        }
      }

      function buildHeaders() {
        headerRow.innerHTML = '';
        var headers = [
          config.columnHeaders.borrower,
          config.columnHeaders.remitter,
          config.columnHeaders.paymentType,
          config.columnHeaders.checkCashAmount,
          config.columnHeaders.effectiveDate,
          config.columnHeaders.loanNumber,
          config.columnHeaders.amount,
          config.columnHeaders.remarks,
          config.columnHeaders.actions
        ];

        headers.forEach(function(headerText) {
          var th = document.createElement('th');
          th.textContent = headerText;
          headerRow.appendChild(th);
        });
      }

      function formatCurrency(value) {
        var numberValue = Number(value);
        if (Number.isNaN(numberValue)) {
          return '$0.00';
        }
        return '$' + numberValue.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
      }

      function createCellInput(type, name, placeholder, required) {
        var input = document.createElement('input');
        input.type = type;
        input.name = name;
        input.autocomplete = 'off';
        input.setAttribute('autocomplete', 'off');
        input.setAttribute('data-lpignore', 'true');
        input.setAttribute('data-form-type', 'other');

        if (placeholder) {
          input.placeholder = placeholder;
        }
        if (required) {
          input.required = true;
        }
        if (type === 'number') {
          input.step = '0.01';
          input.min = '0';
        }
        input.addEventListener('input', handleInputChange);

        if (name === 'loanNumber') {
          input.addEventListener('input', validateLoanNumber);
          input.addEventListener('blur', validateLoanNumber);
          input.setAttribute('maxlength', '7');
          input.setAttribute('pattern', '[0-9]{6,7}');
        }

        return input;
      }

      function validateLoanNumber(event) {
        var input = event.target;
        var value = input.value.trim();

        if (value === '') {
          input.classList.remove('invalid');
          return;
        }

        var isValidFormat = /^\d{6,7}$/.test(value);
        if (isValidFormat) {
          input.classList.remove('invalid');
        } else {
          input.classList.add('invalid');
        }
      }

      function createSelect(name, options) {
        var select = document.createElement('select');
        select.name = name;
        select.autocomplete = 'off';
        select.setAttribute('autocomplete', 'off');

        options.forEach(function(optionValue) {
          var option = document.createElement('option');
          option.value = optionValue;
          option.textContent = optionValue;
          select.appendChild(option);
        });
        select.addEventListener('change', handleInputChange);
        return select;
      }

      function getNextBlankRow() {
        var rows = matrixBody.querySelectorAll('tr');
        for (var i = 0; i < rows.length; i++) {
          if (!isRowFilled(rows[i])) {
            return rows[i];
          }
        }
        return null;
      }

      function copyAllToNext(sourceRow) {
        var targetRow = getNextBlankRow();
        if (!targetRow || targetRow === sourceRow) {
          addRow();
          targetRow = getNextBlankRow();
        }
        if (targetRow && targetRow !== sourceRow) {
          targetRow.querySelector('[name="borrower"]').value = sourceRow.querySelector('[name="borrower"]').value;
          targetRow.querySelector('[name="remitter"]').value = sourceRow.querySelector('[name="remitter"]').value;
          targetRow.querySelector('[name="paymentType"]').value = sourceRow.querySelector('[name="paymentType"]').value;
          targetRow.querySelector('[name="checkCashAmount"]').value = sourceRow.querySelector('[name="checkCashAmount"]').value;
          targetRow.querySelector('[name="effectiveDate"]').value = sourceRow.querySelector('[name="effectiveDate"]').value;
          targetRow.querySelector('[name="loanNumber"]').value = sourceRow.querySelector('[name="loanNumber"]').value;

          var loanInput = targetRow.querySelector('[name="loanNumber"]');
          validateLoanNumber({ target: loanInput });

          ensureBlankRow();
          targetRow.querySelector('[name="amount"]').focus();
        }
      }

      function copyBorrowerToNext(sourceRow) {
        var targetRow = getNextBlankRow();
        if (!targetRow || targetRow === sourceRow) {
          addRow();
          targetRow = getNextBlankRow();
        }
        if (targetRow && targetRow !== sourceRow) {
          targetRow.querySelector('[name="borrower"]').value = sourceRow.querySelector('[name="borrower"]').value;
          targetRow.querySelector('[name="remitter"]').value = sourceRow.querySelector('[name="remitter"]').value;

          ensureBlankRow();
          targetRow.querySelector('[name="paymentType"]').focus();
        }
      }

      function addRow(defaults) {
        var row = document.createElement('tr');

        var borrowerCell = document.createElement('td');
        borrowerCell.appendChild(createCellInput('text', 'borrower', 'Borrower Name', true));
        row.appendChild(borrowerCell);

        var remitterCell = document.createElement('td');
        remitterCell.appendChild(createCellInput('text', 'remitter', 'Remitter Name'));
        row.appendChild(remitterCell);

        var cashCheckCell = document.createElement('td');
        cashCheckCell.appendChild(createSelect('paymentType', config.paymentTypeOptions));
        row.appendChild(cashCheckCell);

        var totalCell = document.createElement('td');
        totalCell.appendChild(createCellInput('number', 'checkCashAmount', '0.00'));
        row.appendChild(totalCell);

        var dateCell = document.createElement('td');
        dateCell.appendChild(createCellInput('date', 'effectiveDate'));
        row.appendChild(dateCell);

        var loanCell = document.createElement('td');
        loanCell.appendChild(createCellInput('text', 'loanNumber', 'Loan Number', true));
        row.appendChild(loanCell);

        var amountCell = document.createElement('td');
        amountCell.appendChild(createCellInput('number', 'amount', '0.00'));
        row.appendChild(amountCell);

        var remarksCell = document.createElement('td');
        remarksCell.appendChild(createCellInput('text', 'remarks', 'Remarks'));
        row.appendChild(remarksCell);

        var actionCell = document.createElement('td');
        actionCell.className = 'action-cell';

        var copyAllBtn = document.createElement('button');
        copyAllBtn.type = 'button';
        copyAllBtn.className = 'action-btn copy-all';
        copyAllBtn.textContent = 'Copy All';
        copyAllBtn.title = 'Copy borrower and loan info to next row';
        copyAllBtn.addEventListener('click', function() {
          copyAllToNext(row);
        });
        actionCell.appendChild(copyAllBtn);

        var copyBorrowerBtn = document.createElement('button');
        copyBorrowerBtn.type = 'button';
        copyBorrowerBtn.className = 'action-btn copy-borrower';
        copyBorrowerBtn.textContent = 'Copy Borrower';
        copyBorrowerBtn.title = 'Copy borrower info only to next row';
        copyBorrowerBtn.addEventListener('click', function() {
          copyBorrowerToNext(row);
        });
        actionCell.appendChild(copyBorrowerBtn);

        var removeBtn = document.createElement('button');
        removeBtn.type = 'button';
        removeBtn.className = 'action-btn remove-btn';
        removeBtn.textContent = 'Remove';
        removeBtn.title = 'Remove this row';
        removeBtn.setAttribute('tabindex', '-1');
        removeBtn.addEventListener('click', function() {
          var rows = matrixBody.querySelectorAll('tr');
          if (rows.length > 1) {
            row.remove();
            updateTotals();
            ensureBlankRow();
            notifyHeight();
          }
        });
        actionCell.appendChild(removeBtn);

        row.appendChild(actionCell);

        matrixBody.appendChild(row);

        if (defaults) {
          Object.keys(defaults).forEach(function(key) {
            var element = row.querySelector('[name="' + key + '"]');
            if (element) {
              element.value = defaults[key];
              if (key === 'loanNumber') {
                validateLoanNumber({ target: element });
              }
            }
          });
        }

        updateTotals();
        notifyHeight();
        return row;
      }

      function updateTotals() {
        var rows = matrixBody.querySelectorAll('tr');
        var totalCheckCash = 0;
        var totalAmount = 0;

        rows.forEach(function(row) {
          var checkCashValue = parseFloat(row.querySelector('[name="checkCashAmount"]').value) || 0;
          var amountValue = parseFloat(row.querySelector('[name="amount"]').value) || 0;
          totalCheckCash += checkCashValue;
          totalAmount += amountValue;
        });

        totalCheckCashEl.textContent = formatCurrency(totalCheckCash);
        totalAmountEl.textContent = formatCurrency(totalAmount);
      }

      function handleInputChange(event) {
        updateTotals();
        ensureBlankRow();
      }

      function isRowFilled(row) {
        var inputs = row.querySelectorAll('input, select');
        return Array.prototype.some.call(inputs, function(input) {
          if (input.type === 'number') {
            return input.value && parseFloat(input.value) !== 0;
          }
          return input.value && input.value.toString().trim() !== '';
        });
      }

      function ensureBlankRow() {
        var rows = matrixBody.querySelectorAll('tr');
        var hasBlankRow = false;

        for (var i = 0; i < rows.length; i++) {
          if (!isRowFilled(rows[i])) {
            hasBlankRow = true;
            break;
          }
        }

        if (!hasBlankRow) {
          addRow();
        }
      }

      function validateRows() {
        var rows = matrixBody.querySelectorAll('tr');
        var isValid = true;

        rows.forEach(function(row) {
          var borrower = row.querySelector('[name="borrower"]').value.trim();
          var loanNumber = row.querySelector('[name="loanNumber"]').value.trim();
          var amount = parseFloat(row.querySelector('[name="amount"]').value) || 0;
          var checkCash = parseFloat(row.querySelector('[name="checkCashAmount"]').value) || 0;

          var hasData = borrower !== '' || loanNumber !== '' || amount !== 0 || checkCash !== 0;

          if (hasData) {
            if (borrower === '' || loanNumber === '') {
              isValid = false;
            }
            if (loanNumber !== '' && !/^\d{6,7}$/.test(loanNumber)) {
              isValid = false;
            }
          }
        });

        return isValid;
      }

      function collectRows() {
        var rows = [];
        matrixBody.querySelectorAll('tr').forEach(function(row, index) {
          var borrower = row.querySelector('[name="borrower"]').value.trim();
          var loanNumber = row.querySelector('[name="loanNumber"]').value.trim();
          var amount = parseFloat(row.querySelector('[name="amount"]').value) || 0;
          var checkCash = parseFloat(row.querySelector('[name="checkCashAmount"]').value) || 0;

          var hasData = borrower !== '' || loanNumber !== '' || amount !== 0 || checkCash !== 0;

          if (hasData) {
            rows.push({
              rowNumber: rows.length + 1,
              borrower: borrower,
              remitter: row.querySelector('[name="remitter"]').value.trim(),
              paymentType: row.querySelector('[name="paymentType"]').value,
              checkCashAmount: parseFloat(row.querySelector('[name="checkCashAmount"]').value) || 0,
              effectiveDate: row.querySelector('[name="effectiveDate"]').value,
              loanNumber: loanNumber,
              amount: amount,
              remarks: row.querySelector('[name="remarks"]').value.trim()
            });
          }
        });

        return rows;
      }

      function buildSubmissionPayload() {
        var rows = collectRows();
        var totalCheckCash = 0;
        var totalAmount = 0;

        rows.forEach(function(row) {
          totalCheckCash += row.checkCashAmount;
          totalAmount += row.amount;
        });

        return {
          rows: rows,
          totalCheckCash: totalCheckCash,
          totalAmount: totalAmount,
          rowCount: rows.length
        };
      }

      function notifyHeight() {
        if (typeof JFCustomWidget !== 'undefined') {
          JFCustomWidget.requestFrameResize();
        }
      }

      function initializeWidget() {
        if (initialized) return;
        initialized = true;

        applyWidgetSettings();
        buildHeaders();

        addRow();
        addRow();
        notifyHeight();
      }

      // Initialize on DOM ready as fallback
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', function() {
          setTimeout(initializeWidget, 100);
        });
      } else {
        setTimeout(initializeWidget, 100);
      }

      // JotForm widget initialization
      if (typeof JFCustomWidget !== 'undefined') {
        JFCustomWidget.subscribe('ready', function() {
          initializeWidget();

          JFCustomWidget.subscribe('submit', function() {
            var isValid = validateRows();
            var payload = buildSubmissionPayload();

            var msg = {
              valid: isValid,
              value: JSON.stringify(payload)
            };

            if (!isValid) {
              msg.value = 'Please fill in all required fields (Borrower Name and Loan Number) for each row with valid data.';
            }

            JFCustomWidget.sendSubmit(msg);
          });
        });
      }
    })();
  </script>
</body>
</html>
