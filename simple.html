<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Dynamic Matrix Widget</title>
  <script src="//js.jotform.com/JotFormCustomWidget.min.js"></script>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      margin: 0;
      padding: 12px;
      color: #1a1a1a;
    }

    #main {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-width: 1200px;
    }

    .table-wrapper {
      overflow-x: auto;
    }

    .matrix-table {
      width: 100%;
      border-collapse: collapse;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.08);
    }

    .matrix-table th,
    .matrix-table td {
      border: 1px solid #dcdcdc;
      padding: 5px;
      vertical-align: middle;
    }

    .matrix-table th {
      background: #4a5568;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.02em;
      color: #ffffff;
      white-space: nowrap;
    }

    .matrix-table tbody tr:nth-child(odd) {
      background-color: #ffffff;
    }

    .matrix-table tbody tr:nth-child(even) {
      background-color: #f1f5f9;
    }

    .matrix-table input,
    .matrix-table select {
      width: 100%;
      box-sizing: border-box;
      padding: 6px 8px;
      font-size: 12px;
      border-radius: 4px;
      border: 1px solid #d1d5db;
      background: #fff;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .matrix-table input:focus,
    .matrix-table select:focus {
      outline: none;
      border-color: #2d6cdf;
      box-shadow: 0 0 0 2px rgba(45, 108, 223, 0.15);
    }

    .matrix-table input.invalid-loan {
      background-color: #fff3cd;
      border-color: #f0ad4e;
    }

    .matrix-table input.invalid-required {
      background-color: #fee2e2;
      border-color: #ef4444;
    }

    .actions-cell {
      white-space: nowrap;
      text-align: center;
      width: 90px;
    }

    .action-btn {
      border: none;
      padding: 5px 6px;
      border-radius: 4px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      transition: opacity 0.15s ease, transform 0.1s ease;
    }

    .action-btn:hover {
      opacity: 0.85;
      transform: scale(1.05);
    }

    .action-btn:focus {
      outline: 2px solid #2d6cdf;
      outline-offset: 2px;
    }

    .action-btn svg {
      width: 14px;
      height: 14px;
      fill: currentColor;
    }

    .btn-copy-all {
      background: #3b82f6;
      color: #fff;
    }

    .btn-copy-borrower {
      background: #8b5cf6;
      color: #fff;
    }

    .btn-remove {
      background: #ef4444;
      color: #fff;
    }

    .totals {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      font-weight: bold;
      font-size: 13px;
      flex-wrap: wrap;
    }

    .total-field {
      background: #9acd32;
      color: #0d2a00;
      padding: 6px 12px;
      border-radius: 4px;
      min-width: 120px;
      text-align: right;
    }

    /* Column width optimization */
    .col-borrower { min-width: 130px; }
    .col-remitter { min-width: 120px; }
    .col-payment { min-width: 90px; }
    .col-checkcash { min-width: 100px; }
    .col-date { min-width: 110px; }
    .col-loan { min-width: 90px; }
    .col-amount { min-width: 90px; }
    .col-remarks { min-width: 120px; }
    .col-actions { min-width: 90px; }

    /* Debug output - remove in production */
    #debugOutput {
      margin-top: 10px;
      padding: 10px;
      background: #f0f0f0;
      border: 1px solid #ccc;
      font-size: 11px;
      font-family: monospace;
      white-space: pre-wrap;
      word-break: break-all;
      max-height: 150px;
      overflow-y: auto;
      display: none;
    }

    #debugOutput.visible {
      display: block;
    }
  </style>
</head>
<body>
  <div id="main">
    <div class="table-wrapper">
      <table class="matrix-table" aria-label="Dynamic matrix">
        <thead>
          <tr>
            <th id="header-borrower" class="col-borrower">Borrower Name</th>
            <th id="header-remitter" class="col-remitter">Remitter Name</th>
            <th id="header-payment" class="col-payment">Payment Type</th>
            <th id="header-checkcash" class="col-checkcash">Check/Cash Amt</th>
            <th id="header-date" class="col-date">Effective Date</th>
            <th id="header-loan" class="col-loan">Loan Number</th>
            <th id="header-amount" class="col-amount">Amount</th>
            <th id="header-remarks" class="col-remarks">Remarks</th>
            <th class="col-actions">Actions</th>
          </tr>
        </thead>
        <tbody id="matrixBody"></tbody>
      </table>
    </div>
    <div class="totals">
      <div class="total-field">Check/Cash Total: <span id="totalCheckCash">$0.00</span></div>
      <div class="total-field">Amount Total: <span id="totalAmount">$0.00</span></div>
    </div>
    <div id="debugOutput"></div>
  </div>

  <script type="text/javascript">
    var matrixBody = document.getElementById('matrixBody');
    var totalCheckCashEl = document.getElementById('totalCheckCash');
    var totalAmountEl = document.getElementById('totalAmount');
    var debugOutput = document.getElementById('debugOutput');
    var initialized = false;
    var rowCounter = 0;

    // Default settings
    var settings = {
      paymentOptions: ['Cash', 'Check', 'Money Order'],
      headerLabels: {
        borrower: 'Borrower Name',
        remitter: 'Remitter Name',
        payment: 'Payment Type',
        checkcash: 'Check/Cash Amt',
        date: 'Effective Date',
        loan: 'Loan Number',
        amount: 'Amount',
        remarks: 'Remarks'
      }
    };

    function log(message) {
      console.log('[MatrixWidget]', message);
      if (debugOutput) {
        debugOutput.textContent = JSON.stringify(message, null, 2);
      }
    }

    function formatCurrency(value) {
      var num = parseFloat(value);
      if (isNaN(num)) return '$0.00';
      return '$' + num.toFixed(2);
    }

    function validateLoanNumber(value) {
      if (!value || value.trim() === '') return true; // Empty is okay, required check is separate
      var cleaned = value.replace(/\D/g, '');
      return cleaned.length >= 6 && cleaned.length <= 7;
    }

    function createInput(type, name, placeholder, rowId) {
      var input = document.createElement('input');
      input.type = type;
      input.name = name;
      input.setAttribute('data-row-id', rowId);
      input.setAttribute('autocomplete', 'off');
      input.setAttribute('autocorrect', 'off');
      input.setAttribute('autocapitalize', 'off');
      input.setAttribute('spellcheck', 'false');
      input.setAttribute('data-form-type', 'other');
      input.setAttribute('data-lpignore', 'true');

      if (placeholder) input.placeholder = placeholder;

      if (type === 'number') {
        input.step = '0.01';
        input.min = '0';
      }

      if (name === 'loanNumber') {
        input.setAttribute('maxlength', '7');
        input.setAttribute('pattern', '[0-9]{6,7}');
        input.addEventListener('input', function() {
          var val = this.value;
          if (val && !validateLoanNumber(val)) {
            this.classList.add('invalid-loan');
          } else {
            this.classList.remove('invalid-loan');
          }
        });
      }

      input.addEventListener('input', handleInputChange);
      input.addEventListener('change', handleInputChange);

      return input;
    }

    function createSelect(name, options, rowId) {
      var select = document.createElement('select');
      select.name = name;
      select.setAttribute('data-row-id', rowId);
      select.setAttribute('autocomplete', 'off');

      options.forEach(function(opt) {
        var option = document.createElement('option');
        option.value = opt;
        option.textContent = opt;
        select.appendChild(option);
      });

      select.addEventListener('change', handleInputChange);
      return select;
    }

    function createActionButton(type, title, rowId, tabIndex) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'action-btn btn-' + type;
      btn.setAttribute('aria-label', title);
      btn.setAttribute('title', title);
      btn.setAttribute('data-row-id', rowId);

      if (tabIndex === -1) {
        btn.setAttribute('tabindex', '-1');
      }

      var svgIcons = {
        'copy-all': '<svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>',
        'copy-borrower': '<svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>',
        'remove': '<svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>'
      };

      btn.innerHTML = svgIcons[type] || '';
      return btn;
    }

    function addRow(defaults) {
      rowCounter++;
      var rowId = 'row-' + rowCounter;
      var row = document.createElement('tr');
      row.setAttribute('data-row-id', rowId);

      // Borrower
      var borrowerCell = document.createElement('td');
      borrowerCell.appendChild(createInput('text', 'borrower', 'Borrower Name', rowId));
      row.appendChild(borrowerCell);

      // Remitter
      var remitterCell = document.createElement('td');
      remitterCell.appendChild(createInput('text', 'remitter', 'Remitter Name', rowId));
      row.appendChild(remitterCell);

      // Payment Type
      var paymentCell = document.createElement('td');
      paymentCell.appendChild(createSelect('paymentType', settings.paymentOptions, rowId));
      row.appendChild(paymentCell);

      // Check/Cash Amount
      var checkCashCell = document.createElement('td');
      checkCashCell.appendChild(createInput('number', 'checkCashAmount', '0.00', rowId));
      row.appendChild(checkCashCell);

      // Effective Date
      var dateCell = document.createElement('td');
      dateCell.appendChild(createInput('date', 'effectiveDate', '', rowId));
      row.appendChild(dateCell);

      // Loan Number
      var loanCell = document.createElement('td');
      loanCell.appendChild(createInput('text', 'loanNumber', 'Loan #', rowId));
      row.appendChild(loanCell);

      // Amount
      var amountCell = document.createElement('td');
      amountCell.appendChild(createInput('number', 'amount', '0.00', rowId));
      row.appendChild(amountCell);

      // Remarks
      var remarksCell = document.createElement('td');
      remarksCell.appendChild(createInput('text', 'remarks', 'Remarks', rowId));
      row.appendChild(remarksCell);

      // Actions
      var actionsCell = document.createElement('td');
      actionsCell.className = 'actions-cell';

      var copyAllBtn = createActionButton('copy-all', 'Copy All to Next Row', rowId, 0);
      copyAllBtn.addEventListener('click', function() {
        copyToNextRow(row, true);
      });

      var copyBorrowerBtn = createActionButton('copy-borrower', 'Copy Borrower to Next Row', rowId, 0);
      copyBorrowerBtn.addEventListener('click', function() {
        copyToNextRow(row, false);
      });

      var removeBtn = createActionButton('remove', 'Remove Row', rowId, -1);
      removeBtn.addEventListener('click', function() {
        removeRow(row);
      });

      actionsCell.appendChild(copyAllBtn);
      actionsCell.appendChild(copyBorrowerBtn);
      actionsCell.appendChild(removeBtn);
      row.appendChild(actionsCell);

      matrixBody.appendChild(row);

      // Apply defaults if provided
      if (defaults) {
        Object.keys(defaults).forEach(function(key) {
          var el = row.querySelector('[name="' + key + '"]');
          if (el && defaults[key]) {
            el.value = defaults[key];
          }
        });
      }

      updateTotals();
      notifyHeight();
      return row;
    }

    function copyToNextRow(sourceRow, copyAll) {
      var borrowerVal = sourceRow.querySelector('[name="borrower"]').value;
      var loanVal = sourceRow.querySelector('[name="loanNumber"]').value;
      var remitterVal = sourceRow.querySelector('[name="remitter"]').value;
      var paymentVal = sourceRow.querySelector('[name="paymentType"]').value;
      var checkCashVal = sourceRow.querySelector('[name="checkCashAmount"]').value;
      var dateVal = sourceRow.querySelector('[name="effectiveDate"]').value;

      var defaults = {
        borrower: borrowerVal
      };

      if (copyAll) {
        defaults.loanNumber = loanVal;
        defaults.remitter = remitterVal;
        defaults.paymentType = paymentVal;
        defaults.checkCashAmount = checkCashVal;
        defaults.effectiveDate = dateVal;
      }

      // Find the last row
      var rows = matrixBody.querySelectorAll('tr');
      var lastRow = rows[rows.length - 1];

      // If last row is empty, populate it; otherwise add new row
      if (lastRow && !isRowFilled(lastRow)) {
        Object.keys(defaults).forEach(function(key) {
          var el = lastRow.querySelector('[name="' + key + '"]');
          if (el && defaults[key]) {
            el.value = defaults[key];
          }
        });
        // Add another blank row
        addRow();
        lastRow.querySelector('[name="amount"]').focus();
      } else {
        var newRow = addRow(defaults);
        addRow(); // Add blank row after
        newRow.querySelector('[name="amount"]').focus();
      }
    }

    function removeRow(row) {
      var rows = matrixBody.querySelectorAll('tr');
      if (rows.length <= 2) {
        // Clear the row instead of removing if it's one of the last two
        var inputs = row.querySelectorAll('input, select');
        inputs.forEach(function(input) {
          if (input.tagName === 'SELECT') {
            input.selectedIndex = 0;
          } else {
            input.value = '';
          }
          input.classList.remove('invalid-loan', 'invalid-required');
        });
      } else {
        row.remove();
      }
      updateTotals();
      notifyHeight();
    }

    function isRowFilled(row) {
      var borrower = row.querySelector('[name="borrower"]').value.trim();
      var loanNumber = row.querySelector('[name="loanNumber"]').value.trim();
      var amount = row.querySelector('[name="amount"]').value;
      var checkCash = row.querySelector('[name="checkCashAmount"]').value;

      return borrower !== '' || loanNumber !== '' ||
             (amount && parseFloat(amount) > 0) ||
             (checkCash && parseFloat(checkCash) > 0);
    }

    function isLastRow(row) {
      var rows = matrixBody.querySelectorAll('tr');
      return rows.length > 0 && rows[rows.length - 1] === row;
    }

    function handleInputChange(event) {
      updateTotals();

      var row = event.target.closest('tr');
      if (row && isLastRow(row) && isRowFilled(row)) {
        addRow();
      }
    }

    function updateTotals() {
      var rows = matrixBody.querySelectorAll('tr');
      var totalCheckCash = 0;
      var totalAmount = 0;

      rows.forEach(function(row) {
        var cc = parseFloat(row.querySelector('[name="checkCashAmount"]').value) || 0;
        var amt = parseFloat(row.querySelector('[name="amount"]').value) || 0;
        totalCheckCash += cc;
        totalAmount += amt;
      });

      totalCheckCashEl.textContent = formatCurrency(totalCheckCash);
      totalAmountEl.textContent = formatCurrency(totalAmount);
    }

    function validateRows() {
      var rows = matrixBody.querySelectorAll('tr');
      var allValid = true;
      var hasFilledRows = false;

      rows.forEach(function(row) {
        var borrowerInput = row.querySelector('[name="borrower"]');
        var loanInput = row.querySelector('[name="loanNumber"]');
        var borrower = borrowerInput.value.trim();
        var loan = loanInput.value.trim();

        // Clear previous validation
        borrowerInput.classList.remove('invalid-required');
        loanInput.classList.remove('invalid-required');

        // Check if row has any data
        if (isRowFilled(row)) {
          hasFilledRows = true;

          if (!borrower) {
            borrowerInput.classList.add('invalid-required');
            allValid = false;
          }

          if (!loan) {
            loanInput.classList.add('invalid-required');
            allValid = false;
          } else if (!validateLoanNumber(loan)) {
            loanInput.classList.add('invalid-loan');
            allValid = false;
          }
        }
      });

      return allValid && hasFilledRows;
    }

    function collectData() {
      var rows = [];

      matrixBody.querySelectorAll('tr').forEach(function(row, index) {
        var borrower = row.querySelector('[name="borrower"]').value.trim();
        var loan = row.querySelector('[name="loanNumber"]').value.trim();

        // Only collect rows that have data
        if (isRowFilled(row)) {
          rows.push({
            rowNumber: index + 1,
            borrowerName: borrower,
            remitterName: row.querySelector('[name="remitter"]').value.trim(),
            paymentType: row.querySelector('[name="paymentType"]').value,
            checkCashAmount: parseFloat(row.querySelector('[name="checkCashAmount"]').value) || 0,
            effectiveDate: row.querySelector('[name="effectiveDate"]').value,
            loanNumber: loan,
            amount: parseFloat(row.querySelector('[name="amount"]').value) || 0,
            remarks: row.querySelector('[name="remarks"]').value.trim()
          });
        }
      });

      return rows;
    }

    function buildSubmissionPayload() {
      var rows = collectData();

      var totalCheckCash = 0;
      var totalAmount = 0;

      rows.forEach(function(row) {
        totalCheckCash += row.checkCashAmount;
        totalAmount += row.amount;
      });

      var payload = {
        rows: rows,
        rowCount: rows.length,
        totalCheckCash: totalCheckCash,
        totalAmount: totalAmount,
        submittedAt: new Date().toISOString()
      };

      return payload;
    }

    function notifyHeight() {
      if (typeof JFCustomWidget !== 'undefined' && JFCustomWidget.requestFrameResize) {
        setTimeout(function() {
          JFCustomWidget.requestFrameResize();
        }, 50);
      }
    }

    function applySettings() {
      // Apply header labels
      if (settings.headerLabels) {
        Object.keys(settings.headerLabels).forEach(function(key) {
          var header = document.getElementById('header-' + key);
          if (header) {
            header.textContent = settings.headerLabels[key];
          }
        });
      }
    }

    function initializeWidget() {
      if (initialized) return;
      initialized = true;

      applySettings();

      // Add first working row
      addRow();
      // Add second blank/optional row
      addRow();

      notifyHeight();

      log('Widget initialized with 2 rows');
    }

    // Initialize on DOM ready
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', function() {
        setTimeout(initializeWidget, 100);
      });
    } else {
      setTimeout(initializeWidget, 100);
    }

    // JotForm widget integration
    if (typeof JFCustomWidget !== 'undefined') {
      JFCustomWidget.subscribe('ready', function() {
        // Get custom settings from JotForm
        var paymentOpts = JFCustomWidget.getWidgetSetting('paymentOptions');
        if (paymentOpts) {
          try {
            var parsed = JSON.parse(paymentOpts);
            if (Array.isArray(parsed) && parsed.length > 0) {
              settings.paymentOptions = parsed;
            }
          } catch (e) {
            // Try comma-separated
            var opts = paymentOpts.split(',').map(function(s) { return s.trim(); });
            if (opts.length > 0) {
              settings.paymentOptions = opts;
            }
          }
        }

        // Get header labels
        var headerLabels = JFCustomWidget.getWidgetSetting('headerLabels');
        if (headerLabels) {
          try {
            var labels = JSON.parse(headerLabels);
            settings.headerLabels = Object.assign({}, settings.headerLabels, labels);
          } catch (e) {
            console.warn('Could not parse header labels');
          }
        }

        initializeWidget();

        // Subscribe to form submission
        JFCustomWidget.subscribe('submit', function() {
          var isValid = validateRows();
          var payload = buildSubmissionPayload();
          var jsonValue = JSON.stringify(payload);

          log({ valid: isValid, payload: payload });

          var msg = {
            valid: isValid,
            value: jsonValue
          };

          if (!isValid) {
            if (payload.rows.length === 0) {
              msg.value = 'Please add at least one complete row with Borrower Name and Loan Number.';
            } else {
              msg.value = 'Please ensure all rows have Borrower Name and valid Loan Number (6-7 digits).';
            }
          }

          JFCustomWidget.sendSubmit(msg);
        });
      });
    }
  </script>
</body>
</html>
