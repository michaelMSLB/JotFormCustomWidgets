<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <script src="//js.jotform.com/JotFormCustomWidget.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 8px;
    }

    #main {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    #parsedValue {
      width: 100%;
      box-sizing: border-box;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    #status {
      font-size: 12px;
      color: #666;
    }

    .error {
      color: #b00020;
    }
  </style>
</head>

<body>
  <div id="main">
    <input id="parsedValue" type="text" readonly />
    <div id="status"></div>
  </div>

  <script>
    (function () {
      let currentValue = "";

      const parsedInput = document.getElementById("parsedValue");
      const statusEl = document.getElementById("status");

      function getSetting(name, fallback = "") {
        const value = JFCustomWidget.getWidgetSetting(name);
        return value === undefined || value === null || value === "" ? fallback : value;
      }

      function setStatus(message, isError = false) {
        statusEl.textContent = message || "";
        statusEl.className = isError ? "error" : "";
      }

      function parseWithRegex(sourceValue, config) {
        try {
          const regex = new RegExp(config.pattern, config.flags);
          const match = String(sourceValue || "").match(regex);

          if (!match) {
            return {
              value: config.noMatchValue,
              error: null
            };
          }

          const groupIndex = Number(config.captureGroup || 0);
          const extracted = match[groupIndex] !== undefined ? match[groupIndex] : match[0];

          return {
            value: extracted,
            error: null
          };
        } catch (err) {
          return {
            value: "",
            error: "Invalid regex: " + err.message
          };
        }
      }

      function updateOutput(sourceValue, config) {
        const result = parseWithRegex(sourceValue, config);

        currentValue = result.value || "";
        parsedInput.value = currentValue;

        if (result.error) {
          setStatus(result.error, true);
        } else if (!currentValue) {
          setStatus("No match found.");
        } else {
          setStatus("Parsed value ready.");
        }

        JFCustomWidget.sendData({
          value: currentValue
        });
      }

      JFCustomWidget.subscribe("ready", function () {
        const config = {
          sourceFieldID: getSetting("SourceFieldID"),
          pattern: getSetting("RegexPattern"),
          flags: getSetting("RegexFlags"),
          captureGroup: getSetting("CaptureGroup", "1"),
          noMatchValue: getSetting("NoMatchValue", "")
        };

        if (!config.sourceFieldID || !config.pattern) {
          setStatus("Missing SourceFieldID or RegexPattern.", true);
          return;
        }

        /*
          These field-reading helpers are commonly used in Jotform field-transform widgets,
          but they are not listed in the short official Core Methods section.
          Test this in your Jotform account before relying on it broadly.
        */

        function refreshFromSourceField() {
          JFCustomWidget.getFieldsValueById([config.sourceFieldID], function (response) {
            const sourceValue =
              response &&
              response.data &&
              response.data[0] &&
              response.data[0].value
                ? response.data[0].value
                : "";

            updateOutput(sourceValue, config);
          });
        }

        refreshFromSourceField();

        JFCustomWidget.listenFromField(config.sourceFieldID, "change", function () {
          refreshFromSourceField();
        });

        JFCustomWidget.subscribe("submit", function () {
          JFCustomWidget.sendSubmit({
            valid: true,
            value: currentValue
          });
        });
      });
    })();
  </script>
</body>
</html>
